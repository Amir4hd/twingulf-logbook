function restoreView(){

async function peerStatus(){
  const out={me:navigator.onLine!==false&&S.online!==false,pack:'unknown'};
  if(!S.db)return out;
  try{
    const snap=await Promise.race([S.db.collection('sessions').limit(50).get({source:'server'}),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),6000))]);
    const rows=snap.docs.map(d=>d.data()).filter(x=>x&&(x.sts||x.ts));
    const T=x=>new Date(x.sts||x.ts).getTime();
    const now=rows.reduce((m,x)=>Math.max(m,T(x)),0); /* newest heartbeat = server time, so tablet clocks do not matter */
    const packs=rows.filter(x=>(x.place==='pack'||x.place==='all')&&now-T(x)<=4*60000);
    out.pack=packs.some(x=>x.ready!==false)?'online':(packs.length?'waiting':'offline');
  }catch(e){out.pack='unknown';}
  return out;
}

}

const DIE_LINES=['macaroni','spaghetti'];
const dieDefault=id=>id==='macaroni'?['M1','M2']:['S1','S2'];
function dieNames(id){const d=S.dies&&S.dies[id];return d&&d.names&&d.names.length?d.names:dieDefault(id);}
function dieEvents(id){const d=S.dies&&S.dies[id],ev=d&&d.events?d.events:{};return Object.keys(ev).filter(k=>ev[k]&&ev[k].at).map(k=>Object.assign({k:k},ev[k])).sort((a,b)=>a.at<b.at?-1:1);}
function dieInfo(id){
  const ev=dieEvents(id),dies=ev.filter(e=>e.type==='die'),now=Date.now(),cur=dies.length?dies[dies.length-1]:null;
  const segs=dies.map((e,i)=>({die:e.die,s:new Date(e.at).getTime(),e:i<dies.length-1?new Date(dies[i+1].at).getTime():now}));
  const names=dieNames(id).slice();ev.forEach(e=>{if(e.die&&names.indexOf(e.die)<0)names.push(e.die);});
  const per=names.map(n=>{const tf=ev.filter(e=>e.type==='teflon'&&e.die===n).pop();let ms=0;const t0=tf?new Date(tf.at).getTime():0;
    if(tf)segs.forEach(sg=>{if(sg.die!==n)return;const a=Math.max(sg.s,t0);if(sg.e>a)ms+=sg.e-a;});
    return {n:n,tf:tf,days:tf?(Number(tf.pre)||0)+ms/864e5:null,cur:!!(cur&&cur.die===n)};});
  return {cur:cur,per:per,since:cur?(now-new Date(cur.at).getTime())/864e5:null,names:names};
}
const dieShort=n=>'···'+String(n==null?'':n).slice(-3);
const dieLim=id=>{const d=S.dies&&S.dies[id],l=d&&d.limits||{};return {die:Number(l.die)>0?Number(l.die):4,teflon:Number(l.teflon)>0?Number(l.teflon):90};};
const dieOver=(days,lim)=>days!=null&&Math.floor(days)>lim;
const dieLeader=()=>adminEff()||!!(S.dev&&S.dev.place==='all');
const dieLeft=(since,lim)=>{if(since==null)return '';const r=lim-Math.floor(since);return '';};
const dieDays=d=>d==null?'–':(d<1?'today':Math.floor(d)+' d');
const dieWhen=iso=>{const d=new Date(iso);return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+pad(d.getHours())+':'+pad(d.getMinutes());};
function ensureDieSub(){

}

function rawPerm(){
  const sl=rawSlots()[S.raw.sel],L=leaderActive();
  if(!S.canWrite)return {can:false,cls:'bad',msg:'You can view this logbook but not save readings.'};
  if(S.raw.date>S.today)return {can:false,cls:'bad',msg:'This day has not started yet.'};
  const ts=rawSlotState(sl,S.raw.date),ex=RAWL.map(id=>rawEntry(S.raw.docs[id],sl)).filter(Boolean);
  let normal;
  if(ts.st==='open'){
    const lk=ex.filter(x=>editLeft(x.e)<=0);
    if(ex.length&&lk.length)normal={can:false,cls:'bad',lockable:true,msg:'Locked. Saved by '+lk[0].e.by+'. Changes are allowed for '+editMin()+' minutes after saving.'};
    else if(ex.length){const l=Math.min.apply(null,ex.map(x=>editLeft(x.e)));normal={can:true,cls:'ok',msg:'Saved by '+ex[0].e.by+'. You can change it for '+left5(l)+' more.'};}
    else normal={can:true,cls:'ok',msg:'Window open · '+ts.left+' min left.'};
  }else normal={can:false,cls:ts.st==='soon'?'warn':'bad',lockable:true,msg:ts.st==='soon'?'This window is closed. It opens in '+durTxt(ts.wait)+' ('+winText([[sl.s,sl.e]])+').':'This window is closed ('+winText([[sl.s,sl.e]])+'). Only a shift leader can fill or change it.'};
  if(normal.can)return normal;
  if(L)return {can:true,cls:'warn',msg:(adminEff()?'Admin':'Shift leader '+(S.unlock?S.unlock.name:''))+' override: this window can be filled or changed.'};
  return normal;
}

async function saveRaw(){
  if(!S.db)return toast('No database connection.',true);
  const pm=rawPerm();if(!pm.can){paintRawLock();toast(pm.msg,true);return;}
  const sl=rawSlots()[S.raw.sel],date=S.raw.date;
  const val={},miss=[];let alarms={};
  const line=aid=>area(aid).params.filter(p=>RAW_IDS.indexOf(p.id)>=0);
  RAWL.forEach(aid=>{val[aid]={};alarms[aid]=0;const off=rawLineOff(aid,sl);
    line(aid).forEach(p=>{const c=rawCtl(aid,p.id);if(!c)return;const raw=(c.value||'').trim();
      if((p.kind||'num')!=='num'){val[aid][p.id]=raw||null;return;}
      const n=num(raw);val[aid][p.id]=n;
      if(n==null){if(!p.opt&&!off){miss.push(RAW_T[aid]+' · '+p.label);c.closest('.fld').classList.add('need');}}
      else if(pState(p,n)!=='ok')alarms[aid]++;});});

  const txt=(ex.some(Boolean)?'Save changes to the raw material, film and carton values of ':'Save the raw material, film and carton values of ')+'Macaroni and Spaghetti ('+winText([[sl.s,sl.e]])+')?';

  else{who=await ask({title:'Do you want to save?',msg:txt,pw:true,ok:'Yes, save'});if(!who)return;}
  const L=adminEff()||leaderActive()||!!who.leader,ts=rawSlotState(sl,date);

    if(e1?!(L||(sameP(who,e1)&&editLeft(e1)>0)):!(ts.st==='open'||L)){paintRawLock();toast(e1?'Only the operator who saved this entry (within '+editMin()+' minutes) or a shift leader can change it.':'The window is closed. A shift leader can unlock it.',true);return;}}
  const btn=$('#rawSave');if(btn)btn.disabled=true;
  const nowIso=new Date().toISOString(),d=new Date(),sec=d.getHours()*3600+d.getMinutes()*60+d.getSeconds();
  try{
    for(let i=0;i<RAWL.length;i++){
      const aid=RAWL[i],e1=ex[i]&&ex[i].e,has=Object.keys(val[aid]).some(k=>val[aid][k]!=null);
      if(!has&&!e1)continue;
      const key=ex[i]?ex[i].k:'s'+(ts.st==='open'?sec:sl.s*60+d.getSeconds()),min=ex[i]?ex[i].min:(ts.st==='open'?Math.floor(sec/60):sl.s);
      const v=Object.assign({},e1&&e1.v||{});area(aid).params.forEach(p=>{if(!(p.id in v))v[p.id]=null;});
      Object.keys(val[aid]).forEach(k=>{v[k]=val[aid][k];});

/* ---------- line not running (macaroni / spaghetti) ---------- */
const LINE_TOG=['macaroni','spaghetti','boiler'];
const isLineTog=a=>!!a&&LINE_TOG.indexOf(a.id)>=0;
function lineOffAt(id,date,h){const L=S.lines&&S.lines[id];if(!L||!L.length)return false;const t=entTime(date,h*60);return L.some(p=>{const f=Date.parse(p.from);return t>=f&&(!p.to||t<Date.parse(p.to));});}
const lineOpen=id=>((S.lines&&S.lines[id])||[]).find(p=>!p.to)||null;
function lineRefresh(){
  try{
    if(S.view==='area'){paintLineBox();refreshStrip();}
    else if(S.view==='home'&&S.dev)renderHome();
    else if(S.view==='summary')paintSummary();
    else if(S.view==='admin'&&S.tab==='overview')paintTab();
  }catch(e){}
}
const LINE_EDIT_MIN=20;
function lineLast(id){let best=null;((S.lines&&S.lines[id])||[]).forEach(p=>{const t=Math.max(Date.parse(p.at||0)||0,Date.parse(p.toAt||0)||0);if(!best||t>best.t)best={p:p,t:t};});return best;}
function lineEditLeft(id){const l=lineLast(id);return l?LINE_EDIT_MIN*60e3-(Date.now()-l.t):0;}
function paintLineBox(){
  const el=$('#lineCtl');if(!el)return;
  const a=area(S.areaId);if(!isLineTog(a)){el.innerHTML='';return;}
  const o=lineOpen(a.id),left=lineEditLeft(a.id),can=!!lineLast(a.id)&&(adminEff()||left>0);
  const h=(o?'<button type="button" class="btn lnst stop" id="lineTg"><i></i>Stopped<small>since '+esc(dlbl(o.from))+'</small></button>':'<button type="button" class="btn lnst run" id="lineTg"><i></i>Running</button>')+(can?'<button type="button" class="btn sm" id="lineEd">Edit'+(left>0?' · '+left5(left)+' left':'')+'</button>':'');
  if(el.dataset.h===h)return;el.dataset.h=h;el.innerHTML=h;
  const b1=$('#lineTg');if(b1)b1.onclick=()=>lineDlg(a.id,!!lineOpen(a.id));
  const b3=$('#lineEd');if(b3)b3.onclick=()=>lineEdit(a.id);
}
const locDT=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,16);};
async function lineWrite(offs){await S.db.doc('logs/lines_status').set({offs:offs});S.lines=offs;}
function lineDlg(id,restart){
  const a=area(id),o=lineOpen(id);
  const w=rmOvl('lineDlg','<h2 style="margin:0 0 6px">'+(restart?'Line is running again':'Line stopped')+' · '+esc(a.name)+'</h2><p class="muted">'+(restart?'Enter the time it started. Hourly readings are expected again from this time. ':'Enter the time it stopped. ')+'</p><p class="muted">'+(restart?'You can edit this for '+LINE_EDIT_MIN+' minutes after saving.':'From this time, hours without a reading are not counted as missed and are not shown red. Press the green/amber button again when production restarts. You can edit this for '+LINE_EDIT_MIN+' minutes after saving.')+'</p>'+
    '<label class="l">'+(restart?'Running again from':'Not running since')+'<input type="datetime-local" id="lnT" value="'+locDT(new Date())+'" max="'+locDT(new Date())+'" min="'+locDT(restart&&o?new Date(o.from):new Date(Date.now()-14*864e5))+'"></label>'+
    '<div class="row" style="margin-top:12px"><button type="button" class="btn big cyan" id="lnX">Cancel</button><button type="button" class="btn pri big" id="lnOk">Continue</button></div>');
  $('#lnX').onclick=()=>w.remove();
  $('#lnOk').onclick=async()=>{
    const v=$('#lnT').value;if(!v){toast('Choose the time.',true);return;}
    const t=new Date(v);if(isNaN(t)||t.getTime()>Date.now()+60000){toast('The time cannot be in the future.',true);return;}
    if(restart&&o&&t.getTime()<Date.parse(o.from)){toast('That is before the line stopped.',true);return;}
    const who=await ask({title:restart?'Line started again?':'Mark the line as not running?',msg:a.name+' · '+(restart?'running again from ':'not running since ')+dlbl(t.toISOString())+'. Shift leader or admin only.',pw:true,leaderOnly:true,ok:'Yes, save'});if(!who)return;
    try{
      const offs=JSON.parse(JSON.stringify(S.lines||{}));offs[id]=offs[id]||[];
      if(restart){const op=offs[id].find(p=>!p.to);if(!op){toast('The line is already running.',true);w.remove();return;}op.to=t.toISOString();op.toBy=who.name;op.toAt=new Date().toISOString();}
      else{if(offs[id].some(p=>!p.to)){toast('The line is already marked not running.',true);w.remove();return;}offs[id].push({from:t.toISOString(),to:null,by:who.name,at:new Date().toISOString()});}
      await lineWrite(offs);w.remove();toast(restart?a.name+' is running again.':a.name+' marked as not running.');lineRefresh();
    }catch(e){toast(dbErr(e),true);}
  };
}
function lineEdit(id){
  const a=area(id),lastP=lineLast(id);let L=((S.lines&&S.lines[id])||[]).map((p,i)=>({p:p,i:i})).sort((x,y)=>x.p.from<y.p.from?1:-1).slice(0,8);
  if(!adminEff())L=L.filter(x=>lastP&&x.p===lastP.p);
  const mx=locDT(new Date());
  const w=rmOvl('lineEd','<h2 style="margin:0 0 6px">Edit not-running times · '+esc(a.name)+'</h2><p class="muted">Fix a wrong date or time, or remove a period. Leave “Running again from” empty if the line is still stopped.</p>'+
    L.map((x,k)=>'<div class="card slim" style="margin:8px 0" data-k="'+k+'"><div class="row" style="flex-wrap:wrap"><label class="l" style="flex:1;min-width:200px">Not running since<input type="datetime-local" class="lf" value="'+locDT(x.p.from)+'" max="'+mx+'"></label><label class="l" style="flex:1;min-width:200px">Running again from<input type="datetime-local" class="lt" value="'+(x.p.to?locDT(x.p.to):'')+'" max="'+mx+'"></label></div><label class="row small" style="margin-top:6px;gap:8px"><input type="checkbox" class="ld"> Remove this period</label></div>').join('')+
    '<div class="row" style="margin-top:12px"><button type="button" class="btn big cyan" id="leX">Cancel</button><button type="button" class="btn pri big" id="leOk">Continue</button></div>');
  $('#leX').onclick=()=>w.remove();
  $('#leOk').onclick=async()=>{
    const offs=JSON.parse(JSON.stringify(S.lines||{}));const keep=[];let open=0;
    for(const row of $$('[data-k]',w)){
      const x=L[+row.dataset.k];if($('.ld',row).checked)continue;
      const f=$('.lf',row).value,t=$('.lt',row).value;if(!f){toast('Enter the time it stopped.',true);return;}
      const fd=new Date(f),td=t?new Date(t):null;
      if(fd.getTime()>Date.now()+60000||(td&&td.getTime()>Date.now()+60000)){toast('A time cannot be in the future.',true);return;}
      if(td&&td<=fd){toast('Running again must be after it stopped.',true);return;}
      if(!td)open++;
      keep.push({i:x.i,v:Object.assign({},x.p,{from:fd.toISOString(),to:td?td.toISOString():null})});
    }
    if(open>1){toast('Only one period can still be stopped.',true);return;}
    const who=await ask({title:'Save the changes?',msg:a.name+' · not-running times. Shift leader or admin only.',pw:true,leaderOnly:true,ok:'Yes, save'});if(!who)return;
    try{
      const all=offs[id]||[];const ids=L.map(x=>x.i);
      const rest=all.filter((p,i)=>ids.indexOf(i)<0);
      const next=rest.concat(keep.map(k=>Object.assign(k.v,{editedBy:who.name,editedAt:new Date().toISOString()})));
      if(next.filter(p=>!p.to).length>1){toast('Only one period can still be stopped.',true);return;}
      offs[id]=next;await lineWrite(offs);w.remove();toast('Saved.');lineRefresh();
    }catch(e){toast(dbErr(e),true);}
  };

function msgTimes(w,now){

function shiftBoxes(el){

  const sh=(S.cfg&&S.cfg.shifts||[]).slice().sort((a,b)=>a.start-b.start);if(sh.length<2)return;
  const hourOf=r=>{if(r.dataset.h!=null&&r.dataset.h!=='')return Number(r.dataset.h);const k=r.dataset.k||'';if(k.charAt(0)==='s')return Math.floor(Number(k.slice(1))/3600);return null;};
  const groups=[],byName={};
  Array.from(t.tBodies[0].rows).forEach(r=>{const h=hourOf(r);if(h==null)return;const n=shiftOf(h);let g=byName[n];if(!g){g=byName[n]={name:n,rows:[]};groups.push(g);}g.rows.push(r);});
  if(!groups.length)return;
  const rng=n=>{const i=sh.findIndex(x=>x.name===n);if(i<0)return '';const a=sh[i].start,b=sh[(i+1)%sh.length].start;return hh(a)+' – '+hh(b);};
  const wrap=document.createElement('div');
  groups.forEach(g=>{
    const box=document.createElement('section');box.className='shbox';
    box.innerHTML='<div class="shhd"><b>'+esc(g.name)+'</b><span class="muted small">'+esc(rng(g.name))+' · '+g.rows.length+' '+(g.rows.length===1?'entry':'entries')+'</span></div><div class="tscroll"><table><thead>'+t.tHead.innerHTML+'</thead><tbody></tbody></table></div>';

async function delIssue(){
  const it=(S.areaIss||[]).find(x=>x.id===S.issEdit);
  if(!it||issLeft(it)<=0){toast('The edit time has passed.',true);endIssEdit();paintAreaIssues();return;}
  const who=await ask({title:'Delete this request?',msg:it.equipment+': '+it.text,pw:true,ok:'Yes, delete'});if(!who)return;
  if(!sameP(who,{by:it.by,byId:it.byId})){toast('Only the operator who sent it can delete it.',true);return;}
  try{await S.db.doc('issues/'+it.id).delete();endIssEdit();toast('Request deleted.');}catch(e){toast(dbErr(e),true);}
}
async function sendIssue(){
  const tx=($('#isTx').value||'').trim();if(!tx){toast('Describe the problem first.',true);return;}
  const eq=$('#isEq').value,editing=S.issEdit?(S.areaIss||[]).find(i=>i.id===S.issEdit):null;
  if(S.issEdit&&(!editing||issLeft(editing)<=0)){toast('The edit time has passed.',true);endIssEdit();paintAreaIssues();return;}
  if(!editing){
    const dup=(S.areaIss||[]).find(i=>i.area===S.areaId&&i.status==='open'&&i.equipment===eq);
    if(dup&&!await ask({title:'Already reported',msg:'"'+dup.equipment+'" already has an open request sent '+dlbl(dup.ts)+' by '+dup.by+': '+dup.text+'. Send another one?',ok:'Yes, send again'}))return;
  }
  const who=await ask({title:editing?'Save the changes?':'Send this problem report?',msg:eq+': '+tx,pw:true,ok:editing?'Yes, save changes':'Yes, send'});if(!who)return;
  try{
    if(editing){
      if(!sameP(who,{by:editing.by,byId:editing.byId})){toast('Only the operator who sent it can change it.',true);return;}
      await S.db.doc('issues/'+editing.id).update({equipment:eq,text:tx,edited:true,editedAt:new Date().toISOString()});
      endIssEdit();toast('Request updated.');
    }else{
      await S.db.collection('issues').add({area:S.areaId,equipment:eq,text:tx,by:who.name,byId:who.id||null,ts:new Date().toISOString(),status:'open'});
      endIssEdit();toast('Sent to maintenance.');
    }
  }catch(e){toast(dbErr(e),true);}
}

function dayStats(a,date){
  const doc=S.logs[a.id+'_'+date],es=entries(doc);
  if(a.timed){
    let down=0,alarms=0,due=0,missed=0;const runH={};
    es.forEach(x=>{if(x.e.run===false)down+=x.e.down||0;else runH[x.h]=1;alarms+=x.e.alarms||0;});
    if(a.every==='shift')shiftWindows(date).forEach(w=>{if(!w.ended)return;due++;if(!es.some(x=>w.segs.some(sg=>om(x.min)>=sg[0]&&om(x.min)<sg[1])))missed++;});
    return {logged:es.length,missed,run:Object.keys(runH).length,down,alarms,due,timed:true};
  }
  const hrs={};es.forEach(x=>{hrs[x.h]=x.e;});
  const lastDue=date<S.today?23:(date===S.today?ordH(nowH())-1:-1);
  let logged=0,missed=0,run=0,down=0,alarms=0,due=0;
  HRS().forEach((h,k)=>{const e=hrs[h];if(e){logged++;if(e.run===false)down+=(e.down||0);else run++;alarms+=e.alarms||0;}
    if(k<=lastDue){if(!e&&lineOffAt(a.id,date,h))return;due++;if(!e)missed++;}});
  return {logged,missed,run,down,alarms,due};
}

async function lvUpdate(silent){
  const V=S.lvl;if(!V||!V.start||!S.db)return;
  const to=addDays(S.today,-1);let from=V.through?addDays(V.through,1):V.start;if(from<V.start)from=V.start;
  if(from>to){if(!silent)toast('Already up to date.');return;}
  const totals=JSON.parse(JSON.stringify(V.totals||{})),lv=Object.assign({},V.lv||{});
  try{
    let f=from;
    while(f<=to){let e=addDays(f,13);if(e>to)e=to;
      const D=await ptFetch(f,e),rows=ptCompute(D,f,e);
      rows.forEach(r=>{const k=lvKey(r.name),t=totals[k]||{n:r.name,pts:0};t.n=r.name;t.pts=Math.round((t.pts+r.pts)*10)/10;totals[k]=t;});
      f=addDays(e,1);}
    const th=lvTh();Object.keys(totals).forEach(k=>{let L=1;th.forEach(x=>{if(totals[k].pts>=x)L++;});lv[k]=Math.max(lv[k]||1,L);});
    const nd=Object.assign({},V,{totals:totals,lv:lv,through:to});
    await S.db.doc('config/levels').set(nd);S.lvl=nd;if(!silent)toast('Levels updated.');
  }catch(er){if(!silent)toast(dbErr(er),true);}
  if(S.pt&&$('#ptBody'))paintPoints();
}

const PT_DEF={hourly:1,late:0.5,pack:1,lab:2,clean:1,cleanConfirm:1,needConfirm:1,notice:2,arrived:1,issue:2,closed:3,pm:3,die:2,capN:3};
const PT_LBL=[['hourly','Hourly reading on time'],['late','Hourly reading late'],['pack','Packaging entry'],['lab','Laboratory entry'],['clean','Cleaning part ticked'],['cleanConfirm','Shift leader confirms cleaning'],['notice','Message to packaging'],['arrived','Marked product arrived'],['issue','Request sent to maintenance'],['closed','Request finished (maintenance)'],['pm','Preventive job done'],['die','Die / Teflon record']];
const PT_ROLES=['Press','Packaging','Laboratory','Maintenance'];
S.pt={range:'week',role:'all',rows:null,loading:false,err:''};
const ptCfg=()=>Object.assign({},PT_DEF,S.ptCfg||{});
function ptRange(k){
  const t=parseYmd(S.today),dow=(t.getDay()+6)%7;let f,e;
  if(k==='week'){f=addDays(S.today,-dow);e=S.today;}
  else if(k==='lastweek'){f=addDays(S.today,-dow-7);e=addDays(S.today,-dow-1);}
  else if(/^w\d$/.test(k)){f=addDays(S.today,-dow-7*(Number(k.slice(1))-1));e=S.today;}
  else if(k==='start'&&S.lvl&&S.lvl.start){f=S.lvl.start;e=S.today;}
  else if(k==='month'){f=S.today.slice(0,8)+'01';e=S.today;}
  else{f=ymd(new Date(t.getFullYear(),t.getMonth()-1,1));e=ymd(new Date(t.getFullYear(),t.getMonth(),0));}
  return [f,e];
}
function ptCompute(D,f,e){
  const C=ptCfg(),P={};
  const get=(name,role)=>{const nm=String(name||'').trim();if(!nm||/^admin$/i.test(nm))return null;const k=nm.toLowerCase();return P[k]||(P[k]={name:nm,pts:0,r:{Press:0,Packaging:0,Laboratory:0,Maintenance:0},rd:0,ot:0,rdN:0,exp:0,sh:{},cl:0,msg:0,req:0,mt:0,oth:0});};
  const add=(p,role,v,cat)=>{if(!p||!v)return;p.pts+=v;p.r[role]+=v;if(cat)p[cat]+=v;};
  const inR=ts=>{if(!ts)return false;const d=ymd(new Date(ts));return d>=f&&d<=e;};
  D.logs.forEach(d=>{
    const ar=String(d.area||''),a=area(ar);
    if(ar==='dies'||ar==='regr'||ar==='clean_plan'||ar.indexOf('dies_')===0)return;
    const role=ar.indexOf('pack_')===0?'Packaging':(ar.indexOf('lab_')===0||ar.indexOf('rm')===0?'Laboratory':'Press');
    entries(d).forEach(x=>{const en=x.e;if(!en||!en.by)return;const p=get(en.by);if(!p)return;
      let v=en.late?C.late:C.hourly;
      if(role==='Packaging'){v=C.pack;}else if(role==='Laboratory'){v=C.lab;}
      add(p,role,v,null);p.rd++;if(!en.late)p.ot++;

async function exportCsv(){

  msg.textContent='Collecting data…';
  try{
    const snap=await S.db.collection('logs').where('date','>=',f).where('date','<=',t).limit(1000).get();
    const docs=snap.docs.map(d=>d.data()).filter(d=>d.area===ar.id).sort((a,b)=>a.date<b.date?-1:1);
    const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
    const head=['Date','Time','Shift','Operator','Running','Downtime min','Downtime reason'].concat(ar.params.map(p=>p.label+' ('+p.unit+')'),['Out of range','Late entry','Notes']);
    const rows=[head.map(q).join(',')];let n=0;
    docs.forEach(d=>entries(d).forEach(x=>{const e=x.e;n++;
      rows.push([realDate(d.date,x.min),hm(x.min),shiftOf(x.h),e.by,e.run===false?'No':'Yes',e.down||0,e.why||''].concat(ar.params.map(p=>e.v&&e.v[p.id]!=null?e.v[p.id]:''),[e.alarms||0,e.late?'Yes':'',e.note||'']).map(q).join(','));}));
    if(!n){msg.textContent='No readings for that area and period.';return;}
    const dl=await window.claude.use('downloads');

    await dl.save({filename:ar.id+'_'+f+'_to_'+t+'.csv',data:'﻿'+rows.join('\r\n')});
    msg.textContent=n+' rows exported.';
  }catch(e){msg.textContent=(e&&e.code==='declined')?'Download cancelled.':dbErr(e);}
}

function prPack(date,docs,rg,shift){

async function prBuild(type,dates,shiftSel){
  const get=async id=>{if(!S.db)return {hours:{}};const sn=await S.db.doc('logs/'+id).get();return sn.exists?sn.data():{hours:{}};};
  const want=[];if(shiftSel!=='night')want.push(false);if(shiftSel!=='day')want.push(true);
  const out=await Promise.all(dates.map(async date=>{
    if(type==='macaroni'||type==='spaghetti'){const a=area(type),d=await get(a.id+'_'+date);return want.map(n=>prLine(a,date,d,n)).join('');}
    if(type==='boiler'){return prBoiler(area('boiler'),date,await get('boiler_'+date));}
    if(type==='ro'){return prRO(area('ro'),date,await get('ro_'+date));}
    if(type==='lab'){return prLab(date,await Promise.all([get('lab_mac_'+date),get('lab_spa_'+date)]));}
    if(type==='pack'){const ds=await Promise.all([get('pack_mac_'+date),get('pack_spa_'+date),get('regr_'+date)]);return want.map(n=>prPack(date,ds,ds[2],n?'night':'day')).join('');}
    return '';}));
  return out.join('');
}

/* ---- maintenance ---- */
function allLogs(){return Object.assign({},S.mlogs,S.logs);}
const MACHINES=[{id:'macaroni',name:'Macaroni line',kind:'meter',area:'macaroni',param:'line_hm',eq:'General'},{id:'spaghetti',name:'Spaghetti line',kind:'meter',area:'spaghetti',param:'line_hm',eq:'General'},{id:'chiller',name:'Chiller',kind:'meter',area:'boiler',param:'chiller_hm',eq:'Chiller'},{id:'ro',name:'Reverse osmosis (RO)',kind:'meter',area:'ro',param:'op_hours',eq:'General'},{id:'ro_comp',name:'Air compressor',kind:'meter',area:'ro',param:'ro_comp_hm',eq:'RO compressor'}];
const machine=id=>MACHINES.find(m=>m.id===id)||null;
const CATS=[{id:'macaroni',name:'Macaroni Line',area:'macaroni',mach:'macaroni',eq:'General'},{id:'spaghetti',name:'Spaghetti Line',area:'spaghetti',mach:'spaghetti',eq:'General'},{id:'boiler',name:'Boiler',area:'boiler',mach:'',eq:'Boiler'},{id:'chiller',name:'Chiller',area:'boiler',mach:'chiller',eq:'Chiller'},{id:'aircomp',name:'Air Compressor',area:'ro',mach:'ro_comp',eq:'RO compressor'},{id:'ro',name:'RO',area:'ro',mach:'ro',eq:'General'}];
function catOf(t){
  if(t.cat&&(t.cat==='other'||CATS.some(c=>c.id===t.cat)))return t.cat;
  const mm={macaroni:'macaroni',spaghetti:'spaghetti',chiller:'chiller',ro:'ro',ro_comp:'aircomp'}[t.machine];if(mm)return mm;
  if(t.area==='macaroni'||t.area==='spaghetti'||t.area==='ro')return t.area;
  if(t.area==='boiler')return t.equipment==='Chiller'?'chiller':'boiler';
  return 'other';
}
function meterReads(m){
  const out=[],logs=allLogs();
  Object.keys(logs).forEach(id=>{const d=logs[id];if(d.area!==m.area)return;entries(d).forEach(x=>{const v=x.e&&x.e.v?num(x.e.v[m.param]):null;if(v!=null)out.push({t:d.date+pad(ordH(x.h))+pad(x.min%60),v:v,date:d.date,h:x.h,mi:x.min%60});});});
  out.sort((p,q)=>p.t<q.t?-1:p.t>q.t?1:0);return out;
}
function curMeter(id){const m=machine(id);if(!m||m.kind!=='meter')return null;const r=meterReads(m);return r.length?r[r.length-1].v:null;}
const meterLast=id=>{const m=machine(id);if(!m||m.kind!=='meter')return null;const r=meterReads(m);return r.length?r[r.length-1]:null;};
function meterChip(c){
  const m=c.mach?machine(c.mach):null;if(!m)return '';
  const r=meterLast(c.mach);
  return ' <span class="chip" style="font-size:13px;vertical-align:middle;background:var(--panel2);border:1px solid var(--line);color:var(--ink)">'+(c.id==='ro'?'Operation hours':'Hour meter')+': '+(r?'<b class="mono">'+r.v+' h</b> <span class="muted">· '+esc(r.date)+' '+pad(r.h)+':'+pad(r.mi)+'</span>':'no reading yet')+'</span>';
}
function pmState(t){
  const m=machine(t.machine),days=daysBetween(t.lastDone||S.today,S.today);
  let hrs=0,cur=null,noMeter=false,base0=null;
  if(m&&m.kind==='meter'){
    const rs=meterReads(m);cur=rs.length?rs[rs.length-1].v:null;noMeter=cur==null;
    let b0=t.baseHm!=null?num(t.baseHm):null;
    if(b0==null){const bt=(t.lastDone||S.today)+pad(t.lastHour==null?0:ordH(t.lastHour))+'00',r0=rs.find(x=>x.t>=bt);b0=r0?r0.v:null;}
    hrs=(cur!=null&&b0!=null)?Math.max(0,Math.round((cur-b0)*10)/10):0;base0=b0;
  }else{
    const base=(t.lastDone||S.today)+pad(t.lastHour==null?0:ordH(t.lastHour)),logs=allLogs(),ar=m?m.area:t.area;
    Object.keys(logs).forEach(id=>{const d=logs[id];if(d.area!==ar)return;const seen={};entries(d).forEach(x=>{const kk=d.date+pad(ordH(x.h));if(kk>=base&&x.e.run===true&&!seen[kk]){seen[kk]=1;hrs++;}});});
  }
  const rh=t.intervalHours>0?hrs/t.intervalHours:0,rd=t.intervalDays>0?days/t.intervalDays:0,r=Math.max(rh,rd);
  const rem=t.intervalHours>0?Math.round((t.intervalHours-hrs)*10)/10:null;
  return {hrs,days,r,cur,noMeter,m,rem,b0:base0,status:r>=1?'overdue':r>=0.9?'soon':'ok'};
}

  return '<details class="d" id="mtForm"><summary id="mtSum">Add maintenance task</summary><div style="display:grid;gap:12px;margin-top:12px"><div class="ctlrow"><label class="l" style="flex:2 1 260px">Task<input type="text" id="mtName" placeholder="e.g. Vacuum pump oil change"></label>'+

function fillMtEq(sel){const ar=area($('#mtArea').value);$('#mtEq').innerHTML=ar.equipment.concat(['General']).map(e=>'<option'+(e===sel?' selected':'')+'>'+esc(e)+'</option>').join('');}
function bindMaint(){
  fillMtEq();$('#mtArea').onchange=()=>fillMtEq();
  const fillBase=()=>{if(S.editTask)return;const cm=curMeter($('#mtMach').value);$('#mtBase').value=cm==null?'':cm;};
  $('#mtCat').onchange=()=>{const c=CATS.find(x=>x.id===$('#mtCat').value);if(c){$('#mtArea').value=c.area;fillMtEq(c.eq);$('#mtMach').value=c.mach;}fillBase();};
  $('#mtCat').onchange();

function resetTaskForm(){$('#mtName').value='';$('#mtH').value='';$('#mtBase').value='';$('#mtD').value='';$('#mtMach').value='';$('#mtCat').onchange();$('#mtSum').textContent='Add maintenance task';$('#mtCancel').hidden=true;$('#mtForm').open=false;}
async function saveTask(){
  const name=$('#mtName').value.trim(),h=Number($('#mtH').value)||0,d=Number($('#mtD').value)||0;
  if(!name){toast('Name the task first.',true);return;}
  if(!h&&!d){toast('Set an interval in running hours, days, or both.',true);return;}
  const data={name,cat:$('#mtCat').value,area:$('#mtArea').value,equipment:$('#mtEq').value,machine:$('#mtMach').value,intervalHours:h,intervalDays:d};
  const bv=$('#mtBase').value.trim(),bn=bv===''?null:Number(bv);
  if(bn!=null&&(!isFinite(bn)||bn<0)){toast('The hour meter at last service must be a number.',true);return;}
  if(bn!=null&&!(machine(data.machine)&&machine(data.machine).kind==='meter')){toast('Hour meter at last service only applies to machines with an hour meter.',true);return;}
  if(!await ask({title:'Do you want to save?',msg:'Maintenance task: '+name,pw:!adminEff(),ok:'Yes, save'}))return;
  try{
    if(S.editTask){const old=S.tasks.find(x=>x.id===S.editTask);if(bn!=null)data.baseHm=bn;else if(!old||(old.machine||'')!==data.machine)data.baseHm=curMeter(data.machine);await S.db.doc('maint_tasks/'+S.editTask).update(data);}
    else await S.db.collection('maint_tasks').add(Object.assign(data,{baseHm:bn!=null?bn:curMeter(data.machine),lastDone:S.today,lastHour:nowH(),doneBy:'Start of tracking'}));
    S.editTask=null;resetTaskForm();toast('Task saved.');
  }catch(e){toast(dbErr(e),true);}
}

function resetJobForm(){S.editJob=null;['jbName','jbWho','jbNote','jbDate'].forEach(i=>{$('#'+i).value='';});$('#jbSum').textContent='Add planned job';$('#jbCancel').hidden=true;$('#jbForm').open=false;}
function bindJobs(){const b=$('#jbSave');if(b)b.onclick=saveJob;const c=$('#jbCancel');if(c)c.onclick=resetJobForm;}

function paintJobs(){
  const el=$('#jbBody');if(!el)return;
  const L=(S.jobs||[]).slice().sort((a,b)=>String(a.due||'9999').localeCompare(String(b.due||'9999'))||String(a.ts||'').localeCompare(String(b.ts||'')));
  const row=j=>{const a=area(j.area),od=j.due&&j.due<S.today;

  $$('button[data-jact]',el).forEach(b=>b.onclick=()=>jobAct(b));

async function jobAct(b){
  const id=b.dataset.id,j=(S.jobs||[]).find(x=>x.id===id);if(!j)return;
  try{
    if(b.dataset.jact==='edit'){
      S.editJob=id;$('#jbName').value=j.name||'';$('#jbArea').value=j.area||'general';$('#jbDate').value=j.due||'';$('#jbWho').value=j.who||'';$('#jbNote').value=j.note||'';$('#jbSum').textContent='Edit planned job';$('#jbCancel').hidden=false;$('#jbForm').open=true;$('#jbForm').scrollIntoView({block:'center'});return;
    }
    if(b.dataset.jact==='del'){
      const who=await ask({title:'Delete this job?',msg:j.name+' will be removed from the list.',pw:!adminEff(),ok:'Yes, delete'});if(!who)return;
      await S.db.doc('maint_tasks/'+id).delete();toast('Job deleted.');return;
    }
    const who=await ask({title:'Mark as done?',msg:j.name,pw:!adminEff(),ok:'Yes, mark done'});if(!who)return;
    const by=adminEff()?'Admin':who.name,note=j.note||'';
    const hr=await S.db.collection('maint_history').add({taskId:id,kind:'job',name:j.name,area:j.area,date:S.today,hour:nowH(),by:by,note:note,at:new Date().toISOString()});
    await S.db.doc('maint_tasks/'+id).update({status:'done',doneBy:by,doneDate:S.today,doneHour:nowH(),doneNote:note,histId:hr&&hr.id?hr.id:null});
    toast('Job marked done.');
    if(S.parts.length&&await ask({title:'Spare parts used?',msg:'Did you use any spare parts for: '+j.name+'?',no:'No parts used',ok:'Yes, choose parts'})){const used=await partsUsedDlg(j.name);if(used&&used.length){const got=await takePartsForTask(used,Object.assign({},j,{cat:'other'}),by,hr&&hr.id?hr.id:null);if(got.length)toast('Done. Parts taken from stock: '+got.map(g=>g.name+' ×'+fmtQ(g.qty)).join(', ')+'.');}}
  }catch(e){toast(dbErr(e),true);}
}

/* QR scan of spare part labels. The label text may hold several lines; the line "PART: SPE-004" (or just the code) is used. */
const CAM='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
function qrCodeOf(txt){txt=String(txt||'').trim();const m=txt.match(/PART\s*[:=]\s*([^\r\n]+)/i);return (m?m[1]:txt.split(/\r?\n/)[0]).trim();}
function partByCode(c){c=String(c||'').trim().toUpperCase();if(!c)return null;return S.parts.find(p=>String(p.uc||'').trim().toUpperCase()===c)||S.parts.find(p=>String(p.code||'').trim().toUpperCase()===c)||null;}
function loadJsQR(){return window.jsQR?Promise.resolve():Promise.reject(new Error('reader'));}
/* Opens the camera and resolves with the part found (or null if closed). o.pick=true just returns the part. */
function scanDlg(o){
  return new Promise(resolve=>{
    const old=$('#dlg');const prev=old;const w=document.createElement('div');w.id='scn';w.className='ovl';w.style.zIndex=10000;
    w.innerHTML='<div class="dlg" role="dialog" aria-modal="true"><h2>Scan the part QR</h2><p id="scMsg">Point the camera at the label QR code.</p><video id="scV" playsinline muted style="width:100%;max-height:50vh;background:#000;border-radius:10px"></video><canvas id="scC" hidden></canvas><div style="display:flex;gap:8px;margin-top:10px"><input type="text" id="scT" placeholder="or type the code, e.g. SPE-004" autocapitalize="characters" style="flex:1;min-height:44px"><button type="button" class="btn" id="scGo">Find</button></div><div class="row" style="margin-top:8px"><button type="button" class="btn big" id="scNo">Close</button></div></div>';
    document.body.appendChild(w);
    let stream=null,stop=false,det=null;
    const msg=t=>{$('#scMsg').textContent=t;};
    const fin=p=>{stop=true;try{stream&&stream.getTracks().forEach(t=>t.stop());}catch(e){}w.remove();resolve(p);};
    const tryCode=txt=>{const c=qrCodeOf(txt);const p=partByCode(c);if(p){fin(p);return true;}msg('Code "'+c+'" is not in the spare parts list.');return false;};
    $('#scNo').onclick=()=>fin(null);
    $('#scGo').onclick=()=>tryCode($('#scT').value);
    $('#scT').onkeydown=e=>{if(e.key==='Enter')tryCode($('#scT').value);};
    (async()=>{
      try{
        if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
        const v=$('#scV');v.srcObject=stream;await v.play();
        if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code']});}catch(e){det=null;}}
        if(!det)await loadJsQR();
        const cv=$('#scC'),cx=cv.getContext('2d',{willReadFrequently:true});let last='';
        const loop=async()=>{if(stop)return;
          try{if(v.videoWidth){let txt='';
            if(det){const r=await det.detect(v);if(r.length)txt=r[0].rawValue;}
            else{cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const im=cx.getImageData(0,0,cv.width,cv.height);const r=window.jsQR(im.data,im.width,im.height);if(r)txt=r.data;}
            if(txt&&txt!==last){last=txt;if(tryCode(txt))return;}}}catch(e){}
          setTimeout(loop,det?150:250);};
        loop();
      }catch(e){msg(e&&e.name==='NotAllowedError'?'Camera is not allowed. Allow the camera in the tablet settings, or type the code below.':'The camera cannot start here. Type the code below.');}
    })();
  });
}
async function scanPart(){
  if(S.view!=='mplace'||!S.parts.length){try{const sn=await S.db.collection('parts').limit(1500).get();S.parts=sn.docs.map(d=>Object.assign({id:d.id},d.data()));}catch(e){toast(dbErr(e),true);return;}}
  const p=await scanDlg();if(!p)return;
  const act=await new Promise(res=>{
    const w=document.createElement('div');w.id='dlg';w.className='ovl';
    w.innerHTML='<div class="dlg" role="dialog" aria-modal="true"><h2>'+esc(p.name)+'</h2><p style="margin:0"><b>'+esc(p.uc||'')+'</b></p><div style="margin:12px 0;padding:12px;border-radius:10px;background:var(--bg2,#0001);text-align:center"><div class="muted small" style="text-transform:uppercase;letter-spacing:.06em">Shelf</div><div style="font-size:34px;font-weight:800;line-height:1.1">'+esc(p.shelf||'–')+'</div></div><p style="margin:0 0 12px"><b>'+fmtQ(p.qty)+' '+esc(p.unit||'')+'</b> in stock</p><div class="row" style="gap:10px"><button type="button" class="btn big" id="sqOut" style="flex:1;background:#c62828;border-color:#c62828;color:#fff;font-weight:700">Take out</button><button type="button" class="btn big" id="sqIn" style="flex:1;background:#00a5b8;border-color:#00a5b8;color:#fff;font-weight:700">Receive</button></div><button type="button" class="btn big" id="sqNo" style="margin-top:10px;width:100%">Cancel</button></div>';
    document.body.appendChild(w);const f=v=>{w.remove();res(v);};
    $('#sqOut').onclick=()=>f('out');$('#sqIn').onclick=()=>f('in');$('#sqNo').onclick=()=>f(null);});
  if(act)partAct(act,p.id);
}

}
function paintDone(){const el=$('#doneBody');if(el){el.innerHTML=doneHTML();$$('button[data-hid]',el).forEach(b=>b.onclick=()=>histDel(b.dataset.hid));}}
function paintMaint(){
  const el=$('#mtBody');if(!el)return;
  const all=S.tasks.map(t=>Object.assign({t},pmState(t),{cat:catOf(t)})).sort((a,b)=>b.r-a.r);
  const row=x=>{

async function taskAct(b){
  const id=b.dataset.id,t=S.tasks.find(x=>x.id===id);if(!t)return;
  try{
    if(b.dataset.act==='done'){
      const st=pmState(t),isM=!!(st.m&&st.m.kind==='meter');
      const who=await ask({title:'Mark as done?',msg:t.name+' will restart its counters now.'+(isM?' Check the hour meter reading at this service:':''),field:isM?{label:'Hour meter at this service (h)',value:st.cur}:null,pw:!adminEff(),ok:'Yes, mark done'});if(!who)return;
      const by=adminEff()?'Admin':who.name;
      let nb=st.cur!=null?st.cur:null;if(isM&&who.field!==''&&who.field!=null&&isFinite(Number(who.field)))nb=Number(who.field);
      const hr=await S.db.collection('maint_history').add({taskId:id,name:t.name,area:t.area,date:S.today,hour:nowH(),by:by,at:new Date().toISOString()});
      await S.db.doc('maint_tasks/'+id).update({lastDone:S.today,lastHour:nowH(),doneBy:by,baseHm:nb,prev:{lastDone:t.lastDone||S.today,lastHour:t.lastHour==null?null:t.lastHour,doneBy:t.doneBy||'',baseHm:t.baseHm==null?null:t.baseHm},histId:hr&&hr.id?hr.id:null});
      toast('Marked done. You can undo it from the task row.');
      if(S.parts.length){const used=await partsUsedDlg(t.name);if(used&&used.length){const got=await takePartsForTask(used,t,by,hr&&hr.id?hr.id:null);if(got.length)toast('Marked done. Parts taken from stock: '+got.map(g=>g.name+' ×'+fmtQ(g.qty)).join(', ')+'.');}}
    }else if(b.dataset.act==='undo'){
      if(!t.prev)return;
      const who=await ask({title:'Undo the last Mark done?',msg:t.name+' goes back to: last done '+t.prev.lastDone+(t.prev.baseHm!=null?', meter '+t.prev.baseHm+' h':'')+'. The record in Recent maintenance done is removed.',pw:!adminEff(),ok:'Yes, undo'});if(!who)return;
      await S.db.doc('maint_tasks/'+id).update({lastDone:t.prev.lastDone,lastHour:t.prev.lastHour,doneBy:t.prev.doneBy,baseHm:t.prev.baseHm,prev:null,histId:null});
      const hh=t.histId?S.hist.find(x=>x.id===t.histId):null;
      if(hh&&hh.parts&&hh.parts.length){for(const u of hh.parts){try{await moveStock(u.id,u.qty,{type:'in',note:'Returned: mark done undone ('+t.name+')',by:who.name||'Admin'});}catch(e){}}toast('Mark done undone. Spare parts were put back in stock.');}
      if(t.histId){try{await S.db.doc('maint_history/'+t.histId).delete();}catch(e){}}
      toast('Mark done undone.');
    }else if(b.dataset.act==='hm'){
      const who=await ask({title:'Hour meter at last service',msg:t.name+': the meter reading when this was last done.',field:{label:'Hour meter at last service (h)',value:t.baseHm},pw:!adminEff(),ok:'Save hour'});if(!who)return;
      const v=who.field,n=Number(v);if(v===''||v==null||!isFinite(n)||n<0){toast('Type the hour meter reading as a number.',true);return;}
      await S.db.doc('maint_tasks/'+id).update({baseHm:n});toast('Hour saved.');
    }else if(b.dataset.act==='edit'){
      S.editTask=id;$('#mtForm').open=true;$('#mtSum').textContent='Edit task';$('#mtName').value=t.name;$('#mtCat').value=catOf(t);$('#mtArea').value=t.area;fillMtEq(t.equipment);$('#mtH').value=t.intervalHours||'';$('#mtBase').value=t.baseHm!=null?t.baseHm:'';$('#mtD').value=t.intervalDays||'';$('#mtMach').value=t.machine||'';$('#mtCancel').hidden=false;window.scrollTo({top:0,behavior:'smooth'});
    }else if(b.dataset.act==='del'){
      if(!await ask({title:'Delete this task?',msg:t.name+'. The task and its counters are removed. Records already in Recent maintenance done stay.',pw:!adminEff(),ok:'Yes, delete'}))return;
      await S.db.doc('maint_tasks/'+id).delete();toast('Task deleted.');
    }
  }catch(e){toast(dbErr(e),true);}
}

/* change the stock of one part and record the movement */
async function moveStock(id,delta,m){
  const ref=S.db.doc('parts/'+id);const sn=await ref.get();
  if(!sn.exists)throw new Error('That part no longer exists.');
  const p=sn.data(),cur=Number(p.qty)||0,nq=Math.round((cur+delta)*1000)/1000;
  if(nq<0)throw new Error('Only '+fmtQ(cur)+' '+(p.unit||'')+' of '+p.name+' in stock.');
  await ref.update({qty:nq});
  await S.db.collection('part_moves').add({part:id,name:pname(p),uc:p.uc||'',code:p.code||'',unit:p.unit||'',type:m.type,qty:Math.round(delta*1000)/1000,bal:nq,use:m.use||'',note:m.note||'',by:m.by||'',at:new Date().toISOString(),taskId:m.taskId||''});
  return nq;
}

/* take out / receive / add / edit / delete */
async function partAct(act,id){
  const p=S.parts.find(x=>x.id===id);if(!p)return;
  try{
    if(act==='out'||act==='in'){
      const out=act==='out';
      const r=await stockDlg({title:(out?'Take out: ':'Receive: ')+p.name,msg:'In stock now: '+fmtQ(p.qty)+' '+(p.unit||''),ok:out?'Take out':'Receive',
        fields:[{id:'qty',label:'Quantity'+(p.unit?' ('+p.unit+')':''),type:'number',req:true}].concat(out?[{id:'use',label:'Used for',type:'select',options:PART_FOR,value:p.use||'general'}]:[]).concat([{id:'note',label:out?'Note (optional)':'Supplier or invoice (optional)',type:'text'}]),
        validate:v=>{const n=Number(v.qty);if(!(n>0))return 'Type a quantity above zero.';if(out&&n>(Number(p.qty)||0))return 'Only '+fmtQ(p.qty)+' '+(p.unit||'')+' in stock.';return null;}});
      if(!r)return;const n=Number(r.vals.qty);
      const nq=await moveStock(id,out?-n:n,{type:out?'out':'in',use:r.vals.use||'',note:r.vals.note.trim(),by:r.by});
      toast((out?'Taken out. ':'Received. ')+p.name+': '+fmtQ(nq)+' '+(p.unit||'')+' now.');
      if(out&&(Number(p.min)||0)>0&&nq<=Number(p.min))toast(p.name+' is low: '+fmtQ(nq)+' left (minimum '+fmtQ(p.min)+').',true);
    }else if(act==='edit')await partEdit(p);
    else if(act==='del'){
      const r=await stockDlg({title:'Delete this part?',msg:p.name+' ('+fmtQ(p.qty)+' '+(p.unit||'')+' in stock). Its past movements stay in the history.',ok:'Yes, delete'});if(!r)return;
      await S.db.doc('parts/'+id).delete();toast('Part deleted.');
    }
  }catch(e){toast(e&&e.message&&!e.code?e.message:dbErr(e),true);}
}
async function partEdit(p){

  const fields=[{id:'name',label:'Part name',req:true,value:add?'':p.name},{id:'spec',label:'Size / rating / model (optional)',value:add?'':p.spec,ph:'e.g. 6307, 80x110x10, 0.75 kW'},{id:'cat',label:'Category',type:'select',options:PART_CATS.map(x=>[x,x]),value:add?'Other':(p.cat||'Other')},{id:'code',label:'Order code (optional)',value:add?'':p.code},
    {id:'use',label:'Used for',type:'select',options:PART_FOR,value:add?'general':(p.use||'general')},{id:'unit',label:'Unit',value:add?'pcs':(p.unit||'pcs'),ph:'pcs, L, kg, set'},
    {id:'loc',label:'Shelf / location (optional)',value:add?'':p.loc},{id:'supplier',label:'Supplier (optional)',value:add?'':p.supplier},
    {id:'min',label:'Minimum stock (warn at or below)',type:'number',value:add?'0':(p.min||0)}];
  if(add)fields.push({id:'qty',label:'Quantity in stock now',type:'number',value:'0'});
  else if(adm)fields.push({id:'qty',label:'Counted quantity (admin only; a change is recorded as a count fix)',type:'number',value:p.qty});
  if(adm)fields.push({id:'price',label:'Price per unit (admin only)',type:'number',value:add?'':(p.price||'')});
  const r=await stockDlg({title:add?'Add spare part':'Edit: '+p.name,msg:add?'A unique code (UC) is created automatically.':(p.uc?'UC '+p.uc:''),fields,ok:'Save',
    validate:v=>{if(!v.name.trim())return 'Type the part name.';
      for(const k of ['min','qty','price']){if(v[k]!=null&&v[k]!==''&&!(Number(v[k])>=0))return 'Type '+k+' as a number, zero or more.';}
      if(dup(v.name.trim(),v.spec.trim(),add?null:p.id))return 'This part (same name and size) already exists.';return null;}});
  if(!r)return;const v=r.vals;

    const data={name:v.name.trim(),spec:v.spec.trim(),cat:v.cat,code:v.code.trim(),use:v.use,unit:v.unit.trim()||'pcs',loc:v.loc.trim(),supplier:v.supplier.trim(),min:Number(v.min)||0};
    if(adm&&v.price!=null)data.price=v.price===''?0:Number(v.price);
    if(add){data.qty=0;data.price=data.price||0;data.uc=nextUC(ucLetters(data.use,data.cat));data.grp=ucPrefix(data.use,data.cat);data.createdAt=new Date().toISOString();const ref=await S.db.collection('parts').add(data);const q=Number(v.qty)||0;if(q>0)await moveStock(ref.id,q,{type:'in',note:'Opening stock',by:r.by});toast('Part added.');}
    else{if(!p.uc)data.uc=nextUC(ucLetters(data.use,data.cat));if(!p.grp)data.grp=ucPrefix(data.use,data.cat);await S.db.doc('parts/'+p.id).update(data);if(adm&&v.qty!=null&&v.qty!==''&&Number(v.qty)!==(Number(p.qty)||0)){await moveStock(p.id,Number(v.qty)-(Number(p.qty)||0),{type:'adj',note:'Counted '+fmtQ(v.qty),by:r.by});}toast('Part saved.');}
  }catch(e){toast(e&&e.message&&!e.code?e.message:dbErr(e),true);}
}

function parseTable(text){
  text=String(text).replace(/^﻿/,'');
  const first=text.split(/\r?\n/).find(l=>l.trim())||'';
  const sep=first.includes('\t')?'\t':((first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"'&&f==='')q=true;
    else if(c===sep){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[];}
    else f+=c;}
  row.push(f);if(row.some(x=>x.trim()!==''))rows.push(row);
  return rows.map(r=>r.map(x=>x.trim()));
}
const IMP_ALIAS={uc:['uc','unique code','uc code'],grp:['item code','group','group code'],name:['name','item','item name','part','part name'],spec:['spec','size','rating','specification','remark','size / rating','size/rating','size / rating / model'],cat:['category','cat','type','group'],use:['used for','machine','for','used on'],unit:['unit','uom'],loc:['shelf','location','loc','shelf / location'],qty:['quantity','qty','stock','in stock','count'],min:['minimum','min','min stock','minimum stock','reorder level'],sup:['supplier','vendor'],code:['order code','order cod','code','part code','part number'],price:['price','unit price','price per unit']};
const IMP_DEFAULT=['uc','grp','name','spec','cat','use','unit','loc','qty','min','sup','code','price'];
function parseImport(text){
  const ok=[],bad=[],dups=[];
  const key=(n,s)=>String(n).trim().toLowerCase()+'|'+String(s||'').trim().toLowerCase();
  const have=new Set(S.parts.map(p=>key(p.name,p.spec)));const haveUC=new Set(S.parts.map(p=>p.uc).filter(Boolean));
  const rows=parseTable(text);if(!rows.length)return {ok,bad,dups};
  let map=IMP_DEFAULT.slice(),start=0;
  const hdr=rows[0].map(x=>x.toLowerCase().replace(/\s+/g,' ').trim());
  const hits={};hdr.forEach((h,i)=>{for(const k in IMP_ALIAS){if(IMP_ALIAS[k].includes(h)&&hits[k]==null){hits[k]=i;break;}}});
  if(hits.name!=null&&Object.keys(hits).length>=2){map=[];Object.keys(hits).forEach(k=>{map[hits[k]]=k;});start=1;}
  const adm=adminEff();
  const useOf=s=>{const t=String(s||'').trim().toLowerCase();if(!t)return 'general';const m=PART_FOR.find(x=>x[0]===t||x[1].toLowerCase()===t||(AREA_CODE[x[0]]||'').toLowerCase()===t);return m?m[0]:'general';};
  const catOfS=s=>{const t=String(s||'').trim().toLowerCase();if(!t)return 'Other';return PART_CATS.find(x=>x.toLowerCase()===t)||'Other';};
  const num=s=>{const t=String(s==null?'':s).trim().replace(/\s/g,'').replace(/,(?=\d{3}\b)/g,'').replace(',','.');if(t===''||t==='-')return 0;const n=Number(t);return isFinite(n)&&n>=0?n:NaN;};
  rows.slice(start).forEach((c,i)=>{
    const g={};map.forEach((k,j)=>{if(k)g[k]=c[j]==null?'':c[j];});
    const ln=i+start+1;
    if(!g.name){bad.push('Line '+ln+': the name is empty.');return;}
    const q=num(g.qty),m=num(g.min),pr=num(g.price);
    if(isNaN(q)||isNaN(m)||isNaN(pr)){bad.push('Line '+ln+' ('+g.name+'): quantity, minimum or price is not a number.');return;}
    const k=key(g.name,g.spec),uc=(g.uc||'').trim();
    if(have.has(k)||(uc&&haveUC.has(uc))){dups.push(g.name);return;}
    have.add(k);if(uc)haveUC.add(uc);
    ok.push({uc,grp:g.grp||'',name:g.name,spec:g.spec||'',cat:catOfS(g.cat),code:g.code||'',use:useOf(g.use),unit:g.unit||'pcs',loc:g.loc||'',qty:q,min:m,supplier:g.sup||'',price:adm?pr:0});
  });
  return {ok,bad,dups};
}
function bindImport(){
  const tx=$('#impTx'),out=$('#impOut'),go=$('#impGo');
  const upd=()=>{const t=tx.value;if(!t.trim()){out.innerHTML='';go.disabled=true;S.imp=null;return;}

    out.innerHTML='<div class="row small"><span class="chip ok">'+r.ok.length+' ready to import</span>'+(r.dups.length?'<span class="chip warn">'+r.dups.length+' already exist (skipped)</span>':'')+(r.bad.length?'<span class="chip bad">'+r.bad.length+' with problems (skipped)</span>':'')+'</div>'+(r.bad.length?'<ul class="small" style="margin:8px 0 0 18px">'+r.bad.slice(0,6).map(x=>'<li>'+esc(x)+'</li>').join('')+(r.bad.length>6?'<li>…and '+(r.bad.length-6)+' more</li>':'')+'</ul>':'');
    go.disabled=!r.ok.length;};

  $('#impFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{tx.value=String(rd.result||'');$('#impFn').textContent=f.name;upd();};rd.onerror=()=>toast('Could not read that file.',true);rd.readAsText(f);e.target.value='';};
  go.onclick=async()=>{const r=S.imp;if(!r||!r.ok.length)return;
    const w=await stockDlg({title:'Import '+r.ok.length+' parts?',msg:'They are added to the stock list with their opening quantities.',ok:'Yes, import'});if(!w)return;
    go.disabled=true;let n=0;const at=new Date().toISOString(),taken={};r.ok.forEach(p=>{const m=/^(.*)-(\d+)$/.exec(p.uc||'');if(m&&(taken[m[1]]||0)<+m[2])taken[m[1]]=+m[2];});r.ok.forEach(p=>{if(!p.uc)p.uc=nextUC(ucLetters(p.use,p.cat),taken);if(!p.grp)p.grp=ucPrefix(p.use,p.cat);});

        if(p.qty>0)await S.db.collection('part_moves').add({part:ref.id,name:pname(p),uc:p.uc,code:p.code,unit:p.unit,type:'in',qty:p.qty,bal:p.qty,use:'',note:'Opening stock (import)',by:w.by||'',at,taskId:''});
        n++;}));toast('Imported '+n+' of '+r.ok.length+'…');}
      toast('Imported '+n+' parts.');S.pf.view='stock';paintParts();}
    catch(e){toast((n?'Stopped after '+n+' parts. ':'')+(e&&e.message&&!e.code?e.message:dbErr(e)),true);go.disabled=false;}};
}

async function takePartsForTask(list,t,by,histId){

async function clearTest(){
  if(!adminEff()){toast('Only the admin can clear data.',true);return;}
  const sel=$$('input[data-c]').filter(x=>x.checked).map(x=>x.dataset.c);if(!sel.length){toast('Tick at least one item.',true);return;}
  const names={logs:'readings',notices:'messages',issues:'requests',hist:'history records'},cols={logs:'logs',notices:'notices',issues:'issues',hist:'maint_history'},msg=$('#clrMsg');
  msg.textContent='Counting…';const found={};let total=0;
  try{for(const k of sel){if(!cols[k])continue;const snap=await S.db.collection(cols[k]).get();found[k]=snap.docs.filter(d=>d.id!=='lines_status'&&d.id!=='admin_msgs');total+=found[k].length;}}catch(e){msg.textContent=dbErr(e);return;}
  const parts=Object.keys(found).map(k=>found[k].length+' '+names[k]);if(sel.indexOf('tasks')>=0)parts.push('restart '+S.tasks.length+' maintenance schedule items');
  msg.textContent='';
  if(!await ask({title:'Clear test data?',msg:'This will permanently delete: '+parts.join(', ')+'.',ok:'Yes, continue'}))return;
  if(!await ask({title:'Last check',msg:'Really delete '+total+' records? You cannot get them back.',ok:'Yes, delete now'}))return;
  let done=0;
  try{
    for(const k of Object.keys(found)){const docs=found[k];
      for(let i=0;i<docs.length;i+=20){await Promise.all(docs.slice(i,i+20).map(d=>d.ref?d.ref.delete():S.db.doc(cols[k]+'/'+d.id).delete()));done=Math.min(done+20,total);msg.textContent='Deleting… '+done+' of '+total;}}
    if(sel.indexOf('tasks')>=0){for(const t of S.tasks){await S.db.doc('maint_tasks/'+t.id).update({lastDone:S.today,lastHour:nowH(),doneBy:'Start of tracking',baseHm:null,prev:null,histId:null});}}
    S.trend.cache=null;msg.textContent='Done. '+total+' records deleted'+(sel.indexOf('tasks')>=0?' and the maintenance schedule restarted':'')+'.';toast('Test data cleared.');
  }catch(e){msg.textContent='Stopped: '+dbErr(e)+' ('+done+' deleted).';}
}

     (adm?'':'<div class="apv"><div class="apvh">'+'Approval needed</div><label class="l">Shift leader password<span class="pwf"><input type="password" id="od_lead" autocomplete="off" inputmode="numeric"><button type="button" class="pwt" tabindex="-1">Show</button></span></label><div id="od_who" class="who" aria-live="polite"></div></div>')+'<div id="od_err" class="status bad" hidden></div></div>'+

    $('#od_no').onclick=()=>done(null);
    $('#od_yes').onclick=async()=>{const v=vals();const msg=o.validate?await o.validate(v):null;if(msg){const err=$('#od_err');err.textContent=msg;err.hidden=false;return;}done({vals:v,leader:lead});};
    const first=(o.fields&&o.fields[0])?$('#od_'+o.fields[0].id):$('#od_lead');if(first)first.focus();else ready();
    ready();
  });

async function boot(){
  renderTop();renderHome();
  try{
    const c=window.claude;
    if(c&&c.use){
      const res=await Promise.all([c.use('db'),c.use('user')]);
      S.db=res[0];S.user=res[1];
    }
  }catch(e){}
  if(S.user){
    try{S.isAdmin=!!(await S.user.canEdit());}catch(e){}
    try{const w=await S.user.can('data.write');S.canWrite=(w!==false);}catch(e){}
  }
  if(!S.db){S.gate='nodb';renderTop();renderHome();return;}
  S.db.doc('config/main').onSnapshot(snap=>{
    let c=DEFAULT_CFG;
    if(snap.exists){const d=snap.data();if(d&&Array.isArray(d.areas)&&d.areas.length&&Array.isArray(d.shifts))c=migrateCfg(JSON.parse(JSON.stringify(Object.assign({},DEFAULT_CFG,d,{operators:d.operators||[]}))));}
    const j=JSON.stringify(c);if(j===S.cfgJ&&S.cfgLoaded)return;
    S.cfg=c;S.cfgJ=j;S.cfgLoaded=true;onCfg();
  },e=>toast(dbErr(e),true));
  S.db.doc('logs/lines_status').onSnapshot(snap=>{S.lines=snap.exists&&snap.data().offs?snap.data().offs:{};lineRefresh();},e=>{});
  S.db.doc('logs/admin_msgs').onSnapshot(snap=>{const first=!S.amInit;S.amInit=true;S.amsgs=snap.exists&&snap.data().msgs?snap.data().msgs:[];msgAlertCheck(first);msgRefresh();},e=>{});
  S.db.doc('config/operators').onSnapshot(snap=>{
    const d=snap.exists?snap.data():null;S.ops=d&&Array.isArray(d.list)?d.list:[];
    if(S.view==='admin'&&S.tab==='setup'&&!S.setupEditing)buildTab();
    if(S.view==='ops'&&!$('#dlg'))renderOps();
    if(S.view==='home'&&!S.dev&&!($('#pcPw')&&$('#pcPw').value))renderHome();
  },e=>toast(dbErr(e),true));
  S.db.doc('config/levels').onSnapshot(snap=>{S.lvl=snap.exists?snap.data():null;try{if(S.view==='area')refreshRecent();if($('#ptBody'))paintPoints();}catch(e){}},e=>{});
  await resolveAccount();await evalGate();
}

let LANG='en';try{LANG=localStorage.getItem('plantLang')==='fr'?'fr':'en';}catch(e){}
const LK=Object.keys(FR).sort((a,b)=>b.length-a.length);
const LRE=LK.length?new RegExp('(?<![A-Za-z\\u00C0-\\u00FF])(?:'+LK.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![A-Za-z\\u00C0-\\u00FF])','g'):null;
const LC=new Map();
function trTxt(s){
  if(LANG!=='fr'||!s||!/[A-Za-z]{2}/.test(s))return s;
  if(LC.has(s))return LC.get(s);
  const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/);let core=m[2],r;
  if(FR[core]!==undefined)r=m[1]+FR[core]+m[3];
  else r=LRE?s.replace(LRE,x=>FR[x]!==undefined?FR[x]:x):s;
  if(LC.size>4000)LC.clear();
  LC.set(s,r);return r;
}
const LN=new Map(); /* node or element -> {o,t} / {attr:{o,t}} */
const LATT=['placeholder','title','aria-label'];
function langNode(n){
  const p=n.parentNode;if(!p||p.nodeName==='SCRIPT'||p.nodeName==='STYLE'||p.nodeName==='TEXTAREA'||(p.closest&&p.closest('[data-nolang]')))return;
  let rec=LN.get(n);
  if(rec&&n.data===rec.t&&LANG==='fr')return;
  if(!rec||n.data!==rec.t)rec={o:n.data,t:n.data};
  if(LANG==='fr'){
    if(p.nodeName==='OPTION'&&!p.hasAttribute('value'))p.setAttribute('value',rec.o);
    const t=trTxt(rec.o);rec.t=t;if(n.data!==t)n.data=t;LN.set(n,rec);
  }else if(rec&&LN.has(n)){if(n.data!==rec.o)n.data=rec.o;LN.delete(n);}
}
function langEl(el){
  if(!el.getAttribute||(el.closest&&el.closest('[data-nolang]')))return;
  LATT.forEach(a=>{
    const v=el.getAttribute(a);if(v==null)return;
    let m=LN.get(el);if(!m){m={};LN.set(el,m);}
    let r=m[a];if(r&&v===r.t&&LANG==='fr')return;
    if(!r||v!==r.t)r={o:v,t:v};
    if(LANG==='fr'){const t=trTxt(r.o);r.t=t;m[a]=r;if(v!==t)el.setAttribute(a,t);}
    else if(m[a]){if(v!==m[a].o)el.setAttribute(a,m[a].o);delete m[a];}
  });
}
let langBusy=false,langQ=null;
function langWalk(root){
  if(!root)return;
  if(root.nodeType===3){langNode(root);return;}
  if(root.nodeType!==1)return;
  langEl(root);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){if(n.nodeType===3)langNode(n);else langEl(n);}
}
function langAll(){
  langBusy=true;
  try{
    if(LANG!=='fr')LN.forEach((v,k)=>{if(!k.isConnected){LN.delete(k);return;}if(k.nodeType===3){if(k.data!==v.o)k.data=v.o;}else{Object.keys(v).forEach(a=>{k.setAttribute(a,v[a].o);});}});
    if(LANG==='fr')langWalk(document.body);
    else LN.clear();
  }finally{langBusy=false;}
}
const langMO=new MutationObserver(ms=>{
  if(langBusy||LANG!=='fr')return;
  if(langQ)return;
  langQ=requestAnimationFrame(()=>{langQ=null;langMO.takeRecords();langBusy=true;try{langWalk(document.body);}finally{langBusy=false;}langMO.takeRecords();});
});
function setLang(l){
  LANG=l==='fr'?'fr':'en';
  try{localStorage.setItem('plantLang',LANG);}catch(e){}
  document.documentElement.lang=LANG;
  const b=$('#langBtn');if(b)b.textContent=LANG==='fr'?'🌐 English':'🌐 Français';
  if(LANG==='en')LC.clear();
  langAll();
  const b2=$('#langBtn');if(b2)b2.setAttribute('title',LANG==='fr'?'Switch to English':'Passer en français');
}
langMO.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:LATT});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('#langBtn');if(b){setLang(LANG==='fr'?'en':'fr');}},true);
document.documentElement.lang=LANG;
/*LANG_END*/
boot();
})();
