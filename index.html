function restoreView(){
  const v=lsGet('plant.view')||'';
  if(!S.dev){go('home');return;}
  if(v==='admin'&&adminEff())go('admin',null,'overview');
  else if(v==='summary')go('summary');
  else if(v==='mplace'&&adminEff())go('mplace');
  else if(v==='ops'&&S.dev.place==='all')go('ops');
  else if(v==='sanc'&&snOK())go('sanc');
  else if(v==='lab'&&labOK())go('lab');
  else if(v==='rm'&&labOK())go('rm');
  else if(v==='raw'&&rawOK())go('raw');
  else if(v==='packm'&&packOK())go('packm');
  else if(v.indexOf('area:')===0&&canSee(area(v.slice(5))))go('area',v.slice(5));
  else go('home');
}

   '<div class="tms">Tablet</div><div class="tmc">'+(canPrint()?'<button type="button" class="tmr" id="prBtn" role="menuitem"><span class="ti">🖨</span>Print<span class="tv">›</span></button>':'')+

   '<button type="button" class="tmr" id="tmAbout" role="menuitem"><span class="ti">ℹ️</span>About<span class="tv">›</span></button></div>'+

function dieNames(id){const d=S.dies&&S.dies[id];return d&&d.names&&d.names.length?d.names:dieDefault(id);}
function dieEvents(id){const d=S.dies&&S.dies[id],ev=d&&d.events?d.events:{};return Object.keys(ev).filter(k=>ev[k]&&ev[k].at).map(k=>Object.assign({k:k},ev[k])).sort((a,b)=>a.at<b.at?-1:1);}
const pDayIdx=ms=>{const d=new Date(ms-7*36e5);return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5;};
function dieInfo(id){
  const ev=dieEvents(id),dies=ev.filter(e=>e.type==='die'),now=Date.now(),cur=dies.length?dies[dies.length-1]:null;
  const segs=dies.map((e,i)=>({die:e.die,s:new Date(e.at).getTime(),e:i<dies.length-1?new Date(dies[i+1].at).getTime():now}));
  const names=dieNames(id).slice();ev.forEach(e=>{if(e.die&&names.indexOf(e.die)<0)names.push(e.die);});
  const per=names.map(n=>{const tf=ev.filter(e=>e.type==='teflon'&&e.die===n).pop();let ms=0;const t0=tf?new Date(tf.at).getTime():0;
    if(tf)segs.forEach(sg=>{if(sg.die!==n)return;const a=Math.max(sg.s,t0);if(sg.e>a)ms+=pDayIdx(sg.e)-pDayIdx(a);});

  const ref=S.db.doc('logs/admin_acks'),body={area:'acks',date:'',a:{[m.id]:{[p]:{by:by,at:new Date().toISOString(),v:msgVer(m)}}}};

function msgTimes(w,now){
  const base=new Date(now);const at=t=>{const [h,m]=t.split(':').map(Number);const d=new Date(base);d.setHours(h,m,0,0);return d;};
  if(w.mode==='mins'){return {from:new Date(now).toISOString(),until:new Date(now+w.mins*60000).toISOString()};}
  if(w.mode==='until'){let u=at(w.t2);if(u.getTime()<=now)u=new Date(u.getTime()+864e5);return {from:new Date(now).toISOString(),until:u.toISOString()};}
  if(w.mode==='range'){let f=at(w.t1),u=at(w.t2);if(u<=f)u=new Date(u.getTime()+864e5);if(u.getTime()<=now){f=new Date(f.getTime()+864e5);u=new Date(u.getTime()+864e5);}return {from:f.toISOString(),until:u.toISOString()};}
  return {from:null,until:null};
}

function dayStats(a,date){
  const doc=S.logs[a.id+'_'+date],es=entries(doc);
  if(a.timed){
    let down=0,alarms=0,due=0,missed=0;const runH={};
    es.forEach(x=>{if(x.e.run===false)down+=x.e.down||0;else runH[x.h]=1;alarms+=x.e.alarms||0;});
    if(a.every==='shift')shiftWindows(date).forEach(w=>{if(!w.ended)return;due++;if(!es.some(x=>w.segs.some(sg=>om(x.min)>=sg[0]&&om(x.min)<sg[1])))missed++;});
    return {logged:es.length,missed,run:Object.keys(runH).length,down,alarms,due,timed:true};
  }
  const hrs={};es.forEach(x=>{hrs[x.h]=x.e;});
  const lastDue=date<S.today?23:(date===S.today?ordH(nowH())-1:-1);
  let logged=0,missed=0,run=0,down=0,alarms=0,due=0;
  HRS().forEach((h,k)=>{const e=hrs[h];if(e){logged++;if(e.run===false)down+=(e.down||0);else run++;alarms+=e.alarms||0;}
    if(k<=lastDue){if(!e&&lineOffAt(a.id,date,h))return;due++;if(!e)missed++;}});
  return {logged,missed,run,down,alarms,due};
}

async function lvUpdate(silent){

  const to=addDays(S.today,-1);let from=V.through?addDays(V.through,1):V.start;if(from<V.start)from=V.start;
  if(from>to){if(!silent)toast('Already up to date.');return;}

  try{
    let f=from;

/* ---------- points & ranking (admin only) ---------- */
const PT_DEF={hourly:1,late:0.5,pack:1,lab:2,clean:1,cleanConfirm:1,needConfirm:1,notice:2,arrived:1,issue:2,closed:3,pm:3,die:2,capN:3};
const PT_LBL=[['hourly','Hourly reading on time'],['late','Hourly reading late'],['pack','Packaging entry'],['lab','Laboratory entry'],['clean','Cleaning part ticked'],['cleanConfirm','Shift leader confirms cleaning'],['notice','Message to packaging'],['arrived','Marked product arrived'],['issue','Request sent to maintenance'],['closed','Request finished (maintenance)'],['pm','Preventive job done'],['die','Die / Teflon record']];
const PT_ROLES=['Press','Packaging','Laboratory','Maintenance'];
S.pt={range:'week',role:'all',rows:null,loading:false,err:''};
const ptCfg=()=>Object.assign({},PT_DEF,S.ptCfg||{});
function ptRange(k){
  const t=parseYmd(S.today),dow=(t.getDay()+6)%7;let f,e;
  if(k==='week'){f=addDays(S.today,-dow);e=S.today;}
  else if(k==='lastweek'){f=addDays(S.today,-dow-7);e=addDays(S.today,-dow-1);}
  else if(/^w\d$/.test(k)){f=addDays(S.today,-dow-7*(Number(k.slice(1))-1));e=S.today;}
  else if(k==='start'&&S.lvl&&S.lvl.start){f=S.lvl.start;e=S.today;}
  else if(k==='month'){f=S.today.slice(0,8)+'01';e=S.today;}
  else{f=ymd(new Date(t.getFullYear(),t.getMonth()-1,1));e=ymd(new Date(t.getFullYear(),t.getMonth(),0));}
  return [f,e];
}
function ptCompute(D,f,e){
  const C=ptCfg(),P={};
  const get=(name,role)=>{const nm=String(name||'').trim();if(!nm||/^admin$/i.test(nm))return null;const k=nm.toLowerCase();return P[k]||(P[k]={name:nm,pts:0,r:{Press:0,Packaging:0,Laboratory:0,Maintenance:0},rd:0,ot:0,rdN:0,exp:0,sh:{},cl:0,msg:0,req:0,mt:0,oth:0});};
  const add=(p,role,v,cat)=>{if(!p||!v)return;p.pts+=v;p.r[role]+=v;if(cat)p[cat]+=v;};
  const inR=ts=>{if(!ts)return false;const d=ymd(new Date(ts));return d>=f&&d<=e;};
  D.logs.forEach(d=>{
    const ar=String(d.area||''),a=area(ar);
    if(ar==='dies'||ar==='regr'||ar==='clean_plan'||ar.indexOf('dies_')===0)return;
    const role=ar.indexOf('pack_')===0?'Packaging':(ar.indexOf('lab_')===0||ar.indexOf('rm')===0?'Laboratory':'Press');
    entries(d).forEach(x=>{const en=x.e;if(!en||!en.by)return;
      const whos=(en.ip&&role==='Packaging')?Object.keys(en.ip).map(k=>en.ip[k]&&en.ip[k].by).filter((n,i,arr)=>n&&arr.indexOf(n)===i):[en.by];
      if(!whos.length)whos.push(en.by);
      whos.forEach(wn=>{const p=get(wn);if(!p)return;
      let v=en.late?C.late:C.hourly;
      if(role==='Packaging'){v=C.pack;}else if(role==='Laboratory'){v=C.lab;}
      add(p,role,v,null);p.rd++;if(!en.late)p.ot++;});
      const p=get(en.by);if(!p)return;
      if(role==='Press'&&a&&!a.timed){p.rdN++;const k=d.date+'|'+ar+'|'+shiftOf(x.h);if(!p.sh[k]){p.sh[k]=1;p.exp+=Math.max(1,HRS().filter(h=>shiftOf(h)===shiftOf(x.h)).length);}}
    });
    if(d.clean){Object.keys(d.clean).forEach(sh=>{const ok=!C.needConfirm||(d.cleanConf&&d.cleanConf[sh]);if(!ok)return;const m=d.clean[sh]||{};Object.keys(m).forEach(it=>{const c=m[it];if(!c||!c.by)return;add(get(c.by),role,C.clean,'cl');});});}
    if(d.cleanConf){Object.keys(d.cleanConf).forEach(sh=>{const c=d.cleanConf[sh];if(c&&c.by)add(get(c.by),role,C.cleanConfirm,'cl');});}
  });
  const dayN={};const cap=(key,name,day)=>{const k=key+'|'+String(name).toLowerCase()+'|'+day;dayN[k]=(dayN[k]||0)+1;return dayN[k]<=C.capN;};
  D.notices.forEach(n=>{if(n.by&&inR(n.ts)&&cap('n',n.by,ymd(new Date(n.ts))))add(get(n.by),'Press',C.notice,'msg');
    if(n.arrivedBy&&inR(n.arrivedAt))add(get(n.arrivedBy),'Packaging',C.arrived,'msg');});
  D.issues.forEach(i=>{if(i.by&&inR(i.ts)&&cap('i',i.by,ymd(new Date(i.ts))))add(get(i.by),'Press',C.issue,'req');
    if(i.closedBy&&inR(i.closedAt))add(get(i.closedBy),'Maintenance',C.closed,'mt');});
  D.hist.forEach(h=>{if(h.by&&inR(h.at))add(get(h.by),'Maintenance',C.pm,'mt');});
  D.dies.forEach(ev=>{if(ev&&ev.by&&inR(ev.at))add(get(ev.by),'Press',C.die,'oth');});
  return Object.keys(P).map(k=>{const p=P[k];let role='Press',best=-1;PT_ROLES.forEach(r=>{if(p.r[r]>best){best=p.r[r];role=r;}});
    p.pos=(()=>{const o=(S.ops||[]).find(x=>String(x.name||'').trim().toLowerCase()===k);return o?roleLbl(roleOf(o)).replace(' (operator)',''):'';})();p.role=role;p.pts=Math.round(p.pts*10)/10;p.otp=p.rd?Math.round(p.ot/p.rd*100):null;p.rate=p.exp?Math.min(100,Math.round(p.rdN/p.exp*100)):null;return p;});
}
async function ptFetch(f,e){
  const f1=addDays(f,-1);
  const q=(c,fld)=>S.db.collection(c).where(fld,'>=',f1).limit(3000).get().then(s=>s.docs.map(d=>d.data()));
  const [logs,notices,issues,hist]=await Promise.all([S.db.collection('logs').where('date','>=',f).limit(3000).get().then(s=>s.docs.map(d=>d.data()).filter(d=>d.date&&d.date<=e)),q('notices','ts'),q('issues','ts'),q('maint_history','at')]);
  const dies=[];for(const id of ['dies_macaroni','dies_spaghetti']){try{const sn=await S.db.doc('logs/'+id).get();if(sn.exists){const ev=sn.data().events||{};Object.keys(ev).forEach(k=>dies.push(ev[k]));}}catch(x){}}
  let iss2=issues;try{const s2=await S.db.collection('issues').where('closedAt','>=',f1).limit(3000).get();const seen={};iss2=issues.concat(s2.docs.map(d=>d.data())).filter(i=>{const k=(i.ts||'')+'|'+(i.by||'')+'|'+(i.text||'');if(seen[k])return false;seen[k]=1;return true;});}catch(x){}
  return {logs:logs,notices:notices,issues:iss2,hist:hist,dies:dies};
}
async function ptRows(f,e){
  if(daysBetween(f,e)<=14)return ptCompute(await ptFetch(f,e),f,e);
  const M={};let c=f;
  while(c<=e){let d=addDays(c,13);if(d>e)d=e;
    ptCompute(await ptFetch(c,d),c,d).forEach(r=>{const k=lvKey(r.name),m=M[k];
      if(!m){M[k]=r;return;}
      m.pts=Math.round((m.pts+r.pts)*10)/10;['rd','ot','rdN','exp','cl','msg','req','mt','oth'].forEach(q=>{m[q]=(m[q]||0)+(r[q]||0);});
      PT_ROLES.forEach(q=>{m.r[q]+=r.r[q];});});
    c=addDays(d,1);}
  return Object.keys(M).map(k=>{const p=M[k];let role='Press',best=-1;PT_ROLES.forEach(r=>{if(p.r[r]>best){best=p.r[r];role=r;}});p.role=role;p.otp=p.rd?Math.round(p.ot/p.rd*100):null;p.rate=p.exp?Math.min(100,Math.round(p.rdN/p.exp*100)):null;return p;});
}

function ptList(){

  return l.sort((a,b)=>b.pts-a.pts||((b.otp||0)-(a.otp||0))||a.name.localeCompare(b.name));

function paintPoints(){
  const el=$('#ptBody');if(!el)return;const Q=S.pt,[f,e]=ptRange(Q.range),list=ptList();

async function trendDocs(ar,f,t){
  const out=[];const have=f>=addDays(S.today,-6);
  if(have){Object.keys(S.logs).forEach(id=>{const d=S.logs[id];if(d.area===ar.id&&d.date>=f&&d.date<=t)out.push(d);});return out;}
  const key=f+'|'+t;if(!S.trend.cache||S.trend.cache.key!==key){
    const snap=await S.db.collection('logs').where('date','>=',f).where('date','<=',t).limit(1000).get();

  return S.trend.cache.docs.filter(d=>d.area===ar.id);
}

  if(my!==trSeq||!$('#chartBody'))return;

  else{const step=Math.max(1,Math.ceil(days/10));for(let d=0;d<days;d+=step){const tt=startT+d*864e5,q=new Date(tt);g+='<line class="grid" x1="'+X(tt)+'" x2="'+X(tt)+'" y1="'+T+'" y2="'+(T+ph)+'"/><text x="'+(X(tt)+4)+'" y="'+(H-10)+'">'+(days>10?(q.getMonth()+1)+'/'+q.getDate():DOW[q.getDay()]+' '+q.getDate())+'</text>';}}
  let band='';if(pe.min!=null&&pe.max!=null)band='<rect class="band" x="'+L+'" y="'+Y(pe.max)+'" width="'+pw+'" height="'+(Y(pe.min)-Y(pe.max))+'"/>';

  const multi=series.length>1;

    return '<path class="ln" d="'+path+'"'+(multi?' style="stroke:'+sr.color+'"':'')+'/>'+dots;}).join('');
  const out=pts.filter(q=>pState(p,q.v,q.z)!=='ok').length,avg=vs.reduce((a,b)=>a+b,0)/vs.length,last=pts[pts.length-1];

  el.innerHTML=leg+'<div class="row small" style="margin-bottom:8px"><span class="chip acc">Last '+fmtN(last.v)+' '+esc(p.unit)+'</span><span class="chip">Avg '+fmtN(avg)+'</span><span class="chip">Min '+fmtN(Math.min.apply(null,vs))+'</span><span class="chip">Max '+fmtN(Math.max.apply(null,vs))+'</span><span class="chip '+(out?'warn':'ok')+'">'+out+' out of range</span><span class="muted">Limits: '+esc(limitText(p))+'</span></div>'+

}

const prOp=e=>esc(String((e&&e.by)||'').split(' ')[0]);

function prLab(date,docs){

  else{const i=ran[0]?0:1,a=area(i?'lab_spa':'lab_mac');sides=[prLabSide(a,es[i],'day',nm(a.id)+' · Day shift'),prLabSide(a,es[i],'night',nm(a.id)+' · Night shift')];}

const prIsProd=x=>x.e&&(x.e.run===false||(x.e.v&&(x.e.v.pallets!=null||x.e.v.ptype)));
function prPackSide(a,es,mode,title){

function prSlotVal(a,es,rg,sl,id){

  let t=null;es.forEach(x=>{if(x.min>=sl.s&&x.min<sl.e){const v=num(x.e.v&&x.e.v[id]);if(v!=null)t=(t||0)+v;}});return t;

/* tot: {label,slots} adds one summed column */

  const body=ps.map(p=>{let sum=null;tot&&tot.slots.forEach(sl=>{const v=prSlotVal(a,es,rg,sl,p.id);if(v!=null)sum=(sum||0)+v;});
    return '<tr><td class="pl">'+esc(p.label)+' <span class="pu2">'+esc(p.unit)+'</span></td>'+slots.map(sl=>{const v=prSlotVal(a,es,rg,sl,p.id),b=slotBrand(es,sl,p);return '<td>'+(v==null?'':esc(fmtN(v))+(b?'<div class="brn">'+esc(b)+'</div>':''))+'</td>';}).join('')+(tot?'<td class="tc">'+(sum==null?'':esc(fmtN(sum)))+'</td>':'')+'</tr>';}).join('');
  return '<table class="prg prr">'+head+'<tbody>'+body+'</tbody></table>';

function prPack(date,docs,rg,shift){
  const night=shift==='night',sm=night?'night':'day';
  const am=area('pack_mac'),as=area('pack_spa'),em=entries(docs[0]),es=entries(docs[1]);
  const ran=[em,es].map(l=>l.some(x=>x.e&&x.e.v&&x.e.v.pallets!=null));
  const anyV=l=>l.some(x=>x.e&&x.e.v&&Object.keys(x.e.v).some(k=>x.e.v[k]!=null&&x.e.v[k]!==''));
  if(!ran[0]&&!ran[1]){ran[0]=anyV(em);ran[1]=anyV(es);}
  const slots=packSlots(am),dsl=slots.filter(sl=>prIsDay(Math.floor(sl.s/60))),nsl=slots.filter(sl=>!prIsDay(Math.floor(sl.s/60)));
  const hasR=[[am,em],[as,es]].some(q=>slots.some(sl=>['film_waste','film_waste2','scotch','scotch2','dmg_carton','dmg_carton2','flour','semolina'].some(id=>prSlotVal(q[0],q[1],rg,sl,id)!=null)))||slots.some(sl=>REGR.some(id=>prSlotVal(am,em,rg,sl,id)!=null));
  if(!ran[0]&&!ran[1]&&!hasR)return '';
  const mid=['regr_used','regr_prod'],side=['film_waste','film_waste2','scotch','scotch2','dmg_carton','dmg_carton2','flour','semolina'],nt={label:'Night total',slots:nsl};
  const nm=a=>a.name.replace(/^Packaging · /,'');
  const ssl=night?nsl:dsl,tt=night?{label:'Total',slots:nsl}:null,sn=night?'Night shift':'Day shift';
  let prod,raw,two=ran[0]&&ran[1];
  if(two){
    prod=[prPackSide(am,em,sm,nm(am)+' · '+sn),prPackSide(as,es,sm,nm(as)+' · '+sn)];
    raw=[prRawTable(am,em,rg,ssl,side,nm(am),tt),prRawTable(am,em,rg,ssl,mid,'Regrinding',null),prRawTable(as,es,rg,ssl,side,nm(as),tt)];
  }else{
    const a=ran[0]||!ran[1]?am:as,e=a===am?em:es;
    prod=[prPackSide(a,e,sm,nm(a)+' · '+sn)];
    raw=[prRawTable(a,e,rg,ssl,side,nm(a),tt),prRawTable(a,e,rg,ssl,mid,'Regrinding',null)];
  }
  return '<section class="prsheet pp">'+prHead('Packaging',date,night?'Night shift · 19:00 – 07:00':'Day shift · 07:00 – 19:00')+
   '<div class="prtwo"'+(two?'':' style="grid-template-columns:1fr"')+'>'+prod.map(x=>'<div>'+x+'</div>').join('')+'</div>'+
   '<h2 class="prs wide">Raw materials and wastage</h2><div class="prraw n'+(ran[0]&&ran[1]?'4':'x')+'">'+raw.map(x=>'<div>'+x+'</div>').join('')+'</div>'+prFoot()+'</section>';
}
async function prBuild(type,dates,shiftSel){
  const get=async id=>{if(!S.db)return {hours:{}};const sn=await S.db.doc('logs/'+id).get();return sn.exists?sn.data():{hours:{}};};
  const want=[];if(shiftSel!=='night')want.push(false);if(shiftSel!=='day')want.push(true);
  const out=await Promise.all(dates.map(async date=>{
    if(type==='macaroni'||type==='spaghetti'){const a=area(type),d=await get(a.id+'_'+date);return want.map(n=>prLine(a,date,d,n)).join('');}
    if(type==='boiler'){return prBoiler(area('boiler'),date,await get('boiler_'+date));}
    if(type==='ro'){return prRO(area('ro'),date,await get('ro_'+date));}
    if(type==='lab'){return prLab(date,await Promise.all([get('lab_mac_'+date),get('lab_spa_'+date)]));}
    if(type==='pack'){const ds=await Promise.all([get('pack_mac_'+date),get('pack_spa_'+date),get('regr_'+date)]);return want.map(n=>prPack(date,ds,ds[2],n?'night':'day')).join('');}
    return '';}));
  return out.join('');
}

/* ---- maintenance ---- */
function allLogs(){return Object.assign({},S.mlogs,S.logs);}
const MACHINES=[{id:'macaroni',name:'Macaroni line',kind:'meter',area:'macaroni',param:'line_hm',eq:'General'},{id:'spaghetti',name:'Spaghetti line',kind:'meter',area:'spaghetti',param:'line_hm',eq:'General'},{id:'chiller',name:'Chiller',kind:'meter',area:'boiler',param:'chiller_hm',eq:'Chiller'},{id:'ro',name:'Reverse osmosis (RO)',kind:'meter',area:'ro',param:'op_hours',eq:'General'},{id:'ro_comp',name:'Air compressor',kind:'meter',area:'ro',param:'ro_comp_hm',eq:'RO compressor'}];
const machine=id=>MACHINES.find(m=>m.id===id)||null;
const CATS=[{id:'macaroni',name:'Macaroni Line',area:'macaroni',mach:'macaroni',eq:'General'},{id:'spaghetti',name:'Spaghetti Line',area:'spaghetti',mach:'spaghetti',eq:'General'},{id:'boiler',name:'Boiler',area:'boiler',mach:'',eq:'Boiler'},{id:'chiller',name:'Chiller',area:'boiler',mach:'chiller',eq:'Chiller'},{id:'aircomp',name:'Air Compressor',area:'ro',mach:'ro_comp',eq:'RO compressor'},{id:'ro',name:'RO',area:'ro',mach:'ro',eq:'General'}];
function catOf(t){
  if(t.cat&&(t.cat==='other'||CATS.some(c=>c.id===t.cat)))return t.cat;
  const mm={macaroni:'macaroni',spaghetti:'spaghetti',chiller:'chiller',ro:'ro',ro_comp:'aircomp'}[t.machine];if(mm)return mm;
  if(t.area==='macaroni'||t.area==='spaghetti'||t.area==='ro')return t.area;
  if(t.area==='boiler')return t.equipment==='Chiller'?'chiller':'boiler';
  return 'other';
}
function meterReads(m){
  const out=[],logs=allLogs();
  Object.keys(logs).forEach(id=>{const d=logs[id];if(d.area!==m.area)return;entries(d).forEach(x=>{const v=x.e&&x.e.v?num(x.e.v[m.param]):null;if(v!=null)out.push({t:d.date+pad(ordH(x.h))+pad(x.min%60),v:v,date:d.date,h:x.h,mi:x.min%60});});});
  out.sort((p,q)=>p.t<q.t?-1:p.t>q.t?1:0);return out;
}
function curMeter(id){const m=machine(id);if(!m||m.kind!=='meter')return null;const r=meterReads(m);return r.length?r[r.length-1].v:null;}
const meterLast=id=>{const m=machine(id);if(!m||m.kind!=='meter')return null;const r=meterReads(m);return r.length?r[r.length-1]:null;};
function meterChip(c){
  const m=c.mach?machine(c.mach):null;if(!m)return '';
  const r=meterLast(c.mach);
  return ' <span class="chip" style="font-size:13px;vertical-align:middle;background:var(--panel2);border:1px solid var(--line);color:var(--ink)">'+(c.id==='ro'?'Operation hours':'Hour meter')+': '+(r?'<b class="mono">'+r.v+' h</b> <span class="muted">· '+esc(r.date)+' '+pad(r.h)+':'+pad(r.mi)+'</span>':'no reading yet')+'</span>';
}
function pmState(t){
  const m=machine(t.machine),days=daysBetween(t.lastDone||S.today,S.today);
  let hrs=0,cur=null,noMeter=false,base0=null;
  if(m&&m.kind==='meter'){
    const rs=meterReads(m);cur=rs.length?rs[rs.length-1].v:null;noMeter=cur==null;
    let b0=t.baseHm!=null?num(t.baseHm):null;
    if(b0==null){const bt=(t.lastDone||S.today)+pad(t.lastHour==null?0:ordH(t.lastHour))+'00',r0=rs.find(x=>x.t>=bt);b0=r0?r0.v:null;}
    hrs=(cur!=null&&b0!=null)?Math.max(0,Math.round((cur-b0)*10)/10):0;base0=b0;
  }else{
    const base=(t.lastDone||S.today)+pad(t.lastHour==null?0:ordH(t.lastHour)),logs=allLogs(),ar=m?m.area:t.area;
    Object.keys(logs).forEach(id=>{const d=logs[id];if(d.area!==ar)return;const seen={};entries(d).forEach(x=>{const kk=d.date+pad(ordH(x.h));if(kk>=base&&x.e.run===true&&!seen[kk]){seen[kk]=1;hrs++;}});});
  }
  const rh=t.intervalHours>0?hrs/t.intervalHours:0,rd=t.intervalDays>0?days/t.intervalDays:0,r=Math.max(rh,rd);
  const rem=t.intervalHours>0?Math.round((t.intervalHours-hrs)*10)/10:null;
  return {hrs,days,r,cur,noMeter,m,rem,b0:base0,status:r>=1?'overdue':r>=0.9?'soon':'ok'};
}

/* QR scan of spare part labels. The label text may hold several lines; the line "PART: SPE-004" (or just the code) is used. */
const CAM='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
function qrCodeOf(txt){txt=String(txt||'').trim();const m=txt.match(/PART\s*[:=]\s*([^\r\n]+)/i);return (m?m[1]:txt.split(/\r?\n/)[0]).trim();}
function partByCode(c){c=String(c||'').trim().toUpperCase();if(!c)return null;return S.parts.find(p=>String(p.uc||'').trim().toUpperCase()===c)||S.parts.find(p=>String(p.code||'').trim().toUpperCase()===c)||null;}
function loadJsQR(){return window.jsQR?Promise.resolve():Promise.reject(new Error('reader'));}
/* Opens the camera and resolves with the part found (or null if closed). o.pick=true just returns the part. */
function scanDlg(o){
  return new Promise(resolve=>{
    const old=$('#dlg');const prev=old;const w=document.createElement('div');w.id='scn';w.className='ovl';w.style.zIndex=10000;
    w.innerHTML='<div class="dlg" role="dialog" aria-modal="true"><h2>Scan the part QR</h2><p id="scMsg">Point the camera at the label QR code.</p><video id="scV" playsinline muted style="width:100%;max-height:50vh;background:#000;border-radius:10px"></video><canvas id="scC" hidden></canvas><div style="display:flex;gap:8px;margin-top:10px"><input type="text" id="scT" placeholder="or type the code, e.g. SPE-004" autocapitalize="characters" style="flex:1;min-height:44px"><button type="button" class="btn" id="scGo">Find</button></div><div class="row" style="margin-top:8px"><button type="button" class="btn big" id="scNo">Close</button></div></div>';
    document.body.appendChild(w);
    let stream=null,stop=false,det=null;
    const msg=t=>{$('#scMsg').textContent=t;};
    const fin=p=>{stop=true;try{stream&&stream.getTracks().forEach(t=>t.stop());}catch(e){}w.remove();resolve(p);};
    const tryCode=txt=>{const c=qrCodeOf(txt);const p=partByCode(c);if(p){fin(p);return true;}msg('Code "'+c+'" is not in the spare parts list.');return false;};
    $('#scNo').onclick=()=>fin(null);
    $('#scGo').onclick=()=>tryCode($('#scT').value);
    $('#scT').onkeydown=e=>{if(e.key==='Enter')tryCode($('#scT').value);};
    (async()=>{
      try{
        if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
        const v=$('#scV');v.srcObject=stream;await v.play();
        if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code']});}catch(e){det=null;}}
        if(!det)await loadJsQR();
        const cv=$('#scC'),cx=cv.getContext('2d',{willReadFrequently:true});let last='';
        const loop=async()=>{if(stop)return;
          try{if(v.videoWidth){let txt='';
            if(det){const r=await det.detect(v);if(r.length)txt=r[0].rawValue;}
            else{cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const im=cx.getImageData(0,0,cv.width,cv.height);const r=window.jsQR(im.data,im.width,im.height);if(r)txt=r.data;}
            if(txt&&txt!==last){last=txt;if(tryCode(txt))return;}}}catch(e){}
          setTimeout(loop,det?150:250);};
        loop();
      }catch(e){msg(e&&e.name==='NotAllowedError'?'Camera is not allowed. Allow the camera in the tablet settings, or type the code below.':'The camera cannot start here. Type the code below.');}
    })();
  });
}

  act=await new Promise(res=>{
    const w=document.createElement('div');w.id='dlg';w.className='ovl';

const AREA_L={pp:'P',mp:'M',bo:'B',ro:'R',general:'P'},CAT_L={'Electrical':'E','Mechanical':'M','Pneumatic':'P','Seals':'S','PVC pipe':'V','Tools':'T','RO parts':'R','Bearings':'B','Lubricants':'L','Valves & fittings':'C','Other':'X'};

/* change the stock of one part and record the movement */
async function moveStock(id,delta,m){
  const ref=S.db.doc('parts/'+id);const sn=await ref.get();
  if(!sn.exists)throw new Error('That part no longer exists.');
  const p=sn.data(),cur=Number(p.qty)||0,nq=Math.round((cur+delta)*1000)/1000;
  if(nq<0)throw new Error('Only '+fmtQ(cur)+' '+(p.unit||'')+' of '+p.name+' in stock.');
  await ref.update({qty:nq});
  await S.db.collection('part_moves').add({part:id,name:pname(p),uc:p.uc||'',code:p.code||'',unit:p.unit||'',type:m.type,qty:Math.round(delta*1000)/1000,bal:nq,use:m.use||'',note:m.note||'',by:m.by||'',at:new Date().toISOString(),taskId:m.taskId||''});
  return nq;
}

/* take out / receive / add / edit / delete */
async function partAct(act,id){
  const p=S.parts.find(x=>x.id===id);if(!p)return;
  try{
    if(act==='out'||act==='in'){
      const out=act==='out';
      const r=await stockDlg({title:(out?'Take out: ':'Receive: ')+p.name,msg:'In stock now: '+fmtQ(p.qty)+' '+(p.unit||''),ok:out?'Take out':'Receive',
        fields:[{id:'qty',label:'Quantity'+(p.unit?' ('+p.unit+')':''),type:'number',req:true}].concat(out?[{id:'use',label:'Used for',type:'select',options:PART_FOR,value:p.use||'general'}]:[]).concat([{id:'note',label:out?'Note (optional)':'Supplier or invoice (optional)',type:'text'}]),
        validate:v=>{const n=Number(v.qty);if(!(n>0))return 'Type a quantity above zero.';if(out&&n>(Number(p.qty)||0))return 'Only '+fmtQ(p.qty)+' '+(p.unit||'')+' in stock.';return null;}});
      if(!r)return;const n=Number(r.vals.qty);
      const nq=await moveStock(id,out?-n:n,{type:out?'out':'in',use:r.vals.use||'',note:r.vals.note.trim(),by:r.by});
      toast((out?'Taken out. ':'Received. ')+p.name+': '+fmtQ(nq)+' '+(p.unit||'')+' now.');
      if(out&&(Number(p.min)||0)>0&&nq<=Number(p.min))toast(p.name+' is low: '+fmtQ(nq)+' left (minimum '+fmtQ(p.min)+').',true);
    }else if(act==='edit')await partEdit(p);
    else if(act==='del'){
      const r=await stockDlg({title:'Delete this part?',msg:p.name+' ('+fmtQ(p.qty)+' '+(p.unit||'')+' in stock). Its past movements stay in the history.',ok:'Yes, delete'});if(!r)return;
      await S.db.doc('parts/'+id).delete();toast('Part deleted.');
    }
  }catch(e){toast(e&&e.message&&!e.code?e.message:dbErr(e),true);}
}

function parseTable(text){
  text=String(text).replace(/^﻿/,'');
  const first=text.split(/\r?\n/).find(l=>l.trim())||'';
  const sep=first.includes('\t')?'\t':((first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"'&&f==='')q=true;
    else if(c===sep){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[];}
    else f+=c;}
  row.push(f);if(row.some(x=>x.trim()!==''))rows.push(row);
  return rows.map(r=>r.map(x=>x.trim()));
}
const IMP_ALIAS={uc:['uc','unique code','uc code'],grp:['item code','group','group code'],name:['name','item','item name','part','part name'],spec:['spec','size','rating','specification','remark','size / rating','size/rating','size / rating / model'],cat:['category','cat','type','group'],use:['used for','machine','for','used on'],unit:['unit','uom'],loc:['shelf','location','loc','shelf / location'],qty:['quantity','qty','stock','in stock','count'],min:['minimum','min','min stock','minimum stock','reorder level'],sup:['supplier','vendor'],code:['order code','order cod','code','part code','part number'],price:['price','unit price','price per unit']};
const IMP_DEFAULT=['uc','grp','name','spec','cat','use','unit','loc','qty','min','sup','code','price'];
function parseImport(text){
  const ok=[],bad=[],dups=[];
  const key=(n,s)=>String(n).trim().toLowerCase()+'|'+String(s||'').trim().toLowerCase();
  const have=new Set(S.parts.map(p=>key(p.name,p.spec)));const haveUC=new Set(S.parts.map(p=>p.uc).filter(Boolean));
  const rows=parseTable(text);if(!rows.length)return {ok,bad,dups};
  let map=IMP_DEFAULT.slice(),start=0;
  const hdr=rows[0].map(x=>x.toLowerCase().replace(/\s+/g,' ').trim());
  const hits={};hdr.forEach((h,i)=>{for(const k in IMP_ALIAS){if(IMP_ALIAS[k].includes(h)&&hits[k]==null){hits[k]=i;break;}}});
  if(hits.name!=null&&Object.keys(hits).length>=2){map=[];Object.keys(hits).forEach(k=>{map[hits[k]]=k;});start=1;}
  const adm=adminEff();
  const useOf=s=>{const t=String(s||'').trim().toLowerCase();if(!t)return 'general';const m=PART_FOR.find(x=>x[0]===t||x[1].toLowerCase()===t||(AREA_CODE[x[0]]||'').toLowerCase()===t);return m?m[0]:'general';};
  const catOfS=s=>{const t=String(s||'').trim().toLowerCase();if(!t)return 'Other';return PART_CATS.find(x=>x.toLowerCase()===t)||'Other';};
  const num=s=>{const t=String(s==null?'':s).trim().replace(/\s/g,'').replace(/,(?=\d{3}\b)/g,'').replace(',','.');if(t===''||t==='-')return 0;const n=Number(t);return isFinite(n)&&n>=0?n:NaN;};
  rows.slice(start).forEach((c,i)=>{
    const g={};map.forEach((k,j)=>{if(k)g[k]=c[j]==null?'':c[j];});
    const ln=i+start+1;
    if(!g.name){bad.push('Line '+ln+': the name is empty.');return;}
    const q=num(g.qty),m=num(g.min),pr=num(g.price);
    if(isNaN(q)||isNaN(m)||isNaN(pr)){bad.push('Line '+ln+' ('+g.name+'): quantity, minimum or price is not a number.');return;}
    const k=key(g.name,g.spec),uc=(g.uc||'').trim();
    if(have.has(k)||(uc&&haveUC.has(uc))){dups.push(g.name);return;}
    have.add(k);if(uc)haveUC.add(uc);
    ok.push({uc,grp:g.grp||'',name:g.name,spec:g.spec||'',cat:catOfS(g.cat),code:g.code||'',use:useOf(g.use),unit:g.unit||'pcs',loc:g.loc||'',qty:q,min:m,supplier:g.sup||'',price:adm?pr:0});
  });
  return {ok,bad,dups};
}

        if(p.qty>0)await S.db.collection('part_moves').add({part:ref.id,name:pname(p),uc:p.uc,code:p.code,unit:p.unit,type:'in',qty:p.qty,bal:p.qty,use:'',note:'Opening stock (import)',by:w.by||'',at,taskId:''});
        n++;}));toast('Imported '+n+' of '+r.ok.length+'…');}

    catch(e){toast((n?'Stopped after '+n+' parts. ':'')+(e&&e.message&&!e.code?e.message:dbErr(e)),true);go.disabled=false;}};

async function clearTest(){
  if(!adminEff()){toast('Only the admin can clear data.',true);return;}
  const sel=$$('input[data-c]').filter(x=>x.checked).map(x=>x.dataset.c);if(!sel.length){toast('Tick at least one item.',true);return;}
  const names={logs:'readings',notices:'messages',issues:'requests',hist:'history records'},cols={logs:'logs',notices:'notices',issues:'issues',hist:'maint_history'},msg=$('#clrMsg');
  msg.textContent='Counting…';const found={};let total=0;
  try{for(const k of sel){if(!cols[k])continue;const snap=await S.db.collection(cols[k]).get();found[k]=snap.docs.filter(d=>d.id!=='lines_status'&&d.id!=='admin_msgs');total+=found[k].length;}}catch(e){msg.textContent=dbErr(e);return;}
  const parts=Object.keys(found).map(k=>found[k].length+' '+names[k]);if(sel.indexOf('tasks')>=0)parts.push('restart '+S.tasks.length+' maintenance schedule items');
  msg.textContent='';
  if(!await ask({title:'Clear test data?',msg:'This will permanently delete: '+parts.join(', ')+'.',ok:'Yes, continue'}))return;
  if(!await ask({title:'Last check',msg:'Really delete '+total+' records? You cannot get them back.',ok:'Yes, delete now'}))return;
  let done=0;
  try{
    for(const k of Object.keys(found)){const docs=found[k];
      for(let i=0;i<docs.length;i+=20){await Promise.all(docs.slice(i,i+20).map(d=>d.ref?d.ref.delete():S.db.doc(cols[k]+'/'+d.id).delete()));done=Math.min(done+20,total);msg.textContent='Deleting… '+done+' of '+total;}}
    if(sel.indexOf('tasks')>=0){for(const t of S.tasks){await S.db.doc('maint_tasks/'+t.id).update({lastDone:S.today,lastHour:nowH(),doneBy:'Start of tracking',baseHm:null,prev:null,histId:null});}}
    S.trend.cache=null;msg.textContent='Done. '+total+' records deleted'+(sel.indexOf('tasks')>=0?' and the maintenance schedule restarted':'')+'.';toast('Test data cleared.');
  }catch(e){msg.textContent='Stopped: '+dbErr(e)+' ('+done+' deleted).';}
}

  const pwRules=async(v,id,oldOk)=>{if(!/^\d+$/.test(v.p1))return 'Passwords can only contain numbers (0-9).';if(v.p1.length<5)return 'Passwords need at least 5 digits.';if(v.p1!==v.p2)return 'The two passwords are not the same.';const u=await pwUsed(v.p1,id);if(u)return 'This password is already used by '+u.name+'. Choose another.';return null;};

    const r=await opDlg({title:'Add operator',msg:adm?'Type the new operator name and password.':'Type the new operator name and password, then a shift leader approves.',fields:[{id:'name',label:'Name',type:'text'},{id:'role',label:'Role',type:'select',options:adm?OPR:OPR.filter(q=>q[0]==='assistant'||q[0]==='tech')},{id:'p1',label:'Password (at least 5 digits, numbers only)',num:true},{id:'p2',label:'Repeat password',num:true}],ok:'Add operator',validate:v=>pwRules(v,null)});
    if(!r)return;const v=r.vals,salt=newSalt(),hash=await hashPw(salt,v.p1);
    if(await opsWrite(l=>l.push({id:'o_'+Date.now().toString(36)+Math.floor(Math.random()*99),name:v.name.trim(),active:true,leader:v.role==='leader',labHead:v.role==='labhead',tech:v.role==='tech',salt,hash})))toast(v.name.trim()+' added.');
  };
  $('#opPage').onchange=e=>{const sel=e.target.closest&&e.target.closest('select.opsel');if(!sel||!sel.value)return;const act=sel.value,row=sel.closest('.opr');sel.value='';$('#opPage').onclick({target:{closest:()=>({dataset:{act:act},closest:()=>row})}});};
  $('#opPage').onclick=async e=>{
    const b=e.target.closest('[data-act]');if(!b)return;const id=b.closest('.opr').dataset.id,o=OP().find(x=>x.id===id);if(!o||(!adm&&(o.leader||o.labHead)))return;
    const act=b.dataset.act;
    if(act==='pw'){
      const fields=adm?[{id:'p1',label:'New password (at least 5 digits, numbers only)',num:true},{id:'p2',label:'Repeat new password',num:true}]:[{id:'old',label:'Old password',num:true},{id:'p1',num:true,label:'New password (at least 5 digits, numbers only)'},{id:'p2',num:true,label:'Repeat new password'}];
      const r=await opDlg({title:'Change password: '+o.name,msg:adm?'Type the new password twice.':'Type the old password, the new password twice, then a shift leader approves.',fields,ok:'Change password',
        validate:async v=>{if(!adm){if(await hashPw(o.salt,v.old)!==o.hash)return 'The old password is not correct.';if(v.p1===v.old)return 'The new password must be different from the old one.';}return pwRules(v,id);}});
      if(!r)return;const salt=newSalt(),hash=await hashPw(salt,r.vals.p1);
      if(await opsWrite(l=>{const x=l.find(y=>y.id===id);x.salt=salt;x.hash=hash;}))toast('Password changed for '+o.name+'.');
    }else if(act==='ren'){
      const r=await opDlg({title:'Rename operator',fields:[{id:'name',label:'Name',type:'text',value:o.name}],ok:'Save name'});
      if(!r)return;if(await opsWrite(l=>{l.find(y=>y.id===id).name=r.vals.name.trim();}))toast('Name changed.');
    }else if(act.indexOf('role_')===0){
      const nr=act.slice(5),lbl=roleLbl(nr);
      const msg={leader:'This person will be able to approve tablets, unlock screens and change saved entries.',labhead:'This person can change any saved entry in Lab Moisture and Flour & semolina tests with their password. Nothing else.',tech:'This person will be listed as a technician.',assistant:'This person will be listed as an assistant technician (operator).'}[nr];
      const r=await opDlg({title:'Change role: '+o.name,msg:'New role: '+lbl+'. '+msg,fields:[],ok:'Change role'});
      if(!r)return;if(await opsWrite(l=>{const x=l.find(y=>y.id===id);x.leader=nr==='leader';x.labHead=nr==='labhead';x.tech=nr==='tech';}))toast(o.name+' is now: '+lbl+'.');
    }else if(act==='act'){
      const nowOn=o.active!==false;
      const r=await opDlg({title:(nowOn?'Make inactive: ':'Make active: ')+o.name,msg:nowOn?'This person will no longer be able to save readings.':'This person will be able to save readings again.',fields:[],ok:nowOn?'Make inactive':'Make active'});
      if(!r)return;if(await opsWrite(l=>{l.find(y=>y.id===id).active=!nowOn;}))toast(o.name+(nowOn?' is now inactive.':' is now active.'));
    }else if(act==='del'){
      const r=await opDlg({title:'Remove '+o.name+'?',msg:'The name stays on readings already saved, but this person can no longer sign anything.',fields:[],ok:'Yes, remove'});
      if(!r)return;if(await opsWrite(l=>{l.splice(l.findIndex(y=>y.id===id),1);}))toast(o.name+' removed.');
    }
  };
}

async function snSave(e){

function snCsv(t){
  const rows=[];let r=[],f='',q=false;t=String(t).replace(/^﻿/,'');
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===','){r.push(f);f='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x!==''))rows.push(r);r=[];}else f+=c;}
  if(f!==''||r.length){r.push(f);if(r.some(x=>x!==''))rows.push(r);}
  if(!rows.length)return [];
  const h=rows[0].map(x=>x.trim().toLowerCase());
  return rows.slice(1).map(x=>{const o={};h.forEach((k,j)=>{o[k]=(x[j]||'').trim();});return o;});
}

      if(st.e){
        const map={};S.sn.emps.forEach(x=>{map[x.id]=x;});
        st.e.forEach(r=>{const id=(r.empid||'').toUpperCase();if(!id)return;map[id]={id:id,dept:r.department||'',first:r.firstname||'',middle:r.middlename||'',last:r.lastname||'',phone:r.phone||'',active:true};ne++;});
        await S.db.doc('hr/employees').set({list:Object.keys(map).sort().map(k=>map[k])});
      }
      if(st.s){
        for(const r of st.s){
          const no=Number(r.refno)||0,id='imp_'+String(ns+1).padStart(4,'0');
          await S.db.doc('hr_sanctions/'+id).set({empId:(r.empid||'').toUpperCase(),name:[r.firstname,r.middlename,r.lastname].filter(Boolean).join(' '),dept:r.department||'',type:r.type||'S1',code:r.code||'',codeText:r.codetext||r.code||'',reason:r.reason||'',date:r.date||'',days:r.days||'',leader:r.leader||'',by:r.createdby||r.leader||'',byId:null,createdAt:r.created||(r.date?r.date+'T00:00:00.000Z':new Date().toISOString()),refNo:no||null,ref:no?(r.ref||('SANC-'+String(no).padStart(3,'0'))):(r.ref||''),imported:true});ns++;
        }
      }

    }catch(err){S.sn.mode='find';toast(dbErr(err),true);go1.disabled=false;}
  };
}

/* ---------- config sync ---------- */
function onCfg(){
  renderTop();
  if(S.view==='home')renderHome();
  if(S.view==='area'&&!S.dirty){refreshStrip();renderForm();}
  if(S.view==='mplace')paintTab();
  if(S.view==='admin'){if(S.tab==='setup'&&!S.setupEditing)buildTab();else if(S.tab!=='setup'){if(S.tab==='trends'||S.tab==='maint')buildTab();else paintTab();}}
}

/* ---------- boot ---------- */
async function boot(){
  renderTop();renderHome();
  try{
    const c=window.claude;
    if(c&&c.use){
      const res=await Promise.all([c.use('db'),c.use('user')]);
      S.db=res[0];S.user=res[1];
    }
  }catch(e){}
  if(S.user){
    try{S.isAdmin=!!(await S.user.canEdit());}catch(e){}
    try{const w=await S.user.can('data.write');S.canWrite=(w!==false);}catch(e){}
  }
  if(!S.db){S.gate='nodb';renderTop();renderHome();return;}
  S.db.doc('config/main').onSnapshot(snap=>{
    let c=DEFAULT_CFG;
    if(snap.exists){const d=snap.data();if(d&&Array.isArray(d.areas)&&d.areas.length&&Array.isArray(d.shifts))c=migrateCfg(JSON.parse(JSON.stringify(Object.assign({},DEFAULT_CFG,d,{operators:d.operators||[]}))));}
    const j=JSON.stringify(c);if(j===S.cfgJ&&S.cfgLoaded)return;
    S.cfg=c;S.cfgJ=j;S.cfgLoaded=true;onCfg();
  },e=>toast(dbErr(e),true));
  S.db.doc('logs/lines_status').onSnapshot(snap=>{S.lines=snap.exists&&snap.data().offs?snap.data().offs:{};lineRefresh();},e=>{});
  S.db.doc('logs/admin_acks').onSnapshot(snap=>{S.macks=snap.exists&&snap.data().a?snap.data().a:{};msgRefresh();},e=>{});
  S.db.doc('logs/admin_msgs').onSnapshot(snap=>{const first=!S.amInit;S.amInit=true;S.amsgs=snap.exists&&snap.data().msgs?snap.data().msgs:[];msgAlertCheck(first);msgRefresh();},e=>{});
  S.db.doc('config/operators').onSnapshot(snap=>{
    const d=snap.exists?snap.data():null;S.ops=d&&Array.isArray(d.list)?d.list:[];
    if(S.view==='admin'&&S.tab==='setup'&&!S.setupEditing)buildTab();
    if(S.view==='ops'&&!$('#dlg'))renderOps();
    if(S.view==='home'&&!S.dev&&!($('#pcPw')&&$('#pcPw').value))renderHome();
  },e=>toast(dbErr(e),true));
  S.db.doc('config/levels').onSnapshot(snap=>{S.lvl=snap.exists?snap.data():null;try{if(S.view==='area')refreshRecent();if($('#ptBody'))paintPoints();}catch(e){}},e=>{});
  await resolveAccount();await evalGate();
}

let LANG='en';try{LANG=localStorage.getItem('plantLang')==='fr'?'fr':'en';}catch(e){}
const LK=Object.keys(FR).sort((a,b)=>b.length-a.length);
const LRE=LK.length?new RegExp('(?<![A-Za-z\\u00C0-\\u00FF])(?:'+LK.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![A-Za-z\\u00C0-\\u00FF])','g'):null;
const LC=new Map();
function trTxt(s){
  if(LANG!=='fr'||!s||!/[A-Za-z]{2}/.test(s))return s;
  if(LC.has(s))return LC.get(s);
  const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/);let core=m[2],r;
  if(FR[core]!==undefined)r=m[1]+FR[core]+m[3];
  else r=LRE?s.replace(LRE,x=>FR[x]!==undefined?FR[x]:x):s;
  if(LC.size>4000)LC.clear();
  LC.set(s,r);return r;
}
const LN=new Map(); /* node or element -> {o,t} / {attr:{o,t}} */
const LATT=['placeholder','title','aria-label'];
function langNode(n){
  const p=n.parentNode;if(!p||p.nodeName==='SCRIPT'||p.nodeName==='STYLE'||p.nodeName==='TEXTAREA'||(p.closest&&p.closest('[data-nolang]')))return;
  let rec=LN.get(n);
  if(rec&&n.data===rec.t&&LANG==='fr')return;
  if(!rec||n.data!==rec.t)rec={o:n.data,t:n.data};
  if(LANG==='fr'){
    if(p.nodeName==='OPTION'&&!p.hasAttribute('value'))p.setAttribute('value',rec.o);
    const t=trTxt(rec.o);rec.t=t;if(n.data!==t)n.data=t;LN.set(n,rec);
  }else if(rec&&LN.has(n)){if(n.data!==rec.o)n.data=rec.o;LN.delete(n);}
}
function langEl(el){
  if(!el.getAttribute||(el.closest&&el.closest('[data-nolang]')))return;
  LATT.forEach(a=>{
    const v=el.getAttribute(a);if(v==null)return;
    let m=LN.get(el);if(!m){m={};LN.set(el,m);}
    let r=m[a];if(r&&v===r.t&&LANG==='fr')return;
    if(!r||v!==r.t)r={o:v,t:v};
    if(LANG==='fr'){const t=trTxt(r.o);r.t=t;m[a]=r;if(v!==t)el.setAttribute(a,t);}
    else if(m[a]){if(v!==m[a].o)el.setAttribute(a,m[a].o);delete m[a];}
  });
}
let langBusy=false,langQ=null;
function langWalk(root){
  if(!root)return;
  if(root.nodeType===3){langNode(root);return;}
  if(root.nodeType!==1)return;
  langEl(root);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){if(n.nodeType===3)langNode(n);else langEl(n);}
}
function langAll(){
  langBusy=true;
  try{
    if(LANG!=='fr')LN.forEach((v,k)=>{if(!k.isConnected){LN.delete(k);return;}if(k.nodeType===3){if(k.data!==v.o)k.data=v.o;}else{Object.keys(v).forEach(a=>{k.setAttribute(a,v[a].o);});}});
    if(LANG==='fr')langWalk(document.body);
    else LN.clear();
  }finally{langBusy=false;}
}
const langMO=new MutationObserver(ms=>{
  if(langBusy||LANG!=='fr')return;
  if(langQ)return;
  langQ=requestAnimationFrame(()=>{langQ=null;langMO.takeRecords();langBusy=true;try{langWalk(document.body);}finally{langBusy=false;}langMO.takeRecords();});
});
function setLang(l){
  LANG=l==='fr'?'fr':'en';
  try{localStorage.setItem('plantLang',LANG);}catch(e){}
  document.documentElement.lang=LANG;
  const b=$('#langVal');if(b)b.textContent=(LANG==='fr'?'Français':'English')+' ›';
  if(LANG==='en')LC.clear();
  langAll();
  const b2=$('#langBtn');if(b2)b2.setAttribute('title',LANG==='fr'?'Switch to English':'Passer en français');
}
langMO.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:LATT});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('#langBtn');if(b){setLang(LANG==='fr'?'en':'fr');}},true);
document.documentElement.lang=LANG;
/*LANG_END*/
boot();
})();
