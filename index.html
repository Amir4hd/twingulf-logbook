<style>
/* Layout: sticky control bar; big-touch hourly entry screens for tablets; tabbed control room with hour-by-hour grid per area. */
:root{
  --bg:#e9ece7; --panel:#fbfcfa; --panel2:#f0f3ee; --ink:#17211c; --mut:#56645b; --line:#cdd5ca;
  --accent:#0b6b63; --accentbg:#d6ebe7; --onaccent:#ffffff;
  --ok:#2a7d4f; --okbg:#d9eddf; --warn:#9a5f08; --warnbg:#fbe8c4; --bad:#b3342a; --badbg:#f7d9d5; --stop:#7b867f; --stopbg:#e0e5df;
  --f-d:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-b:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101513; --panel:#171e1b; --panel2:#1e2723; --ink:#e4ebe6; --mut:#9aa89f; --line:#2c3833;
  --accent:#4fc2b6; --accentbg:#16403c; --onaccent:#05211e;
  --ok:#58c184; --okbg:#173a27; --warn:#e8a93d; --warnbg:#443112; --bad:#f0705f; --badbg:#46201b; --stop:#7d8981; --stopbg:#27302b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101513; --panel:#171e1b; --panel2:#1e2723; --ink:#e4ebe6; --mut:#9aa89f; --line:#2c3833;
  --accent:#4fc2b6; --accentbg:#16403c; --onaccent:#05211e;
  --ok:#58c184; --okbg:#173a27; --warn:#e8a93d; --warnbg:#443112; --bad:#f0705f; --badbg:#46201b; --stop:#7d8981; --stopbg:#27302b; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-b);padding-inline:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--f-d);font-weight:600;letter-spacing:.02em;text-wrap:balance}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:17px;text-transform:uppercase;color:var(--mut)}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:14px;padding:10px 16px;min-height:56px}
.brand{font:700 22px/1 var(--f-d);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.bar .where{font:600 20px/1 var(--f-d);letter-spacing:.04em;text-transform:uppercase;opacity:.85;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .sp{flex:1}
.clock{font:500 16px var(--f-m);font-variant-numeric:tabular-nums;white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;white-space:nowrap}
.dot{width:16px;height:16px;border-radius:50%;background:#58c184;box-shadow:0 0 0 3px rgba(88,193,132,.25)}
.dot.off{background:#f0705f;box-shadow:0 0 0 3px rgba(240,112,95,.3)}
.batt{display:inline-flex;align-items:center;gap:5px;font:600 14px var(--f-m);white-space:nowrap}.batt .bi{position:relative;width:26px;height:13px;border:2px solid currentColor;border-radius:3px;padding:1px}.batt .bi:after{content:'';position:absolute;right:-5px;top:2.5px;width:3px;height:6px;background:currentColor;border-radius:0 2px 2px 0}.batt .bi b{display:block;height:100%;background:#58c184;border-radius:1px}.batt.low{color:#f0705f}.batt.low .bi b{background:#f0705f}
.bbtn{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 45%,transparent);color:var(--bg);padding:8px 12px;border-radius:6px;min-height:40px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card>h2,.card>h3{margin-bottom:10px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.muted{color:var(--mut)}
.small{font-size:13px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 16px;min-height:44px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:600}
.btn.big{min-height:60px;font:600 22px var(--f-d);letter-spacing:.06em;text-transform:uppercase;padding-inline:28px}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn.ico{padding:5px 9px;min-width:40px;display:inline-flex;align-items:center;justify-content:center}
#issBadge{font-size:17px;font-weight:800;padding:2px 11px;min-width:28px;text-align:center}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--stopbg);color:var(--mut);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)} .chip.bad{background:var(--badbg);color:var(--bad)} .chip.acc{background:var(--accentbg);color:var(--accent)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-height:44px;width:100%}
textarea{min-height:80px;resize:vertical}
label.l{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);font-weight:500;min-width:0}

.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.acard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;min-height:120px}
.acard:hover{border-color:var(--accent)}
.acard b{font:700 30px/1 var(--f-d);text-transform:uppercase;letter-spacing:.03em}
.acard.ctl{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.hb{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px;border:2px solid var(--line);background:var(--panel2);border-radius:6px;font:500 16px var(--f-m);gap:2px;padding:2px}
.hb small{font:500 10px var(--f-b);text-transform:uppercase;letter-spacing:.04em}
.hb.done{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.hb.alarm{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.hb.stop{background:var(--stopbg);border-color:var(--stop);color:var(--mut)}
.hb.part{background:var(--panel2);border:2px dashed var(--ok);color:var(--ok)}
.hb.miss{border-color:var(--bad);color:var(--bad);background:var(--badbg)}
.hb.future{opacity:.4;cursor:not-allowed}
.hb.now{box-shadow:0 0 0 3px var(--accentbg)}
.hb.sel{outline:3px solid var(--accent);outline-offset:1px}

.grp{border:1px solid var(--line);border-radius:8px;padding:12px 14px 14px;margin:0;min-width:0}
.grp legend{font:600 17px var(--f-d);text-transform:uppercase;letter-spacing:.05em;color:var(--accent);padding:0 6px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld .fl{font-weight:500}
.fld .ir{display:flex;align-items:center;border:2px solid var(--line);border-radius:6px;background:var(--panel);min-height:54px}
.fld .ir input{border:0;background:transparent;min-height:50px;font:500 24px var(--f-m);padding:4px 10px;flex:1;min-width:0}
.fld .ir input:focus-visible{outline:none}
.fld .ir:focus-within{border-color:var(--accent)}
.fld .ir i{font-style:normal;color:var(--mut);padding-right:12px;font-size:14px;white-space:nowrap}
.fld .hint{font-size:12px;color:var(--mut)}
.fld.high .ir,.fld.low .ir{border-color:var(--warn);background:var(--warnbg)}

.fld.need .ir{border-color:var(--bad);background:var(--badbg)}
.fld.need .hint{color:var(--bad);font-weight:600}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{flex:1;min-width:140px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;min-height:56px;border:2px solid var(--line);border-radius:6px;font:600 20px var(--f-d);letter-spacing:.06em;text-transform:uppercase;background:var(--panel2);cursor:pointer}
.seg input:checked+span.go{background:var(--ok);border-color:var(--ok);color:#fff}
.seg input:checked+span.no{background:var(--stop);border-color:var(--stop);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.status{padding:8px 12px;border-radius:6px;background:var(--panel2);font-size:13px}

table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600}
td.n,th.n{text-align:right}
tr.clk{cursor:pointer} tr.clk:hover{background:var(--panel2)}
.hscroll,.tscroll{overflow-x:auto}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tab{background:transparent;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:10px 16px;font:600 18px var(--f-d);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);min-height:44px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.kpis{display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.kpi{flex:1 1 150px;padding:12px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.kpi:first-child{border-left:0}
.kpi b{font:600 34px/1 var(--f-d);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--bad)}
.hg{min-width:700px;display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:140px 1fr 210px;gap:10px;align-items:center}
.hname{font:600 18px var(--f-d);text-transform:uppercase;letter-spacing:.04em}
.hcells{display:grid;grid-template-columns:repeat(24,1fr);gap:3px}
.cell{height:30px;border:2px solid var(--line);border-radius:3px;background:var(--panel2);padding:0}
.cell.done{background:var(--ok);border-color:var(--ok)}
.cell.alarm{background:var(--warn);border-color:var(--warn)}
.cell.stop{background:repeating-linear-gradient(45deg,var(--stop) 0 4px,var(--stopbg) 4px 8px);border-color:var(--stop)}
.cell.part{background:var(--okbg);border:2px dashed var(--ok)}
.cell.miss{background:var(--badbg);border-color:var(--bad)}
.cell.future{opacity:.35;cursor:default}
.cell.sel{outline:3px solid var(--ink);outline-offset:1px}
.hlab{font:500 10px var(--f-m);color:var(--mut);text-align:center}
.hsum{font-size:12px;color:var(--mut);line-height:1.3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-3px;margin-right:5px;border:2px solid var(--line)}
.bartrack{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line);min-width:90px}
.bartrack>div{height:100%;background:var(--ok)} .bartrack.warn>div{background:var(--warn)} .bartrack.bad>div{background:var(--bad)}
.ctlrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.ctlrow>*{min-width:150px;flex:0 1 200px}
.ctlrow .btn{flex:0 0 auto;min-width:0}
svg.ch text{fill:var(--mut);font:11px var(--f-m)}
svg.ch .grid{stroke:var(--line);stroke-width:1}
svg.ch .band{fill:var(--okbg);opacity:.7}
svg.ch .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
svg.ch .pt{fill:var(--accent)} svg.ch .pt.x{fill:var(--bad)}
svg.ch .lim{stroke:var(--warn);stroke-width:1.2;stroke-dasharray:5 4}
.empty{padding:22px;border:2px dashed var(--line);border-radius:8px;color:var(--mut);text-align:center}
.ovl{position:fixed;inset:0;background:rgba(10,16,13,.6);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px}
.dlg h2{font-size:28px}.dlg p{margin:0}
.who{min-height:28px;font:600 20px var(--f-d);letter-spacing:.04em;text-transform:uppercase}
.who.ok{color:var(--ok)}.who.bad{color:var(--bad)}
.status.ok{background:var(--okbg);color:var(--ok)}.status.warn{background:var(--warnbg);color:var(--warn)}.status.bad{background:var(--badbg);color:var(--bad);font-weight:600}
fieldset.plain{border:0;padding:0;margin:0;min-width:0;display:flex;flex-direction:column;gap:16px}
.orow2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.orow2 .nm{flex:1 1 160px;font-size:18px}
.smenu{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.orow{display:grid;grid-template-columns:minmax(140px,2fr) minmax(140px,2fr) 70px 40px;gap:8px;align-items:center;margin-bottom:6px}
.orow input[type=text],.orow input[type=password]{min-height:38px;padding:5px 8px}
.vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px;margin-top:6px}
.vals>div{display:flex;flex-direction:column;border-left:3px solid var(--line);padding-left:8px;min-width:0}
.vals>div.hi{border-left-color:var(--warn)}.vals>div.empty0{opacity:.55}
.vals small{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;overflow-wrap:anywhere}
.vals b{font:500 16px var(--f-m);font-variant-numeric:tabular-nums}
.ent{padding:10px 0;border-top:1px solid var(--line)}.ent:first-of-type{border-top:0}
.fld.locked{opacity:.5}.fld.lead .ir{border-style:dashed}
.orow{grid-template-columns:minmax(140px,2fr) minmax(140px,2fr) 80px 70px 40px !important}
.usr{font-size:14px;font-weight:600;white-space:nowrap;max-width:26vw;overflow:hidden;text-overflow:ellipsis}.usr .r{font-weight:400;opacity:.8}
@media (max-width:760px){.usr .r{display:none}}
.logbox{max-width:480px;margin:18px auto 0;display:flex;flex-direction:column;gap:16px}

.prow{display:grid;grid-template-columns:minmax(140px,2fr) 1fr 70px 70px 70px 40px;gap:8px;align-items:center;margin-bottom:6px}
.prow input{min-height:38px;padding:5px 8px}
.prow.h{font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.05em;font-weight:600}
details.d{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--panel)}
details.d>summary{cursor:pointer;font:600 20px var(--f-d);text-transform:uppercase;letter-spacing:.04em}
@media (max-width:760px){
  .bar{gap:8px;padding:8px 12px}.brand{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis}.clock,.sync .txt{display:none}.bar .where{font-size:17px}
  .hrow{grid-template-columns:1fr}.hsum{order:3}

}
@media (prefers-reduced-motion:no-preference){.hb,.btn{transition:border-color .12s,background .12s}}
.alertbar{position:fixed;left:0;right:0;top:0;z-index:70;background:var(--bad);color:#fff;padding:14px 16px;display:flex;gap:14px;align-items:center;font-size:18px;font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.alertbar[hidden]{display:none}.alertbar .tx{flex:1;min-width:0;overflow-wrap:anywhere}.alertbar button{background:#fff;color:var(--bad);border:0;border-radius:8px;padding:12px 18px;font:700 16px inherit;min-height:48px}
@media (prefers-reduced-motion:no-preference){.alertbar:not([hidden]){animation:alertp 1.2s ease-in-out infinite}@keyframes alertp{50%{filter:brightness(1.25)}}}
.fixin{min-width:170px;flex:1}
.ntline{display:flex;gap:12px;align-items:center;background:var(--bad);color:#fff;padding:8px 12px;border-radius:8px;margin-bottom:8px;font-weight:600}
.ntline .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ntline .btn{background:#fff;color:var(--bad);border-color:#fff;white-space:nowrap}
.ntline.due{outline:3px solid #fff3;}
.ntblk{width:min(440px,94vw);padding:0;overflow:hidden;border:3px solid var(--bad)}
.ntb-h{display:flex;gap:12px;align-items:center;background:var(--bad);color:#fff;padding:12px 16px;font-size:20px}

.ntb-b{padding:16px;display:grid;gap:8px;font-size:17px}.ntb-big{font:700 22px var(--f-d);text-transform:uppercase}.ntb-arr{background:var(--warnbg);border-radius:8px;padding:8px 10px}

.elines{display:flex;flex-direction:column}.eline{display:flex;align-items:center;gap:12px;padding:9px 6px;border-bottom:1px solid var(--line);font-size:15px;white-space:nowrap;overflow:hidden}.eline>span:last-child{overflow:hidden;text-overflow:ellipsis}.eline.clk{cursor:pointer}.eline.clk:hover{background:var(--panel2)}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:16px}.sumrow b.mono{white-space:nowrap}.sumrow.sub{padding-left:22px;font-size:14px;color:var(--mut)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}.mx{font-size:13px}.mx th,.mx td{padding:6px 5px}.mx td:first-child{white-space:normal;min-width:84px}.mx th.sl{font-size:11px;line-height:1.25;white-space:normal}.mx th.sl .chip{display:flex;justify-content:center;font-size:10px;padding:2px 4px;white-space:normal;text-align:center}.mx th.n{white-space:normal}@media(max-width:900px){.split{grid-template-columns:1fr}}
.mx th.sl{text-align:center;font-size:12px;white-space:nowrap}.mx th.sl.warn{background:var(--warnbg)}.mx th.sl.bad{background:var(--badbg)}.mx th.sl.ok{background:var(--okbg)}.mx td.n{text-align:right}
@keyframes blk{50%{opacity:.55}}.blink{animation:blk 1.2s infinite}
.ntsent.done{background:var(--panel2);color:var(--mut);border-left-color:var(--line)}.ntsent.due{background:var(--badbg);color:var(--bad);border-left-color:var(--bad);font-weight:600}
</style>

function entries(doc){const out=[];if(!doc||!doc.hours)return out;Object.keys(doc.hours).forEach(k=>{const e=doc.hours[k];if(!e)return;const c0=k.charAt(0),min=c0==='s'?Math.floor(Number(k.slice(1))/60):c0==='t'?Number(k.slice(1)):Number(k)*60;out.push({k:k,min:min,h:Math.floor(min/60),e:e});});return out.sort((a,b)=>om(a.min)-om(b.min));}

function shiftWindows(date){
  const sh=S.cfg.shifts.slice().sort((a,b)=>ordH(a.start)-ordH(b.start)),out=[],nm=om(nowMin());
  sh.forEach((s,i)=>{const a=ordH(s.start)*60,b=i+1<sh.length?ordH(sh[i+1].start)*60:1440;
    let ended;if(date<S.today)ended=true;else if(date>S.today)ended=false;else ended=nm>=b;
    out.push({name:s.name,segs:[[a,b]],ended:ended});});
  return out;
}
function isReq(a,h){return !(a&&a.timed);}
function cellState(doc,date,h,a){
  const es=entries(doc).filter(x=>x.h===h);
  const isToday=date===S.today,future=date>S.today||(isToday&&ordH(h)>ordH(nowH()));
  if(es.length)return worst(es);
  if(future)return 'future';

  if(isToday&&h===nowH())return 'now';
  return 'miss';
}

async function acquireSession(){
  const ref=S.db.doc('sessions/'+S.acct.uid);
  let d=null;try{const sn=await ref.get();d=sn.exists?sn.data():null;}catch(e){}
  const fresh=d&&d.ts&&Date.now()-new Date(d.ts).getTime()<180000;
  if(fresh&&d.sid&&d.sid!==SID()){
    let block=true;
    if(d.dev&&d.dev===DEV()){ /* same tablet: only blocked while the other tab is really alive */
      const lv=tabsRead()[d.sid];
      block=!!(lv&&Date.now()-lv.t<150000);
    }
    if(block){S.sessInfo=d;return false;}
  }
  const iso=new Date().toISOString();
  try{await ref.set({sid:SID(),dev:DEV(),place:S.acct.role,email:S.acct.email,ts:iso,sts:S.db.serverTime||iso,ready:false});}catch(e){}
  S.sessionOk=true;tabsTouch();
  resub('sess',()=>S.db.doc('sessions/'+S.acct.uid).onSnapshot(sn=>{const x=sn.exists?sn.data():null;if(S.sessionOk&&x&&x.sid&&x.sid!==SID())kicked();},e=>{}));
  return true;
}

async function evalGate(){
  const a=S.acct;S.sessInfo=null;
  const stop=g=>{S.gate=g;S.dev=null;S.view='home';renderTop();renderHome();if(g==='approve')beat();};
  if(!S.db)return stop('nodb');
  if(!a)return stop((S.user&&S.user.info)?'norole':'pick');
  if(!a.role)return stop('norole');
  if(LOCKED_ROLE(a.role)&&!S.sessionOk){if(!await acquireSession())return stop('refused');}
  if(NEED_APPROVAL(a.role)&&!approvalOk())return stop('approve');
  S.gate=null;S.dev={place:a.role,at:new Date().toISOString()};S.unlock=null;S.dirty=false;
  unsub('notices');ensureNoticeSub();beat();renderTop();restoreView();
}

async function beat(){

async function peerStatus(){
  const out={me:navigator.onLine!==false&&S.online!==false,pack:'unknown'};
  if(!S.db)return out;
  try{
    const snap=await Promise.race([S.db.collection('sessions').limit(50).get({source:'server'}),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),6000))]);
    const rows=snap.docs.map(d=>d.data()).filter(x=>x&&(x.sts||x.ts));
    const T=x=>new Date(x.sts||x.ts).getTime();
    const now=rows.reduce((m,x)=>Math.max(m,T(x)),0); /* newest heartbeat = server time, so tablet clocks do not matter */
    const packs=rows.filter(x=>(x.place==='pack'||x.place==='all')&&now-T(x)<=4*60000);
    out.pack=packs.some(x=>x.ready!==false)?'online':(packs.length?'waiting':'offline');
  }catch(e){out.pack='unknown';}
  return out;
}

async function sendNotice(){
  const a=area(S.areaId),to=PRESS_TO_PACK[S.areaId];if(!to)return;
  const f=$('#ntFrom').value,t=$('#ntTo').value,ar=$('#ntArr').value,why=$('#ntWhy').value,dt=($('#ntTx').value||'').trim();

  const now=new Date(),d=new Date(now.getFullYear(),now.getMonth(),now.getDate(),Number(ar.slice(0,2)),Number(ar.slice(3,5)));
  if(d.getTime()<now.getTime()-5*60000)d.setDate(d.getDate()+1);
  const editing=S.ntEdit?S.notices.find(x=>x.id===S.ntEdit):null;
  if(S.ntEdit&&(!editing||ntEditLeft(editing)<=0)){toast('The edit time has passed. Send a new message instead.',true);endNtEdit();paintSent();return;}
  const st=await peerStatus(),warn=[];
  if(!st.me)warn.push('THIS tablet has no connection');
  if(st.pack==='offline')warn.push('the PACKAGING tablet looks offline');
  else if(st.pack==='waiting')warn.push('the PACKAGING tablet is signed in but waiting for a shift leader approval, so nobody will see the message');
  else if(st.pack==='unknown')warn.push('the PACKAGING tablet could not be checked (no connection to the server)');
  const base=a.name+' stopped '+f+'–'+t+' ('+why+(dt?': '+dt:'')+'). Arrives at packaging '+fmt12(d)+(d.getDate()!==now.getDate()?' (tomorrow)':'')+'.';
  const who=await ask({title:editing?'Save the changes?':'Notify the packaging team?',msg:(warn.length?'WARNING: '+warn.join(' and ')+'. The message may not reach them. After sending, go and tell them in person.  ':'Packaging tablet is online.  ')+base,pw:true,ok:editing?'Yes, save changes':'Yes, notify'});if(!who)return;
  try{
    if(editing){
      await S.db.doc('notices/'+editing.id).update({stopFrom:f,stopTo:t,reason:why,details:dt,text:why+(dt?': '+dt:''),arriveAt:d.toISOString(),edited:true,editedBy:who.name,editedAt:new Date().toISOString()});
      endNtEdit();toast('Message updated.');
    }else{
      const doc={from:S.areaId,to:to,stopFrom:f,stopTo:t,reason:why,details:dt,text:why+(dt?': '+dt:''),arriveAt:d.toISOString(),by:who.name,ts:new Date().toISOString(),status:'open'};
      await S.db.collection('notices').add(doc);endNtEdit();toast('Packaging team notified.');
    }
    if(warn.length)showBar('<span class="tx">NO CONNECTION: '+esc(warn.join(' and '))+'. Go to the packaging team and tell them about the stop yourself.</span>');
  }catch(e){toast(dbErr(e),true);}
}

function dayStats(a,date){
  const doc=S.logs[a.id+'_'+date],es=entries(doc);
  if(a.timed){
    let down=0,alarms=0,due=0,missed=0;const runH={};
    es.forEach(x=>{if(x.e.run===false)down+=x.e.down||0;else runH[x.h]=1;alarms+=x.e.alarms||0;});
    if(a.every==='shift')shiftWindows(date).forEach(w=>{if(!w.ended)return;due++;if(!es.some(x=>w.segs.some(sg=>om(x.min)>=sg[0]&&om(x.min)<sg[1])))missed++;});
    return {logged:es.length,missed,run:Object.keys(runH).length,down,alarms,due,timed:true};
  }
  const hrs={};es.forEach(x=>{hrs[x.h]=x.e;});
  const lastDue=date<S.today?23:(date===S.today?ordH(nowH())-1:-1);
  let logged=0,missed=0,run=0,down=0,alarms=0,due=0;
  HRS().forEach((h,k)=>{const e=hrs[h];if(e){logged++;if(e.run===false)down+=(e.down||0);else run++;alarms+=e.alarms||0;}
    if(k<=lastDue){due++;if(!e)missed++;}});
  return {logged,missed,run,down,alarms,due};
}

function detailHTML(){
  if(!S.sel)return '<section class="card"><div class="empty">Select an hour in the grid to see the readings logged for it.</div></section>';

function watchHTML(){

function paintTrend(){
  const el=$('#chartBody');if(!el)return;
  const ar=area(S.trend.area),p=ar&&ar.params.find(x=>x.id===S.trend.param);if(!p)return;
  const days=S.trend.days,endT=Date.now(),startD=addDays(S.today,-(days-1)),startT=parseYmd(startD).getTime()+dayStart()*3600e3;
  const pts=[];
  Object.keys(S.logs).forEach(id=>{const d=S.logs[id];if(d.area!==ar.id||d.date<startD)return;entries(d).forEach(x=>{const v=num(x.e.v&&x.e.v[p.id]);if(v==null)return;pts.push({t:entTime(d.date,x.min),v});});});
  pts.sort((a,b)=>a.t-b.t);
  if(!pts.length){el.innerHTML='<div class="empty">No “'+esc(p.label)+'” readings in this period yet.</div>';return;}
  const vs=pts.map(x=>x.v);let lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);
  if(p.min!=null)lo=Math.min(lo,p.min);if(p.max!=null)hi=Math.max(hi,p.max);
  if(lo===hi){lo-=1;hi+=1;}const padY=(hi-lo)*0.08;lo-=padY;hi+=padY;
  const W=860,H=300,L=56,R=14,T=14,B=34,pw=W-L-R,ph=H-T-B;
  const X=t=>L+(t-startT)/(endT-startT)*pw,Y=v=>T+(1-(v-lo)/(hi-lo))*ph;
  let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+fmtN(v)+'</text>';}
  if(days===1){for(let h=0;h<=24;h+=3){const t=startT+h*3600e3;if(t>endT)break;g+='<text x="'+X(t)+'" y="'+(H-10)+'" text-anchor="middle">'+pad((h+dayStart())%24)+':00</text>';}}
  else for(let d=0;d<days;d++){const t=startT+d*864e5,q=new Date(t);g+='<line class="grid" x1="'+X(t)+'" x2="'+X(t)+'" y1="'+T+'" y2="'+(T+ph)+'"/><text x="'+(X(t)+4)+'" y="'+(H-10)+'">'+DOW[q.getDay()]+' '+q.getDate()+'</text>';}
  let band='';if(p.min!=null&&p.max!=null)band='<rect class="band" x="'+L+'" y="'+Y(p.max)+'" width="'+pw+'" height="'+(Y(p.min)-Y(p.max))+'"/>';
  let lim='';if(p.max!=null)lim+='<line class="lim" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(p.max)+'" y2="'+Y(p.max)+'"/>';if(p.min!=null)lim+='<line class="lim" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(p.min)+'" y2="'+Y(p.min)+'"/>';
  let path='',prev=null;pts.forEach(q=>{path+=(prev&&q.t-prev<2.5*3600e3?'L':'M')+X(q.t).toFixed(1)+' '+Y(q.v).toFixed(1)+' ';prev=q.t;});
  const dots=pts.map(q=>'<circle class="pt'+(pState(p,q.v)==='ok'?'':' x')+'" cx="'+X(q.t).toFixed(1)+'" cy="'+Y(q.v).toFixed(1)+'" r="3.5"/>').join('');
  const out=pts.filter(q=>pState(p,q.v)!=='ok').length,avg=vs.reduce((a,b)=>a+b,0)/vs.length,last=pts[pts.length-1];
  el.innerHTML='<div class="row small" style="margin-bottom:8px"><span class="chip acc">Last '+fmtN(last.v)+' '+esc(p.unit)+'</span><span class="chip">Avg '+fmtN(avg)+'</span><span class="chip">Min '+fmtN(Math.min.apply(null,vs))+'</span><span class="chip">Max '+fmtN(Math.max.apply(null,vs))+'</span><span class="chip '+(out?'warn':'ok')+'">'+out+' out of range</span><span class="muted">Limits: '+esc(limitText(p))+'</span></div>'+
   '<svg class="ch" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(p.label)+' trend">'+band+g+lim+'<path class="ln" d="'+path+'"/>'+dots+'</svg>';
}
async function exportCsv(){
  const msg=$('#exMsg'),ar=area($('#exA').value),f=$('#exF').value,t=$('#exT').value;
  if(!f||!t||f>t){msg.textContent='Choose a valid date range.';return;}
  msg.textContent='Collecting data…';
  try{
    const snap=await S.db.collection('logs').where('date','>=',f).where('date','<=',t).limit(1000).get();
    const docs=snap.docs.map(d=>d.data()).filter(d=>d.area===ar.id).sort((a,b)=>a.date<b.date?-1:1);
    const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
    const head=['Date','Time','Shift','Operator','Running','Downtime min','Downtime reason'].concat(ar.params.map(p=>p.label+' ('+p.unit+')'),['Out of range','Late entry','Notes']);
    const rows=[head.map(q).join(',')];let n=0;
    docs.forEach(d=>entries(d).forEach(x=>{const e=x.e;n++;
      rows.push([realDate(d.date,x.min),hm(x.min),shiftOf(x.h),e.by,e.run===false?'No':'Yes',e.down||0,e.why||''].concat(ar.params.map(p=>e.v&&e.v[p.id]!=null?e.v[p.id]:''),[e.alarms||0,e.late?'Yes':'',e.note||'']).map(q).join(','));}));
    if(!n){msg.textContent='No readings for that area and period.';return;}
    const dl=await window.claude.use('downloads');
    if(!dl){msg.textContent='Download is not available in this view.';return;}
    await dl.save({filename:ar.id+'_'+f+'_to_'+t+'.csv',data:'﻿'+rows.join('\r\n')});
    msg.textContent=n+' rows exported.';
  }catch(e){msg.textContent=(e&&e.code==='declined')?'Download cancelled.':dbErr(e);}
}

/* ---- maintenance ---- */
function allLogs(){return Object.assign({},S.mlogs,S.logs);}
const MACHINES=[{id:'macaroni',name:'Macaroni line',kind:'meter',area:'macaroni',param:'line_hm',eq:'General'},{id:'spaghetti',name:'Spaghetti line',kind:'meter',area:'spaghetti',param:'line_hm',eq:'General'},{id:'chiller',name:'Chiller',kind:'meter',area:'boiler',param:'chiller_hm',eq:'Chiller'},{id:'ro',name:'Reverse osmosis (RO)',kind:'meter',area:'ro',param:'op_hours',eq:'General'},{id:'ro_comp',name:'Air compressor',kind:'meter',area:'ro',param:'ro_comp_hm',eq:'RO compressor'}];
const machine=id=>MACHINES.find(m=>m.id===id)||null;
const CATS=[{id:'macaroni',name:'Macaroni Line',area:'macaroni',mach:'macaroni',eq:'General'},{id:'spaghetti',name:'Spaghetti Line',area:'spaghetti',mach:'spaghetti',eq:'General'},{id:'boiler',name:'Boiler',area:'boiler',mach:'',eq:'Boiler'},{id:'chiller',name:'Chiller',area:'boiler',mach:'chiller',eq:'Chiller'},{id:'aircomp',name:'Air Compressor',area:'ro',mach:'ro_comp',eq:'RO compressor'},{id:'ro',name:'RO',area:'ro',mach:'ro',eq:'General'}];
function catOf(t){
  if(t.cat&&(t.cat==='other'||CATS.some(c=>c.id===t.cat)))return t.cat;
  const mm={macaroni:'macaroni',spaghetti:'spaghetti',chiller:'chiller',ro:'ro',ro_comp:'aircomp'}[t.machine];if(mm)return mm;
  if(t.area==='macaroni'||t.area==='spaghetti'||t.area==='ro')return t.area;
  if(t.area==='boiler')return t.equipment==='Chiller'?'chiller':'boiler';
  return 'other';
}
function meterReads(m){
  const out=[],logs=allLogs();
  Object.keys(logs).forEach(id=>{const d=logs[id];if(d.area!==m.area)return;entries(d).forEach(x=>{const v=x.e&&x.e.v?num(x.e.v[m.param]):null;if(v!=null)out.push({t:d.date+pad(ordH(x.h))+pad(x.min%60),v:v,date:d.date,h:x.h,mi:x.min%60});});});
  out.sort((p,q)=>p.t<q.t?-1:p.t>q.t?1:0);return out;
}
function curMeter(id){const m=machine(id);if(!m||m.kind!=='meter')return null;const r=meterReads(m);return r.length?r[r.length-1].v:null;}
const meterLast=id=>{const m=machine(id);if(!m||m.kind!=='meter')return null;const r=meterReads(m);return r.length?r[r.length-1]:null;};
function meterChip(c){
  const m=c.mach?machine(c.mach):null;if(!m)return '';
  const r=meterLast(c.mach);
  return ' <span class="chip" style="font-size:13px;vertical-align:middle;background:var(--panel2);border:1px solid var(--line);color:var(--ink)">'+(c.id==='ro'?'Operation hours':'Hour meter')+': '+(r?'<b class="mono">'+r.v+' h</b> <span class="muted">· '+esc(r.date)+' '+pad(r.h)+':'+pad(r.mi)+'</span>':'no reading yet')+'</span>';
}
function pmState(t){
  const m=machine(t.machine),days=daysBetween(t.lastDone||S.today,S.today);
  let hrs=0,cur=null,noMeter=false,base0=null;
  if(m&&m.kind==='meter'){
    const rs=meterReads(m);cur=rs.length?rs[rs.length-1].v:null;noMeter=cur==null;
    let b0=t.baseHm!=null?num(t.baseHm):null;
    if(b0==null){const bt=(t.lastDone||S.today)+pad(t.lastHour==null?0:ordH(t.lastHour))+'00',r0=rs.find(x=>x.t>=bt);b0=r0?r0.v:null;}
    hrs=(cur!=null&&b0!=null)?Math.max(0,Math.round((cur-b0)*10)/10):0;base0=b0;
  }else{
    const base=(t.lastDone||S.today)+pad(t.lastHour==null?0:ordH(t.lastHour)),logs=allLogs(),ar=m?m.area:t.area;
    Object.keys(logs).forEach(id=>{const d=logs[id];if(d.area!==ar)return;const seen={};entries(d).forEach(x=>{const kk=d.date+pad(ordH(x.h));if(kk>=base&&x.e.run===true&&!seen[kk]){seen[kk]=1;hrs++;}});});
  }
  const rh=t.intervalHours>0?hrs/t.intervalHours:0,rd=t.intervalDays>0?days/t.intervalDays:0,r=Math.max(rh,rd);
  const rem=t.intervalHours>0?Math.round((t.intervalHours-hrs)*10)/10:null;
  return {hrs,days,r,cur,noMeter,m,rem,b0:base0,status:r>=1?'overdue':r>=0.9?'soon':'ok'};
}

async function saveTask(){
  const name=$('#mtName').value.trim(),h=Number($('#mtH').value)||0,d=Number($('#mtD').value)||0;
  if(!name){toast('Name the task first.',true);return;}
  if(!h&&!d){toast('Set an interval in running hours, days, or both.',true);return;}
  const data={name,cat:$('#mtCat').value,area:$('#mtArea').value,equipment:$('#mtEq').value,machine:$('#mtMach').value,intervalHours:h,intervalDays:d};
  const bv=$('#mtBase').value.trim(),bn=bv===''?null:Number(bv);
  if(bn!=null&&(!isFinite(bn)||bn<0)){toast('The hour meter at last service must be a number.',true);return;}
  if(bn!=null&&!(machine(data.machine)&&machine(data.machine).kind==='meter')){toast('Hour meter at last service only applies to machines with an hour meter.',true);return;}
  if(!await ask({title:'Do you want to save?',msg:'Maintenance task: '+name,pw:!adminEff(),ok:'Yes, save'}))return;
  try{
    if(S.editTask){const old=S.tasks.find(x=>x.id===S.editTask);if(bn!=null)data.baseHm=bn;else if(!old||(old.machine||'')!==data.machine)data.baseHm=curMeter(data.machine);await S.db.doc('maint_tasks/'+S.editTask).update(data);}
    else await S.db.collection('maint_tasks').add(Object.assign(data,{baseHm:bn!=null?bn:curMeter(data.machine),lastDone:S.today,lastHour:nowH(),doneBy:'Start of tracking'}));
    S.editTask=null;resetTaskForm();toast('Task saved.');
  }catch(e){toast(dbErr(e),true);}
}

let delArm=null;
async function taskAct(b){
  const id=b.dataset.id,t=S.tasks.find(x=>x.id===id);if(!t)return;
  try{
    if(b.dataset.act==='done'){
      const st=pmState(t),isM=!!(st.m&&st.m.kind==='meter');
      const who=await ask({title:'Mark as done?',msg:t.name+' will restart its counters now.'+(isM?' Check the hour meter reading at this service:':''),field:isM?{label:'Hour meter at this service (h)',value:st.cur}:null,pw:!adminEff(),ok:'Yes, mark done'});if(!who)return;
      const by=adminEff()?'Admin':who.name;
      let nb=st.cur!=null?st.cur:null;if(isM&&who.field!==''&&who.field!=null&&isFinite(Number(who.field)))nb=Number(who.field);
      const hr=await S.db.collection('maint_history').add({taskId:id,name:t.name,area:t.area,date:S.today,hour:nowH(),by:by,at:new Date().toISOString()});
      await S.db.doc('maint_tasks/'+id).update({lastDone:S.today,lastHour:nowH(),doneBy:by,baseHm:nb,prev:{lastDone:t.lastDone||S.today,lastHour:t.lastHour==null?null:t.lastHour,doneBy:t.doneBy||'',baseHm:t.baseHm==null?null:t.baseHm},histId:hr&&hr.id?hr.id:null});
      toast('Marked done. You can undo it from the task row.');
    }else if(b.dataset.act==='undo'){
      if(!t.prev)return;
      const who=await ask({title:'Undo the last Mark done?',msg:t.name+' goes back to: last done '+t.prev.lastDone+(t.prev.baseHm!=null?', meter '+t.prev.baseHm+' h':'')+'. The record in Recent maintenance done is removed.',pw:!adminEff(),ok:'Yes, undo'});if(!who)return;
      await S.db.doc('maint_tasks/'+id).update({lastDone:t.prev.lastDone,lastHour:t.prev.lastHour,doneBy:t.prev.doneBy,baseHm:t.prev.baseHm,prev:null,histId:null});
      if(t.histId){try{await S.db.doc('maint_history/'+t.histId).delete();}catch(e){}}
      toast('Mark done undone.');
    }else if(b.dataset.act==='hm'){
      const who=await ask({title:'Hour meter at last service',msg:t.name+': the meter reading when this was last done.',field:{label:'Hour meter at last service (h)',value:t.baseHm},pw:!adminEff(),ok:'Save hour'});if(!who)return;
      const v=who.field,n=Number(v);if(v===''||v==null||!isFinite(n)||n<0){toast('Type the hour meter reading as a number.',true);return;}
      await S.db.doc('maint_tasks/'+id).update({baseHm:n});toast('Hour saved.');
    }else if(b.dataset.act==='edit'){
      S.editTask=id;$('#mtForm').open=true;$('#mtSum').textContent='Edit task';$('#mtName').value=t.name;$('#mtCat').value=catOf(t);$('#mtArea').value=t.area;fillMtEq(t.equipment);$('#mtH').value=t.intervalHours||'';$('#mtBase').value=t.baseHm!=null?t.baseHm:'';$('#mtD').value=t.intervalDays||'';$('#mtMach').value=t.machine||'';$('#mtCancel').hidden=false;window.scrollTo({top:0,behavior:'smooth'});
    }else if(b.dataset.act==='del'){
      if(!await ask({title:'Delete this task?',msg:t.name+'. The task and its counters are removed. Records already in Recent maintenance done stay.',pw:!adminEff(),ok:'Yes, delete'}))return;
      await S.db.doc('maint_tasks/'+id).delete();toast('Task deleted.');
    }
  }catch(e){toast(dbErr(e),true);}
}

    try{await S.db.doc('issues/'+id).update({status:'closed',closedAt:new Date().toISOString(),closedBy:adminEff()?'Admin':who.name,fixNote:note});delete S.fix[id];toast('Marked as done.');}catch(e){toast(dbErr(e),true);}});

/* operators and passwords: same panel for the shift leader (limited) and the admin (full, can assign leaders) */
function opDlg(o){
  return new Promise(resolve=>{
    const old=$('#dlg');if(old)old.remove();
    const adm=adminEff();
    const w=document.createElement('div');w.id='dlg';w.className='ovl';
    w.innerHTML='<div class="dlg" role="dialog" aria-modal="true"><h2>'+esc(o.title)+'</h2><p>'+esc(o.msg||'')+'</p><div style="display:grid;gap:10px">'+(o.fields||[]).map(f=>'<label class="l">'+esc(f.label)+'<input type="'+(f.type||'password')+'" id="od_'+f.id+'" autocomplete="off" value="'+esc(f.value||'')+'"></label>').join('')+
     (adm?'':'<label class="l">Shift leader password (approval)<input type="password" id="od_lead" autocomplete="off"></label><div id="od_who" class="who" aria-live="polite"></div>')+'<div id="od_err" class="status bad" hidden></div></div>'+
     '<div class="row" style="margin-top:6px"><button type="button" class="btn big" id="od_no">Cancel</button><button type="button" class="btn pri big" id="od_yes" disabled>'+esc(o.ok||'Save')+'</button></div></div>';
    document.body.appendChild(w);
    let lead=adm?{name:'Admin'}:null,seq=0;
    const done=v=>{w.remove();resolve(v);};
    const vals=()=>{const v={};(o.fields||[]).forEach(f=>{v[f.id]=$('#od_'+f.id).value;});return v;};
    const ready=()=>{const v=vals();$('#od_yes').disabled=!(lead&&(o.fields||[]).every(f=>(f.type==='text'?v[f.id].trim():v[f.id])));};
    w.oninput=async e=>{
      $('#od_err').hidden=true;
      if(e.target.id==='od_lead'){const my=++seq,p=e.target.value;lead=null;ready();const who=$('#od_who');who.textContent='';who.className='who';if(!p)return;const f=await findOperator(p);if(my!==seq)return;
        if(f&&f.leader){lead=f;who.textContent=f.name+' (shift leader)';who.className='who ok';}else if(f){who.textContent='Not a shift leader password';who.className='who bad';}else if(p.length>=4){who.textContent='Password not recognised';who.className='who bad';}}
      ready();
    };
    $('#od_no').onclick=()=>done(null);
    $('#od_yes').onclick=async()=>{const v=vals();const msg=o.validate?await o.validate(v):null;if(msg){const err=$('#od_err');err.textContent=msg;err.hidden=false;return;}done({vals:v,leader:lead});};
    const first=(o.fields&&o.fields[0])?$('#od_'+o.fields[0].id):$('#od_lead');if(first)first.focus();else ready();
    ready();
  });
}

  try{await S.db.doc('config/operators').set({list});return true;}catch(e){toast(dbErr(e),true);return false;}
}
const pwUsed=async(pw,exceptId)=>{for(const q of S.ops){if(q.id===exceptId)continue;if(q.hash&&await hashPw(q.salt,pw)===q.hash)return q;}return null;};
function opsPanel(host,adm){
  const rows=S.ops.map(o=>{
    const chips=(o.leader?'<span class="chip warn">Shift leader</span>':'')+(o.active===false?'<span class="chip bad">Inactive</span>':'<span class="chip ok">Active</span>');
    if(!adm&&o.leader)return '<div class="orow2" data-id="'+esc(o.id)+'"><b class="nm">'+esc(o.name)+'</b>'+chips+'<span class="muted small">Only the admin can change a shift leader</span></div>';
    return '<div class="orow2" data-id="'+esc(o.id)+'"><b class="nm">'+esc(o.name)+'</b>'+chips+(adm?'<button type="button" class="btn sm" data-act="ren">Rename</button>':'')+'<button type="button" class="btn sm" data-act="pw">Change password</button>'+(adm?'<button type="button" class="btn sm" data-act="lead">'+(o.leader?'Remove leader':'Make shift leader')+'</button>':'')+'<button type="button" class="btn sm" data-act="act">'+(o.active===false?'Make active':'Make inactive')+'</button><button type="button" class="btn sm bad ico" data-act="del" title="Remove" aria-label="Remove">'+TRASH+'</button></div>';
  }).join('');
  host.innerHTML='<section class="card"><h2>Operators and passwords</h2><p class="muted small">'+(adm?'Every change saves straight away. You are the admin, so no shift leader approval is needed. You can also make an operator a shift leader.':'Every change needs a shift leader password. Changing a password asks for the old password first. Shift leaders can only be changed by the admin.')+'</p><div id="opPage">'+(rows||'<div class="empty">No operators yet.</div>')+'</div><div class="row" style="margin-top:10px"><button type="button" class="btn pri" id="opAdd">Add operator</button></div></section>';
  const pwRules=async(v,id,oldOk)=>{if(v.p1.length<4)return 'Passwords need at least 4 characters.';if(v.p1!==v.p2)return 'The two passwords are not the same.';const u=await pwUsed(v.p1,id);if(u)return 'This password is already used by '+u.name+'. Choose another.';return null;};
  $('#opAdd').onclick=async()=>{
    const r=await opDlg({title:'Add operator',msg:adm?'Type the new operator name and password.':'Type the new operator name and password, then a shift leader approves.',fields:[{id:'name',label:'Operator name',type:'text'},{id:'p1',label:'Password (at least 4 characters)'},{id:'p2',label:'Repeat password'}],ok:'Add operator',validate:v=>pwRules(v,null)});
    if(!r)return;const v=r.vals,salt=newSalt(),hash=await hashPw(salt,v.p1);
    if(await opsWrite(l=>l.push({id:'o_'+Date.now().toString(36)+Math.floor(Math.random()*99),name:v.name.trim(),active:true,leader:false,salt,hash})))toast(v.name.trim()+' added.');
  };
  $('#opPage').onclick=async e=>{
    const b=e.target.closest('[data-act]');if(!b)return;const id=b.closest('.orow2').dataset.id,o=S.ops.find(x=>x.id===id);if(!o||(!adm&&o.leader))return;
    const act=b.dataset.act;
    if(act==='pw'){
      const fields=adm?[{id:'p1',label:'New password (at least 4 characters)'},{id:'p2',label:'Repeat new password'}]:[{id:'old',label:'Old password'},{id:'p1',label:'New password (at least 4 characters)'},{id:'p2',label:'Repeat new password'}];
      const r=await opDlg({title:'Change password: '+o.name,msg:adm?'Type the new password twice.':'Type the old password, the new password twice, then a shift leader approves.',fields,ok:'Change password',
        validate:async v=>{if(!adm){if(await hashPw(o.salt,v.old)!==o.hash)return 'The old password is not correct.';if(v.p1===v.old)return 'The new password must be different from the old one.';}return pwRules(v,id);}});
      if(!r)return;const salt=newSalt(),hash=await hashPw(salt,r.vals.p1);
      if(await opsWrite(l=>{const x=l.find(y=>y.id===id);x.salt=salt;x.hash=hash;}))toast('Password changed for '+o.name+'.');
    }else if(act==='ren'){
      const r=await opDlg({title:'Rename operator',fields:[{id:'name',label:'Name',type:'text',value:o.name}],ok:'Save name'});
      if(!r)return;if(await opsWrite(l=>{l.find(y=>y.id===id).name=r.vals.name.trim();}))toast('Name changed.');
    }else if(act==='lead'){
      const to=!o.leader;
      const r=await opDlg({title:(to?'Make shift leader: ':'Remove leader status: ')+o.name,msg:to?'This person will be able to approve tablets, unlock screens and change saved entries.':'This person will become a normal operator.',fields:[],ok:to?'Make shift leader':'Remove leader'});
      if(!r)return;if(await opsWrite(l=>{l.find(y=>y.id===id).leader=to;}))toast(o.name+(to?' is now a shift leader.':' is now a normal operator.'));
    }else if(act==='act'){
      const nowOn=o.active!==false;
      const r=await opDlg({title:(nowOn?'Make inactive: ':'Make active: ')+o.name,msg:nowOn?'This person will no longer be able to save readings.':'This person will be able to save readings again.',fields:[],ok:nowOn?'Make inactive':'Make active'});
      if(!r)return;if(await opsWrite(l=>{l.find(y=>y.id===id).active=!nowOn;}))toast(o.name+(nowOn?' is now inactive.':' is now active.'));
    }else if(act==='del'){
      const r=await opDlg({title:'Remove '+o.name+'?',msg:'The name stays on readings already saved, but this person can no longer sign anything.',fields:[],ok:'Yes, remove'});
      if(!r)return;if(await opsWrite(l=>{l.splice(l.findIndex(y=>y.id===id),1);}))toast(o.name+' removed.');
    }
  };
}
function renderOps(){
  if(!(S.dev&&S.dev.place==='all')){go('home');return;}
  $('#main').innerHTML='<div><h1 style="font-size:34px;text-transform:uppercase">Operators and passwords</h1></div><div id="opHost"></div>';
  opsPanel($('#opHost'),false);
}

/* ---------- config sync ---------- */
function onCfg(){
  renderTop();
  if(S.view==='home')renderHome();
  if(S.view==='area'&&!S.dirty){refreshStrip();renderForm();}
  if(S.view==='mplace')paintTab();
  if(S.view==='admin'){if(S.tab==='setup'&&!S.setupEditing)buildTab();else if(S.tab!=='setup'){if(S.tab==='trends'||S.tab==='maint')buildTab();else paintTab();}}
}

/* ---------- boot ---------- */
async function boot(){
  renderTop();renderHome();
  try{
    const c=window.claude;
    if(c&&c.use){
      const res=await Promise.all([c.use('db'),c.use('user')]);
      S.db=res[0];S.user=res[1];
    }
  }catch(e){}
  if(S.user){
    try{S.isAdmin=!!(await S.user.canEdit());}catch(e){}
    try{const w=await S.user.can('data.write');S.canWrite=(w!==false);}catch(e){}
  }
  if(!S.db){S.gate='nodb';renderTop();renderHome();return;}
  S.db.doc('config/main').onSnapshot(snap=>{
    let c=DEFAULT_CFG;
    if(snap.exists){const d=snap.data();if(d&&Array.isArray(d.areas)&&d.areas.length&&Array.isArray(d.shifts))c=migrateCfg(JSON.parse(JSON.stringify(Object.assign({},DEFAULT_CFG,d,{operators:d.operators||[]}))));}
    const j=JSON.stringify(c);if(j===S.cfgJ&&S.cfgLoaded)return;
    S.cfg=c;S.cfgJ=j;S.cfgLoaded=true;onCfg();
  },e=>toast(dbErr(e),true));
  S.db.doc('config/operators').onSnapshot(snap=>{
    const d=snap.exists?snap.data():null;S.ops=d&&Array.isArray(d.list)?d.list:[];
    if(S.view==='admin'&&S.tab==='setup'&&!S.setupEditing)buildTab();
    if(S.view==='ops'&&!$('#dlg'))renderOps();
    if(S.view==='home'&&!S.dev&&!($('#pcPw')&&$('#pcPw').value))renderHome();
  },e=>toast(dbErr(e),true));
  await resolveAccount();await evalGate();
}
boot();
})();
</script>

<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
