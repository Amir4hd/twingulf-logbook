<style>
/* Layout: sticky control bar; big-touch hourly entry screens for tablets; tabbed control room with hour-by-hour grid per area. */
:root{
  --bg:#e9ece7; --panel:#fbfcfa; --panel2:#f0f3ee; --ink:#17211c; --mut:#56645b; --line:#cdd5ca;
  --accent:#0b6b63; --accentbg:#d6ebe7; --onaccent:#ffffff;
  --ok:#2a7d4f; --okbg:#d9eddf; --warn:#9a5f08; --warnbg:#fbe8c4; --bad:#b3342a; --badbg:#f7d9d5; --stop:#7b867f; --stopbg:#e0e5df;
  --f-d:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-b:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-m:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101513; --panel:#171e1b; --panel2:#1e2723; --ink:#e4ebe6; --mut:#9aa89f; --line:#2c3833;
  --accent:#4fc2b6; --accentbg:#16403c; --onaccent:#05211e;
  --ok:#58c184; --okbg:#173a27; --warn:#e8a93d; --warnbg:#443112; --bad:#f0705f; --badbg:#46201b; --stop:#7d8981; --stopbg:#27302b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101513; --panel:#171e1b; --panel2:#1e2723; --ink:#e4ebe6; --mut:#9aa89f; --line:#2c3833;
  --accent:#4fc2b6; --accentbg:#16403c; --onaccent:#05211e;
  --ok:#58c184; --okbg:#173a27; --warn:#e8a93d; --warnbg:#443112; --bad:#f0705f; --badbg:#46201b; --stop:#7d8981; --stopbg:#27302b; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-b);padding-inline:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--f-d);font-weight:600;letter-spacing:.02em;text-wrap:balance}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:17px;text-transform:uppercase;color:var(--mut)}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:14px;padding:10px 16px;min-height:56px}
.brand{font:700 22px/1 var(--f-d);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.bar .where{font:600 20px/1 var(--f-d);letter-spacing:.04em;text-transform:uppercase;opacity:.85;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .sp{flex:1}
.clock{font:500 16px var(--f-m);font-variant-numeric:tabular-nums;white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#58c184}
.dot.off{background:#f0705f}
.bbtn{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 45%,transparent);color:var(--bg);padding:8px 12px;border-radius:6px;min-height:40px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card>h2,.card>h3{margin-bottom:10px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.muted{color:var(--mut)}
.small{font-size:13px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 16px;min-height:44px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:600}
.btn.big{min-height:60px;font:600 22px var(--f-d);letter-spacing:.06em;text-transform:uppercase;padding-inline:28px}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--stopbg);color:var(--mut);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)} .chip.bad{background:var(--badbg);color:var(--bad)} .chip.acc{background:var(--accentbg);color:var(--accent)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-height:44px;width:100%}
textarea{min-height:80px;resize:vertical}
label.l{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);font-weight:500;min-width:0}

.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.acard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;min-height:120px}
.acard:hover{border-color:var(--accent)}
.acard b{font:700 30px/1 var(--f-d);text-transform:uppercase;letter-spacing:.03em}
.acard.ctl{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.hb{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px;border:2px solid var(--line);background:var(--panel2);border-radius:6px;font:500 16px var(--f-m);gap:2px;padding:2px}
.hb small{font:500 10px var(--f-b);text-transform:uppercase;letter-spacing:.04em}
.hb.done{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.hb.alarm{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.hb.stop{background:var(--stopbg);border-color:var(--stop);color:var(--mut)}
.hb.part{background:var(--panel2);border:2px dashed var(--ok);color:var(--ok)}
.hb.miss{border-color:var(--bad);color:var(--bad);background:var(--badbg)}
.hb.future{opacity:.4;cursor:not-allowed}
.hb.now{box-shadow:0 0 0 3px var(--accentbg)}
.hb.sel{outline:3px solid var(--accent);outline-offset:1px}

.grp{border:1px solid var(--line);border-radius:8px;padding:12px 14px 14px;margin:0;min-width:0}
.grp legend{font:600 17px var(--f-d);text-transform:uppercase;letter-spacing:.05em;color:var(--accent);padding:0 6px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld .fl{font-weight:500}
.fld .ir{display:flex;align-items:center;border:2px solid var(--line);border-radius:6px;background:var(--panel);min-height:54px}
.fld .ir input{border:0;background:transparent;min-height:50px;font:500 24px var(--f-m);padding:4px 10px;flex:1;min-width:0}
.fld .ir input:focus-visible{outline:none}
.fld .ir:focus-within{border-color:var(--accent)}
.fld .ir i{font-style:normal;color:var(--mut);padding-right:12px;font-size:14px;white-space:nowrap}
.fld .hint{font-size:12px;color:var(--mut)}
.fld.high .ir,.fld.low .ir{border-color:var(--warn);background:var(--warnbg)}
.fld.high .hint,.fld.low .hint{color:var(--warn);font-weight:600}
.fld.need .ir{border-color:var(--bad);background:var(--badbg)}
.fld.need .hint{color:var(--bad);font-weight:600}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{flex:1;min-width:140px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;min-height:56px;border:2px solid var(--line);border-radius:6px;font:600 20px var(--f-d);letter-spacing:.06em;text-transform:uppercase;background:var(--panel2);cursor:pointer}
.seg input:checked+span.go{background:var(--ok);border-color:var(--ok);color:#fff}
.seg input:checked+span.no{background:var(--stop);border-color:var(--stop);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.status{padding:8px 12px;border-radius:6px;background:var(--panel2);font-size:13px}

table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600}
td.n,th.n{text-align:right}
tr.clk{cursor:pointer} tr.clk:hover{background:var(--panel2)}
.hscroll,.tscroll{overflow-x:auto}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tab{background:transparent;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:10px 16px;font:600 18px var(--f-d);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);min-height:44px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.kpis{display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.kpi{flex:1 1 150px;padding:12px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.kpi:first-child{border-left:0}
.kpi b{font:600 34px/1 var(--f-d);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--bad)}
.hg{min-width:700px;display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:140px 1fr 210px;gap:10px;align-items:center}
.hname{font:600 18px var(--f-d);text-transform:uppercase;letter-spacing:.04em}
.hcells{display:grid;grid-template-columns:repeat(24,1fr);gap:3px}
.cell{height:30px;border:2px solid var(--line);border-radius:3px;background:var(--panel2);padding:0}
.cell.done{background:var(--ok);border-color:var(--ok)}
.cell.alarm{background:var(--warn);border-color:var(--warn)}
.cell.stop{background:repeating-linear-gradient(45deg,var(--stop) 0 4px,var(--stopbg) 4px 8px);border-color:var(--stop)}
.cell.part{background:var(--okbg);border:2px dashed var(--ok)}
.cell.miss{background:var(--badbg);border-color:var(--bad)}
.cell.future{opacity:.35;cursor:default}
.cell.sel{outline:3px solid var(--ink);outline-offset:1px}
.hlab{font:500 10px var(--f-m);color:var(--mut);text-align:center}
.hsum{font-size:12px;color:var(--mut);line-height:1.3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-3px;margin-right:5px;border:2px solid var(--line)}
.bartrack{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line);min-width:90px}
.bartrack>div{height:100%;background:var(--ok)} .bartrack.warn>div{background:var(--warn)} .bartrack.bad>div{background:var(--bad)}
.ctlrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.ctlrow>*{min-width:150px;flex:0 1 200px}
.ctlrow .btn{flex:0 0 auto;min-width:0}
svg.ch text{fill:var(--mut);font:11px var(--f-m)}
svg.ch .grid{stroke:var(--line);stroke-width:1}
svg.ch .band{fill:var(--okbg);opacity:.7}
svg.ch .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
svg.ch .pt{fill:var(--accent)} svg.ch .pt.x{fill:var(--bad)}
svg.ch .lim{stroke:var(--warn);stroke-width:1.2;stroke-dasharray:5 4}
.empty{padding:22px;border:2px dashed var(--line);border-radius:8px;color:var(--mut);text-align:center}
.ovl{position:fixed;inset:0;background:rgba(10,16,13,.6);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px}
.dlg h2{font-size:28px}.dlg p{margin:0}
.who{min-height:28px;font:600 20px var(--f-d);letter-spacing:.04em;text-transform:uppercase}
.who.ok{color:var(--ok)}.who.bad{color:var(--bad)}
.status.ok{background:var(--okbg);color:var(--ok)}.status.warn{background:var(--warnbg);color:var(--warn)}.status.bad{background:var(--badbg);color:var(--bad);font-weight:600}
fieldset.plain{border:0;padding:0;margin:0;min-width:0;display:flex;flex-direction:column;gap:16px}
.orow{display:grid;grid-template-columns:minmax(140px,2fr) minmax(140px,2fr) 70px 40px;gap:8px;align-items:center;margin-bottom:6px}
.orow input[type=text],.orow input[type=password]{min-height:38px;padding:5px 8px}
.vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px;margin-top:6px}
.vals>div{display:flex;flex-direction:column;border-left:3px solid var(--line);padding-left:8px;min-width:0}
.vals>div.hi{border-left-color:var(--warn)}.vals>div.empty0{opacity:.55}
.vals small{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;overflow-wrap:anywhere}
.vals b{font:500 16px var(--f-m);font-variant-numeric:tabular-nums}
.ent{padding:10px 0;border-top:1px solid var(--line)}.ent:first-of-type{border-top:0}
.fld.locked{opacity:.5}.fld.lead .ir{border-style:dashed}
.orow{grid-template-columns:minmax(140px,2fr) minmax(140px,2fr) 80px 70px 40px !important}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:8px;z-index:50;max-width:92vw;font-weight:500}
.toast.bad{background:var(--bad);color:#fff}
.prow{display:grid;grid-template-columns:minmax(140px,2fr) 1fr 70px 70px 70px 40px;gap:8px;align-items:center;margin-bottom:6px}
.prow input{min-height:38px;padding:5px 8px}
.prow.h{font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.05em;font-weight:600}
details.d{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--panel)}
details.d>summary{cursor:pointer;font:600 20px var(--f-d);text-transform:uppercase;letter-spacing:.04em}
@media (max-width:760px){
  .bar{gap:8px;padding:8px 12px}.brand{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis}.clock,.sync .txt{display:none}.bar .where{font-size:17px}
  .hrow{grid-template-columns:1fr}.hsum{order:3}
  .prow{grid-template-columns:1fr 1fr 1fr;} .prow.h{display:none}
}
@media (prefers-reduced-motion:no-preference){.hb,.btn{transition:border-color .12s,background .12s}}
</style>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const daysBetween=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>(v===null||v===undefined||v===''||isNaN(Number(v)))?null:Number(v);

const hh=h=>pad(h)+':00';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const REASONS=['Planned stop','Breakdown','Cleaning / changeover','Material shortage','Power cut','Quality hold','Other'];

/* ---------- standard setup (used until the admin saves their own in Setup) ---------- */
const PACK_WIN=[[30,90],[870,930],[1350,1410]];
const WIN_IDS=['film_waste','scotch','dmg_carton','flour','semolina','regr_used','regr_prod'];
function N(id,label,unit,group,o){o=o||{};const p={id:id,label:label,unit:unit||'',min:null,max:null,group:group||'',total:!!o.total,kind:o.kind||'num',calc:o.calc||'',options:o.options||[]};if(WIN_IDS.indexOf(id)>=0&&o.pack)p.win=PACK_WIN;return p;}
function migrateCfg(c){(c.areas||[]).forEach(a=>{if(String(a.id).indexOf('pack_')===0){a.params=a.params.filter(p=>p.id!=='pallet_times');a.params.forEach(p=>{if(WIN_IDS.indexOf(p.id)>=0&&!p.win)p.win=PACK_WIN;});}});return c;}
const C_='°C',H_='%RH';
function sensors(list){return list.map(c=>{const t=c.slice(-1);if(t==='T'||t==='H')return N('s'+c.toLowerCase(),c+(t==='T'?' temp':' humidity'),t==='T'?C_:H_,'Dryer temperature & humidity');return N('s'+c,'Motor '+c+' speed','Hz','Dryer motor speeds');});}
function pack(id,name){return {id:id,name:name,every:'any',timed:true,equipment:['Packing machine','Carton sealer','Pallet wrapper','Conveyor'],params:[
  N('pallets','Pallets completed','pcs','Production',{total:true}),N('ptype','Production type (e.g. AL-TAJ)','','Production',{kind:'text'}),
  N('film_waste','Film wastage','kg','Film and carton wastage',{total:true,pack:true}),N('scotch','Scotch used in carton','cartons','Film and carton wastage',{total:true,pack:true}),N('dmg_carton','Damaged carton','pcs','Film and carton wastage',{total:true,pack:true}),
  N('flour','Flour used','cartons','Raw material',{total:true,pack:true}),N('semolina','Semolina used','cartons','Raw material',{total:true,pack:true}),N('regr_used','Regrinding used','cartons','Raw material',{total:true,pack:true}),N('regr_prod','Regrinding produced','cartons','Raw material',{total:true,pack:true})]};}
function lab(id,name,zones){return {id:id,name:name,every:'any',timed:true,noStatus:true,equipment:['Moisture analyzer','Drying oven','Balance'],params:[N('zone','Zone','','Sample',{kind:'select',options:zones}),N('result','Moisture result','%','Sample')]};}
const DEFAULT_CFG={
  plantName:'Twin Gulf Industries',
  shifts:[{name:'Day',start:7},{name:'Night',start:19}],
  crews:['A-B','B-C'],
  operators:[],
  areas:[
    {id:'macaroni',name:'Macaroni Line',every:'hour',equipment:['Press','Screw','Vacuum pump','Dryer','Cutter','Cooler'],params:[
      N('pp','Press pressure (P.P)','bar','Press'),N('ht','Head temp (H.T)',C_,'Press'),N('vac','Vacuum (VAC)','','Press'),N('wt','Water temp (W.T)',C_,'Press'),N('wp','Water pressure (W.P)','bar','Press'),N('scs','Screw speed (SC.S)','','Press'),N('cus','Cutter speed (CU.S)','Hz','Press'),N('dl','Dough level (D.L)','','Press'),N('cyt','Cylinder temp (CY.T)',C_,'Press')]
      .concat(sensors(['201','275','291','292','293','294','295','401','309','328T','328H','329T','358T','358H','368T','368H'])) },
    {id:'spaghetti',name:'Spaghetti Line',every:'hour',equipment:['Press','Screw','Vacuum pump','Dryer','Cooler','Stick ventilation'],params:[
      N('sno','Stick number (S.No)','','Press',{kind:'text'}),N('pp','Press pressure (P.P)','bar','Press'),N('ht','Head temp (H.T)',C_,'Press'),N('v','Vacuum (V)','','Press'),N('wt','Water temp (W.T)',C_,'Press'),N('wp','Water pressure (W.P)','bar','Press'),N('scs','Screw speed (SC.S)','','Press'),N('dl','Dough level (D.L)','','Press'),N('cyt','Cylinder temp (CY.T)',C_,'Press'),
      N('ct','Cooler temp (C.T)',C_,'Line'),N('ls','Line speed (L.S)','','Line'),N('hv','Head ventilation temp (H.V)',C_,'Line'),N('stv','Stick ventilation temp (ST.V)',C_,'Stick ventilation'),N('stvs','Stick ventilation speed (ST.V.S)','','Stick ventilation')]

function evalCalc(expr,get){
  let ok=true;
  const t=String(expr).replace(/[A-Za-z_][A-Za-z_0-9]*/g,id=>{const v=get(id);if(v==null){ok=false;return '0';}return '('+v+')';});
  if(!ok||!/^[0-9.+\-*\/() eE]*$/.test(t))return null;
  try{const r=Function('"use strict";return ('+t+')')();return isFinite(r)?Math.round(r*100)/100:null;}catch(x){return null;}
}
const ctl=id=>$('input[data-p="'+id+'"],select[data-p="'+id+'"]');

function refreshCalcs(){

function markField(t){

async function saveEntry(){

    else{const d=new Date(),sec=d.getHours()*3600+d.getMinutes()*60+d.getSeconds();key='s'+sec;min=Math.floor(sec/60);}
  }else{key=String(S.hour);min=S.hour*60;}

  const obj={v,run,down:run?0:Math.max(0,Math.min(timed?720:60,num($('#fDown')?$('#fDown').value:0)||0)),why:run?'':$('#fWhy').value,note:($('#fNote').value||'').trim(),crew:$('#fCrew').value,stopAt:run?'':($('#fStopAt')?$('#fStopAt').value:''),startAt:run?'':($('#fStartAt')?$('#fStartAt').value:''),alarms,empty};

async function writeEntry(areaId,date,key,obj,oldKey){
  const ref=S.db.doc('logs/'+areaId+'_'+date);

}

/* ---- overview ---- */
function dayStats(a,date){
  const doc=S.logs[a.id+'_'+date],es=entries(doc);
  if(a.timed){
    let down=0,alarms=0,due=0,missed=0;const runH={};
    es.forEach(x=>{if(x.e.run===false)down+=x.e.down||0;else runH[x.h]=1;alarms+=x.e.alarms||0;});
    if(a.every==='shift')shiftWindows(date).forEach(w=>{if(!w.ended)return;due++;if(!es.some(x=>w.segs.some(sg=>x.min>=sg[0]&&x.min<sg[1])))missed++;});
    return {logged:es.length,missed,run:Object.keys(runH).length,down,alarms,due,timed:true};
  }
  const hrs={};es.forEach(x=>{hrs[x.h]=x.e;});
  const lastDue=date<S.today?23:(date===S.today?nowH()-1:-1);
  let logged=0,missed=0,run=0,down=0,alarms=0,due=0;
  for(let h=0;h<24;h++){const e=hrs[h];if(e){logged++;if(e.run===false)down+=(e.down||0);else run++;alarms+=e.alarms||0;}
    if(h<=lastDue){due++;if(!e)missed++;}}
  return {logged,missed,run,down,alarms,due};
}
function paintOverview(){
  const body=$('#body');if(!body)return;
  const date=S.ovDate,areas=S.cfg.areas;

   '<div class="kpi'+(sum('down')?' warn':'')+'"><b>'+sum('down')+'</b><span>Downtime minutes</span></div>'+
   '<div class="kpi'+(sum('alarms')?' warn':'')+'"><b>'+sum('alarms')+'</b><span>Readings out of range</span></div>'+

  areas.forEach((a,i)=>{

  });
  html+='</div></div><div class="legend"><span><i style="background:var(--ok);border-color:var(--ok)"></i>Logged</span><span><i style="background:var(--warn);border-color:var(--warn)"></i>Out of range</span><span><i style="background:var(--stop);border-color:var(--stop)"></i>Stopped</span><span><i style="background:var(--okbg);border-style:dashed;border-color:var(--ok)"></i>Partial</span><span><i style="background:var(--badbg);border-color:var(--bad)"></i>Missed</span><span><i></i>Not due (timed areas: lab, RO, packaging)</span></div></section>';
  html+=detailHTML();

function detailHTML(){

  const a=area(S.sel.area),doc=S.logs[S.sel.area+'_'+S.sel.date],es=entries(doc).filter(x=>x.h===S.sel.hour);

  return '<section class="card">'+head+es.map(x=>{const e=x.e;
   const cells=a.params.map(p=>{const v=e.v&&e.v[p.id],st=pState(p,v),isNum=(p.kind||'num')==='num',hi=st==='high'||st==='low';
     return '<div class="'+(hi?'hi':v==null?'empty0':'')+'"><small>'+esc(p.label)+'</small><b>'+(isNum?fmtN(v):esc(v==null?'–':v))+(v!=null&&p.unit&&isNum?' <span class="muted" style="font-size:12px">'+esc(p.unit)+'</span>':'')+(hi?' <span class="chip warn">'+(st==='high'?'High':'Low')+'</span>':'')+'</b></div>';}).join('');

}
function watchHTML(){
  const cut=Date.now()-24*3600e3,out=[];
  S.cfg.areas.forEach(a=>{
    const cnt={};
    Object.keys(S.logs).forEach(id=>{const d=S.logs[id];if(d.area!==a.id)return;entries(d).forEach(x=>{if(entTime(d.date,x.min)<cut)return;a.params.forEach(p=>{const s=pState(p,x.e.v&&x.e.v[p.id]);if(s==='high'||s==='low'){cnt[p.id]=cnt[p.id]||{n:0,s:s};cnt[p.id].n++;}});});});
    a.params.forEach(p=>{if(cnt[p.id]&&cnt[p.id].n>=2)out.push({a:a.name,p:p.label,n:cnt[p.id].n,s:cnt[p.id].s});});
  });
  if(!out.length)return '<div class="empty">No reading has been out of range twice or more in the last 24 hours.</div>';
  return '<table><tbody>'+out.sort((x,y)=>y.n-x.n).map(o=>'<tr><td>'+esc(o.p)+'<div class="muted small">'+esc(o.a)+'</div></td><td class="n"><span class="chip warn">'+o.n+'× '+(o.s==='high'?'high':'low')+'</span></td></tr>').join('')+'</tbody></table><p class="muted small">Repeated drift is an early sign for preventive maintenance on that equipment.</p>';
}
function totalsHTML(date){
  const out=[];
  S.cfg.areas.forEach(a=>{
    const ps=a.params.filter(p=>p.total&&(p.kind||'num')==='num');if(!ps.length)return;
    const doc=S.logs[a.id+'_'+date],tot={};
    entries(doc).forEach(x=>ps.forEach(p=>{const v=num(x.e.v&&x.e.v[p.id]);if(v!=null)tot[p.id]=(tot[p.id]||0)+v;}));
    let rows=ps.map(p=>'<tr><td>'+esc(p.label)+'</td><td class="n mono">'+fmtN(tot[p.id]||0)+' <span class="muted">'+esc(p.unit)+'</span></td></tr>').join('');
    if(tot.film_used&&tot.film_waste!=null)rows+='<tr><td><b>Film wastage rate</b></td><td class="n mono"><b>'+(tot.film_waste/tot.film_used*100).toFixed(1)+' %</b></td></tr>';
    out.push('<h3 style="margin:4px 0">'+esc(a.name)+'</h3><table><tbody>'+rows+'</tbody></table>');
  });
  return out.length?out.join(''):'<div class="empty">Mark readings as a total (Σ) in Setup to see daily totals here.</div>';
}

  $('#trP').onchange=e=>{S.trend.param=e.target.value;paintTrend();};

function paintTrend(){
  const el=$('#chartBody');if(!el)return;
  const ar=area(S.trend.area),p=ar&&ar.params.find(x=>x.id===S.trend.param);if(!p)return;
  const days=S.trend.days,endT=Date.now(),startD=addDays(S.today,-(days-1)),startT=parseYmd(startD).getTime();
  const pts=[];
  Object.keys(S.logs).forEach(id=>{const d=S.logs[id];if(d.area!==ar.id||d.date<startD)return;entries(d).forEach(x=>{const v=num(x.e.v&&x.e.v[p.id]);if(v==null)return;pts.push({t:entTime(d.date,x.min),v});});});
  pts.sort((a,b)=>a.t-b.t);
  if(!pts.length){el.innerHTML='<div class="empty">No “'+esc(p.label)+'” readings in this period yet.</div>';return;}
  const vs=pts.map(x=>x.v);let lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);
  if(p.min!=null)lo=Math.min(lo,p.min);if(p.max!=null)hi=Math.max(hi,p.max);
  if(lo===hi){lo-=1;hi+=1;}const padY=(hi-lo)*0.08;lo-=padY;hi+=padY;
  const W=860,H=300,L=56,R=14,T=14,B=34,pw=W-L-R,ph=H-T-B;
  const X=t=>L+(t-startT)/(endT-startT)*pw,Y=v=>T+(1-(v-lo)/(hi-lo))*ph;
  let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+fmtN(v)+'</text>';}
  if(days===1){for(let h=0;h<=24;h+=3){const t=startT+h*3600e3;if(t>endT)break;g+='<text x="'+X(t)+'" y="'+(H-10)+'" text-anchor="middle">'+pad(h%24)+':00</text>';}}
  else for(let d=0;d<days;d++){const t=startT+d*864e5,q=new Date(t);g+='<line class="grid" x1="'+X(t)+'" x2="'+X(t)+'" y1="'+T+'" y2="'+(T+ph)+'"/><text x="'+(X(t)+4)+'" y="'+(H-10)+'">'+DOW[q.getDay()]+' '+q.getDate()+'</text>';}
  let band='';if(p.min!=null&&p.max!=null)band='<rect class="band" x="'+L+'" y="'+Y(p.max)+'" width="'+pw+'" height="'+(Y(p.min)-Y(p.max))+'"/>';
  let lim='';if(p.max!=null)lim+='<line class="lim" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(p.max)+'" y2="'+Y(p.max)+'"/>';if(p.min!=null)lim+='<line class="lim" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(p.min)+'" y2="'+Y(p.min)+'"/>';
  let path='',prev=null;pts.forEach(q=>{path+=(prev&&q.t-prev<2.5*3600e3?'L':'M')+X(q.t).toFixed(1)+' '+Y(q.v).toFixed(1)+' ';prev=q.t;});
  const dots=pts.map(q=>'<circle class="pt'+(pState(p,q.v)==='ok'?'':' x')+'" cx="'+X(q.t).toFixed(1)+'" cy="'+Y(q.v).toFixed(1)+'" r="3.5"/>').join('');
  const out=pts.filter(q=>pState(p,q.v)!=='ok').length,avg=vs.reduce((a,b)=>a+b,0)/vs.length,last=pts[pts.length-1];
  el.innerHTML='<div class="row small" style="margin-bottom:8px"><span class="chip acc">Last '+fmtN(last.v)+' '+esc(p.unit)+'</span><span class="chip">Avg '+fmtN(avg)+'</span><span class="chip">Min '+fmtN(Math.min.apply(null,vs))+'</span><span class="chip">Max '+fmtN(Math.max.apply(null,vs))+'</span><span class="chip '+(out?'warn':'ok')+'">'+out+' out of range</span><span class="muted">Limits: '+esc(limitText(p))+'</span></div>'+
   '<svg class="ch" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(p.label)+' trend">'+band+g+lim+'<path class="ln" d="'+path+'"/>'+dots+'</svg>';
}
async function exportCsv(){
  const msg=$('#exMsg'),ar=area($('#exA').value),f=$('#exF').value,t=$('#exT').value;
  if(!f||!t||f>t){msg.textContent='Choose a valid date range.';return;}
  msg.textContent='Collecting data…';
  try{
    const snap=await S.db.collection('logs').where('date','>=',f).where('date','<=',t).limit(1000).get();
    const docs=snap.docs.map(d=>d.data()).filter(d=>d.area===ar.id).sort((a,b)=>a.date<b.date?-1:1);
    const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
    const head=['Date','Time','Shift','Crew','Operator','Running','Downtime min','Downtime reason'].concat(ar.params.map(p=>p.label+' ('+p.unit+')'),['Out of range','Late entry','Notes']);
    const rows=[head.map(q).join(',')];let n=0;
    docs.forEach(d=>entries(d).forEach(x=>{const e=x.e;n++;
      rows.push([d.date,hm(x.min),shiftOf(x.h),e.crew||'',e.by,e.run===false?'No':'Yes',e.down||0,e.why||''].concat(ar.params.map(p=>e.v&&e.v[p.id]!=null?e.v[p.id]:''),[e.alarms||0,e.late?'Yes':'',e.note||'']).map(q).join(','));}));
    if(!n){msg.textContent='No readings for that area and period.';return;}
    const dl=await window.claude.use('downloads');
    if(!dl){msg.textContent='Download is not available in this view.';return;}
    await dl.save({filename:ar.id+'_'+f+'_to_'+t+'.csv',data:'﻿'+rows.join('\r\n')});
    msg.textContent=n+' rows exported.';
  }catch(e){msg.textContent=(e&&e.code==='declined')?'Download cancelled.':dbErr(e);}
}

/* ---- maintenance ---- */
function allLogs(){return Object.assign({},S.mlogs,S.logs);}
function pmState(t){
  const base=(t.lastDone||S.today)+pad(t.lastHour||0),logs=allLogs();let hrs=0;
  Object.keys(logs).forEach(id=>{const d=logs[id];if(d.area!==t.area)return;const seen={};entries(d).forEach(x=>{const kk=d.date+pad(x.h);if(kk>=base&&x.e.run===true&&!seen[kk]){seen[kk]=1;hrs++;}});});
  const days=daysBetween(t.lastDone||S.today,S.today);
  const rh=t.intervalHours>0?hrs/t.intervalHours:0,rd=t.intervalDays>0?days/t.intervalDays:0,r=Math.max(rh,rd);
  return {hrs,days,r,status:r>=1?'overdue':r>=0.9?'soon':'ok'};
}

async function saveTask(){

   '<label class="small" style="display:flex;gap:4px;align-items:center" title="Hourly total, summed into daily totals"><input type="checkbox" class="s-tot" style="width:20px;height:20px"'+(p.total?' checked':'')+'>Σ</label><button type="button" class="btn sm bad s-del" aria-label="Remove reading">✕</button></div>';
}
function opRow(o){return '<div class="orow" data-id="'+esc(o.id)+'"><input type="text" class="o-name" value="'+esc(o.name)+'" placeholder="Operator name" aria-label="Operator name"><input type="password" class="o-pw" autocomplete="new-password" placeholder="'+(o.hash?'unchanged':'new password')+'" aria-label="Password"><label class="small" style="display:flex;gap:4px;align-items:center" title="Shift leaders can enter data after the time windows and change saved entries"><input type="checkbox" class="o-lead" style="width:20px;height:20px"'+(o.leader?' checked':'')+'>Leader</label><label class="small" style="display:flex;gap:4px;align-items:center"><input type="checkbox" class="o-act" style="width:20px;height:20px"'+(o.active===false?'':' checked')+'>Active</label><button type="button" class="btn sm bad o-del" aria-label="Remove operator">✕</button></div>';}
function setupShell(){
  const c=S.cfg;
  return '<section class="card"><h2>Plant</h2><div class="ctlrow"><label class="l" style="flex:2 1 260px">Plant name<input type="text" id="sName" value="'+esc(c.plantName)+'"></label>'+
   c.shifts.map((s,i)=>'<label class="l">Shift '+esc(s.name)+' starts (hour)<input type="number" min="0" max="23" class="sShift" data-i="'+i+'" value="'+s.start+'"></label>').join('')+'</div>'+
   '</section><section class="card" id="opSec"><h2>Operators and passwords</h2><p class="muted small">Operators type their password to save a reading, and the app shows and records their name. Tick Leader for shift leaders: they can enter data after the time windows close and change saved entries. Each password must be different. Leave a password blank to keep it unchanged.</p>'+
   '<div id="opList">'+S.ops.map(opRow).join('')+'</div><div class="row" style="margin-top:8px"><button type="button" class="btn sm" id="opAdd">Add operator</button></div></section>'+
   c.areas.map(a=>'<section class="card" data-area="'+esc(a.id)+'"><h2>'+esc(a.name)+'</h2><p class="muted small">Limits that are blank are not checked. “Σ” marks a reading that is a total for the hour (packs, kg) and is added up into daily totals. No limits are set yet: type the normal min and max for each reading and the app will flag values outside them.</p>'+
    '<div class="prow h"><span>Reading</span><span>Group</span><span>Unit</span><span>Min</span><span>Max</span><span>Σ</span></div><div class="plist">'+a.params.map(paramRow).join('')+'</div>'+
    '<div class="row" style="margin-top:8px"><button type="button" class="btn sm s-add">Add reading</button></div>'+
    '<label class="l" style="margin-top:12px">Equipment in this area (one per line, used for problem reports and maintenance)<textarea class="s-eq">'+esc(a.equipment.join('\n'))+'</textarea></label></section>').join('')+
   '<div class="row"><button class="btn pri big" id="sSave">Save setup</button><button class="btn" id="sReset">Restore starter setup</button></div>';
}
function bindSetup(){
  const t=$('#tab');
  t.oninput=()=>{S.setupEditing=true;};
  t.onclick=e=>{
    const od=e.target.closest('.o-del');if(od){od.closest('.orow').remove();S.setupEditing=true;return;}
    if(e.target.closest('#opAdd')){$('#opList').insertAdjacentHTML('beforeend',opRow({id:'o_'+Date.now().toString(36)+Math.floor(Math.random()*99),name:'',hash:'',active:true,leader:false}));$('#opList').lastElementChild.querySelector('input').focus();S.setupEditing=true;return;}
    const del=e.target.closest('.s-del');if(del){del.closest('.prow').remove();S.setupEditing=true;return;}
    const add=e.target.closest('.s-add');if(add){const l=add.closest('section').querySelector('.plist');l.insertAdjacentHTML('beforeend',paramRow({id:'p_'+Date.now().toString(36)+Math.floor(Math.random()*99),label:'',unit:'',group:'',min:null,max:null,total:false}));l.lastElementChild.querySelector('input').focus();S.setupEditing=true;}
  };
  $('#sSave').onclick=saveSetup;
  $('#sReset').onclick=async()=>{if(!await ask({title:'Restore the starter setup?',msg:'Readings, limits and units return to the starter list. Operators are not changed.',ok:'Yes, restore'}))return;try{await S.db.doc('config/main').delete();S.setupEditing=false;toast('Starter setup restored.');}catch(e){toast(dbErr(e),true);}};
}
async function saveSetup(){
  const cfg={plantName:$('#sName').value.trim()||'Plant Logbook',crews:S.cfg.crews||['A-B','B-C'],shifts:S.cfg.shifts.map((s,i)=>({name:s.name,start:Math.max(0,Math.min(23,Number($('.sShift[data-i="'+i+'"]').value)||0))})),
    operators:[],areas:[]};
  $$('section[data-area]').forEach(sec=>{
    const base=area(sec.dataset.area),params=[];
    $$('.prow',sec).forEach(r=>{if(r.classList.contains('h'))return;const label=$('.s-label',r).value.trim();if(!label)return;
      params.push({id:r.dataset.id,label,group:$('.s-group',r).value.trim(),unit:$('.s-unit',r).value.trim(),min:num($('.s-min',r).value),max:num($('.s-max',r).value),total:$('.s-tot',r).checked,kind:r.dataset.kind||'num',calc:r.dataset.calc||'',options:JSON.parse(r.dataset.opts||'[]'),win:JSON.parse(r.dataset.win||'null')||undefined});});
    cfg.areas.push({id:base.id,name:base.name,every:base.every||'hour',timed:!!base.timed,noStatus:!!base.noStatus,noStatus:!!base.noStatus,equipment:$('.s-eq',sec).value.split('\n').map(s=>s.trim()).filter(Boolean),params});
  });
  const rows=$$('#opList .orow').map(r=>({id:r.dataset.id,name:$('.o-name',r).value.trim(),plain:$('.o-pw',r).value,active:$('.o-act',r).checked,leader:$('.o-lead',r).checked})).filter(r=>r.name||r.plain);
  const list=[];
  for(const r of rows){
    const old=S.ops.find(o=>o.id===r.id);
    if(!r.name){toast('Every operator needs a name.',true);return;}
    if(!old&&!r.plain){toast('Set a password for '+r.name+'.',true);return;}
    if(r.plain&&r.plain.length<4){toast('Passwords need at least 4 characters ('+r.name+').',true);return;}
    list.push(r.plain?{id:r.id,name:r.name,active:r.active,leader:r.leader,salt:'',hash:'',plain:r.plain}:{id:r.id,name:r.name,active:r.active,leader:r.leader,salt:old.salt,hash:old.hash});
  }
  for(const o of list){if(!o.plain)continue;
    for(const q of list){if(q===o)continue;if((q.plain&&q.plain===o.plain)||(!q.plain&&await hashPw(q.salt,o.plain)===q.hash)){toast('The password for '+o.name+' is already used by '+q.name+'. Passwords must be different.',true);return;}}
    o.salt=newSalt();o.hash=await hashPw(o.salt,o.plain);}
  if(!await ask({title:'Do you want to save?',msg:'Save the plant setup and '+list.length+' operator'+(list.length===1?'':'s')+'.',ok:'Yes, save'}))return;
  try{
    await S.db.doc('config/main').set(cfg);
    await S.db.doc('config/operators').set({list:list.map(o=>({id:o.id,name:o.name,active:o.active,leader:!!o.leader,salt:o.salt,hash:o.hash}))});
    S.setupEditing=false;toast('Setup saved. Tablets update automatically.');
  }catch(e){toast(dbErr(e),true);}
}

/* ---------- config sync ---------- */
function onCfg(){
  renderTop();
  if(S.view==='home')renderHome();
  if(S.view==='area'&&!S.dirty){refreshStrip();renderForm();}
  if(S.view==='admin'){if(S.tab==='setup'&&!S.setupEditing)buildTab();else if(S.tab!=='setup'){if(S.tab==='trends'||S.tab==='maint')buildTab();else paintTab();}}
}

/* ---------- boot ---------- */
async function boot(){
  renderTop();renderHome();
  try{
    const c=window.claude;
    if(c&&c.use){
      const res=await Promise.all([c.use('db'),c.use('user')]);
      S.db=res[0];S.user=res[1];
    }
  }catch(e){}
  if(S.user){
    try{S.isAdmin=!!(await S.user.canEdit());}catch(e){}
    try{const w=await S.user.can('data.write');S.canWrite=(w!==false);}catch(e){}
  }
  if(!S.db){renderTop();renderHome();return;}
  S.db.doc('config/main').onSnapshot(snap=>{
    let c=DEFAULT_CFG;
    if(snap.exists){const d=snap.data();if(d&&Array.isArray(d.areas)&&d.areas.length&&Array.isArray(d.shifts))c=migrateCfg(JSON.parse(JSON.stringify(Object.assign({},DEFAULT_CFG,d,{operators:d.operators||[]}))));}
    const j=JSON.stringify(c);if(j===S.cfgJ&&S.cfgLoaded)return;
    S.cfg=c;S.cfgJ=j;S.cfgLoaded=true;onCfg();
  },e=>toast(dbErr(e),true));
  S.db.doc('config/operators').onSnapshot(snap=>{
    const d=snap.exists?snap.data():null;S.ops=d&&Array.isArray(d.list)?d.list:[];
    if(S.view==='admin'&&S.tab==='setup'&&!S.setupEditing)buildTab();
  },e=>toast(dbErr(e),true));
  const v=lsGet('plant.view')||'';
  if(v==='admin'&&S.isAdmin)go('admin',null,'overview');
  else if(v.indexOf('area:')===0&&area(v.slice(5)))go('area',v.slice(5));
  else{renderTop();renderHome();}
}
boot();
})();
</script>

<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
